# ============================================================================
# src/admin/config/custom.yml — 顧客固有の追加コレクション用プレースホルダー
#
# このファイルは、このマスターテンプレートを実案件（顧客リポジトリ）へ
# 複製した際に、その案件だけに必要な追加コレクション・フィールドを
# 追記するための場所です（納品済みの顧客テンプレートの一括アップデート.md
# 「② コンフリクトを防ぐ構造分離の原則」参照）。
#
# 【運用ルール】
# ・マスターテンプレート側では空のまま維持する（コア機能は base.yml /
#   settings.yml / works.yml / pages.yml / news.yml 側に実装すること）。
# ・顧客リポジトリでは、このファイルにのみ追記する（他の分割ファイルは
#   マスターからの一括アップデート時に上書きされる想定のため、顧客固有の
#   変更を書き込むと次回アップデートで失われる）。
# ・ここに追加する内容は、他のモジュール（collectionsのリスト項目）と
#   同じインデント（半角スペース2つ）で `- name: "..."` から書き始める。
#   例：
#     - name: "customPromotions"
#       label: "キャンペーン設定（顧客独自）"
#       files:
#         - name: "promotions"
#           label: "キャンペーン一覧"
#           file: "src/data/promotions.yml"
#           fields:
#             - { label: "見出し", name: "heading", widget: string, required: false }
#
# 【結合順序】base.yml → settings.yml → works.yml → pages.yml → news.yml →
# このファイル、の順（scripts/build-config.js の MODULE_ORDER 参照）。
# 既存コレクションのYAMLアンカー（&pageIdentityName 等）は、このファイル
# からもエイリアス参照できる（結合順序上、必ず後に来るため）。
#
# このファイル自体に有効なYAML内容が無い（コメントのみ）場合、
# build-config.js は何も追加せず、生成される config.yml の内容には
# 一切影響しない。
# ============================================================================
