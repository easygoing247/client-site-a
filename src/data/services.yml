heading: サービス内容・料金
lead: |-
  目的や規模に合わせて選べるサービスをご用意しています。
  料金はすべて税抜表示です。詳細はお気軽にご相談ください。
items:
  - title: Webサイト制作
    description: |-
      コーポレートサイトやサービスサイトなど、
      目的に合わせたWebサイトを企画・デザイン・実装まで一貫して制作します。
    image: ../assets/service-website.jpg
    features:
      - 要件ヒアリング・構成設計
      - デザイン制作（PC/スマホ）
      - コーディング・CMS実装
  - title: LP制作
    description: 商品・サービスの魅力を伝え、成果につながるランディングページを制作します。
    image: ../assets/service-lp.jpg
    features:
      - 訴求設計・ワイヤーフレーム
      - デザイン・コーディング
      - 表示速度の最適化
  - title: SEO・集客支援
    description: 検索エンジンに強い構造設計とコンテンツで、集客・成果をサポートします。
    image: ../assets/service-seo.jpg
    features:
      - 内部SEO設計
      - コンテンツ企画
      - 効果測定・改善提案
  - title: SEO・集客支援
    description: 検索エンジンに強い構造設計とコンテンツで、集客・成果をサポートします。
    image: /src/assets/ceo-image.png
    features:
      - ｄふぁｄｓｆ
priceTable:
  - name: Webサイト制作（5ページ程度）
    price: 300000
    note: 追加ページは1ページ¥20,000〜
  - name: LP制作（1ページ）
    price: 150000
    note: 取材・撮影は別途お見積り
  - name: 月額運用サポート
    price: 20000
    note: 更新代行・保守・改善提案を含む
priceNote: |-
  記載の金額は税抜きの目安です。
  ご要望の内容に応じて個別にお見積りいたします。
