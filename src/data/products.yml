# ============================================================================
# src/data/products.yml — 「商品作成（型化ページ）」
# CMS の「商品作成」コレクションで管理する単一ファイル。items はドラッグ&ドロップで
# 並び替え・追加・削除できる可変リスト（型化ページ＝1ファイル1ページ、ではなく、
# 1ファイル内のリスト構造）。
# トップページ「商品一覧」セクション（先頭 N 件。N は siteInfo.yml の
# productsSection.count）と /products ページ（section で仕分けた2セクション）の
# 両方がこのデータを単一の情報源として参照する（src/lib/pages.ts の
# resolveProductItems() 経由）。
# ============================================================================
