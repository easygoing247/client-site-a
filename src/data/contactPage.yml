pageName: お問い合わせ
heading: お問い合わせ
intro: |-
  ご相談・お見積りは無料です。
  下記フォームまたはお電話よりお気軽にお問い合わせください。
notes:
  - 内容によってはご返信までお時間をいただく場合があります。
  - いただいた個人情報はお問い合わせ対応の目的以外には使用しません。
  - 営業目的のご連絡はお断りしております。
formFields:
  name:
    enabled: true
    label: お名前
    placeholder: 山田 太郎
    required: true
  company:
    enabled: true
    label: 会社名
    placeholder: 株式会社サンプル
    required: false
  email:
    enabled: true
    label: メールアドレス
    placeholder: example@example.com
    required: true
  phone:
    enabled: true
    label: 電話番号
    placeholder: 090-1234-5678
    required: false
  message:
    enabled: true
    label: お問い合わせ内容
    placeholder: お問い合わせ内容をご記入ください
    required: true
custom_fields:
  - type: text
    enabled: true
    required: false
    label: テストフィールド
    name: test-field
    placeholder: テストフィールドです
privacyPolicy:
  heading: プライバシーポリシー
  body: |-
    当社は、お客様からお預かりする個人情報の重要性を認識し、
    個人情報の保護に関する法律その他関係法令を遵守します。

    ## 1. 個人情報の利用目的

    お問い合わせ対応、サービスのご案内、契約の履行のために利用します。

    ## 2. 第三者提供

    法令に基づく場合を除き、本人の同意なく第三者に提供することはありません。

    ## 3. お問い合わせ窓口

    個人情報の取り扱いに関するお問い合わせは、当ページのフォームよりご連絡ください。
  updatedAt: 2026年9月9日
