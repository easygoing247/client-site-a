hero:
  heading: 想いをカタチに、<br />成果につながるWebを。
  body: シンプルで伝わるデザインと、<br class="sm:hidden" />使いやすいWebサイトで<br class="hidden
    sm:inline md:hidden" />ビジネスの成長をサポートします。
  ctaLabel: 無料で相談する
  ctaHref: "#contact"
  image: /src/assets/hero.jpg
  imageAlt: Web制作の作業風景（ノートパソコンでコーディングする様子）
  badges:
    - 相談無料
    - 最短1週間で対応
    - 安心のサポート体制
features_section:
  eyebrow: FEATURES
  heading: 選ばれる3つの理由
  items:
    - number: "01"
      title: 高品質デザイン
      text: 目的に合わせたデザインで、信頼感と成果を生むサイトを制作します。
      icon: ../assets/icon-design.png
    - number: "02"
      title: スマホ最適化
      text: スマートフォンでの見やすさ・使いやすさを重視した設計で離脱を防ぎます。
      icon: ../assets/icon-mobile.png
    - number: "03"
      title: 手厚いサポート
      text: 公開後の運用・改善まで伴走し、継続的な成果につなげる支援を行います。
      icon: ../assets/icon-support.png
services:
  eyebrow: SERVICE
  heading: サービス・事業内容
  items:
    - title: Webサイト制作
      text: コーポレートサイトやサービスサイトなど、目的に合わせたWebサイトを制作します。
      image: ../assets/service-website.jpg
    - title: LP制作
      text: 商品・サービスの魅力を伝え、成果につながるランディングページを制作します。
      image: ../assets/service-lp.jpg
    - title: SEO・集客支援
      text: 検索エンジンに強い構造設計とコンテンツで、集客・成果をサポートします。
      image: ../assets/service-seo.jpg
    - title: 運用・保守サポート
      text: 更新作業やセキュリティ対策など、安心して運用できる体制を提供します。
      image: ../assets/service-support.jpg
flow:
  eyebrow: FLOW
  heading: ご相談から納品までの流れ
  steps:
    - number: 1
      title: ヒアリング・ご相談
      text: 現状の課題やご要望をお伺いし、方向性をすり合わせます。
    - number: 2
      title: ご提案・お見積り
      text: 最適なプランと構成をご提案し、費用・スケジュールを提示します。
    - number: 3
      title: デザイン制作
      text: ヒアリング内容をもとに、サイトの構成・デザインを作成します。
    - number: 4
      title: コーディング・実装
      text: デザインをもとにコーディングを行い、動作確認を重ねます。
    - number: 5
      title: 公開・納品
      text: 最終確認のうえサイトを公開し、納品後もサポートを継続します。
