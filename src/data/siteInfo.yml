  points:
    - 24時間以内にご返信します
    - オンライン打ち合わせ可能
    - 無理な営業は一切しません
  form:
    submitLabel: 送信する
    sendingLabel: 送信中...
    successMessage: お問い合わせを受け付けました。担当者よりご連絡いたします。
    errorMessage: 送信に失敗しました。時間をおいて再度お試しください。
