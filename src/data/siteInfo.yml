faq:
  eyebrow: FAQ
  heading: よくある質問
  items:
    - q: 制作期間はどのくらいですか？
      a: 内容・規模によりますが、コーポレートサイトで4〜6週間、LPで2〜3週間が目安です。ご要望に応じてスケジュールをご相談いたします。
    - q: 原稿や写真がなくても依頼できますか？
      a: はい、可能です。ヒアリングをもとに構成・コピーの草案をご提案し、必要な素材もご相談のうえ準備いたします。
    - q: 公開後のサポートはありますか？
      a: 公開後の更新作業やセキュリティ対策、改善提案まで継続的にサポートするプランをご用意しています。
