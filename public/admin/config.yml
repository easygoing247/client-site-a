# ============================================================================
# public/admin/config.yml — Decap CMS 設定
# ・backend は GitHub 直接連携（OAuth）。Git Gateway（Netlify Identity）は
#   使用しない。GitHubリポジトリへ直接コミットする方式のため、CMSへの
#   ログインには GitHub OAuth App の登録と、そのOAuthフローを仲介する
#   認可サーバーが必要。ここでは自前の Cloudflare Worker（cms-oauth-worker/、
#   base_url に指定）をOAuthプロキシとして使用している。
#   参考: https://decapcms.org/docs/github-backend/
# ・/admin 自体へのアクセス制限は、デプロイ後に Cloudflare Access 等で行う
#   （このリポジトリのコードでは認可制御を行わない。CLAUDE.md 参照）。
# ・システムの構造上必須な識別子（下記「セクション表示順序」の
#   セレクト値等）を除き、原則すべてのフィールドを required: false
#   （任意入力）にしている。未入力の場合、サイト側の各コンポーネントが
#   対応する表示要素を自動的に非表示にする。
# ============================================================================

backend:
  name: github
  repo: easygoing247/master-template-multi
  branch: main
  base_url: https://master-template-oauth.easygoing247.workers.dev
  auth_endpoint: /auth

# ローカル動作確認用：`npm run cms:proxy`（別ターミナルで decap-server を起動）と
# 併用すると、GitHub OAuth なしで localhost 上のファイルへ直接読み書きできる。
# 本番ビルド（Cloudflare Pages等）にデプロイした際は、localhost以外では
# 自動的に無視され、上の github backend（OAuth経由）が使われる。
local_backend: true

# 本番サイトのURL。CMS内の「サイトを表示」リンクやプレビューの絶対URL基準に使われる。
site_url: "https://master-template-multi.easygoing247.workers.dev"
display_url: "https://master-template-multi.easygoing247.workers.dev"

# アップロードした画像の保存先（Astroの src/assets を直接指すことで、
# CMSから差し替えた画像も astro:assets の最適化対象になる）
media_folder: "src/assets"
public_folder: "/src/assets"

locale: "ja"

collections:
  # ==========================================================================
  # ① ファイルコレクション：siteInfo.yml を丸ごと編集
  #    表示順は「ヒーロー→セクション表示順序の並び→基本情報・共通設定→
  #    その他→コピーライト→セクションの表示・非表示→商品ページ共通文言」
  #    の順に固定している（管理画面での探しやすさのため）。
  # ==========================================================================
  - name: "settings"
    label: "サイト設定"
    files:
      - name: "siteInfo"
        label: "サイト全体設定（siteInfo.yml）"
        file: "src/data/siteInfo.yml"
        fields:
          # --- 1. ヒーローセクション（固定で一番上） -----------------------
          - label: "ヒーローセクション"
            name: "hero"
            widget: object
            fields:
              - { label: "見出し（Enterキーで改行、HTML（<br />等）も使用可）", name: "heading", widget: text, required: false }
              - { label: "本文（Enterキーで改行、HTML（<br />等）も使用可）", name: "body", widget: text, required: false }
              - { label: "CTAボタン文言", name: "ctaLabel", widget: string, required: false }
              - { label: "CTAボタン遷移先", name: "ctaHref", widget: string, required: false }
              - { label: "背景画像", name: "image", widget: image, required: false }
              - { label: "画像 代替テキスト", name: "imageAlt", widget: string, required: false }
              - label: "バッジ（3〜4個推奨）"
                name: "badges"
                widget: list
                required: false
                field: { label: "バッジ文言", name: "badge", widget: string, required: false }

          # --- 1b. お知らせセクション（ヒーローと「選ばれる理由」の間に固定表示） ---
          - label: "お知らせセクション（トップページ）"
            name: "newsSection"
            widget: object
            hint: "トップページのヒーローと「選ばれる3つの理由」の間に表示されるお知らせ一覧。表示のON/OFFは下部の「セクションの表示・非表示」で切り替えます。"
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "トップページに表示する件数", name: "count", widget: number, value_type: int, default: 3, min: 1, max: 10 }
              - { label: "一覧ページへのリンク文言（例：お知らせ一覧へ）", name: "linkLabel", widget: string, required: false }
              - { label: "リンク先", name: "linkHref", widget: string, required: false, default: "/news" }

          # --- 2. 「セクション表示順序」に含まれる各セクション -------------
          - label: "選ばれる理由"
            name: "features_section"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - label: "項目"
                name: "items"
                widget: list
                required: false
                fields:
                  - { label: "番号", name: "number", widget: string, required: false }
                  - { label: "タイトル", name: "title", widget: string, required: false }
                  - { label: "本文（Enterキーで改行可）", name: "text", widget: text, required: false }
                  - { label: "アイコン画像", name: "icon", widget: image, required: false }

          - label: "サービス"
            name: "services"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "下層ページへのリンク文言（例：サービス内容を見る）", name: "linkLabel", widget: string, required: false, hint: "未入力の場合、セクション内のリンクボタンは表示されません。" }
              - { label: "リンク先", name: "linkHref", widget: string, required: false, default: "/services" }
              - label: "サービス項目"
                name: "items"
                widget: list
                required: false
                fields:
                  - { label: "タイトル", name: "title", widget: string, required: false }
                  - { label: "本文（Enterキーで改行可）", name: "text", widget: text, required: false }
                  - { label: "画像", name: "image", widget: image, required: false }

          - label: "制作の流れ"
            name: "flow"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - label: "ステップ"
                name: "steps"
                widget: list
                required: false
                fields:
                  - { label: "番号", name: "number", widget: number, value_type: int, required: false }
                  - { label: "タイトル", name: "title", widget: string, required: false }
                  - { label: "本文（Enterキーで改行可）", name: "text", widget: text, required: false }

          - label: "商品一覧（竹/松プラン）"
            name: "productsSection"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }

          - label: "実績"
            name: "works"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - label: "実績項目"
                name: "items"
                widget: list
                required: false
                fields:
                  - { label: "タイトル", name: "title", widget: string, required: false }
                  - { label: "本文（Enterキーで改行可）", name: "industry", widget: text, required: false }
                  - { label: "タグ", name: "tag", widget: string, required: false }
                  - { label: "画像", name: "image", widget: image, required: false }

          - label: "料金プラン"
            name: "plans"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "注記文", name: "note", widget: string, required: false }
              - { label: "人気プランバッジ文言", name: "popularBadgeLabel", widget: string, required: false }
              - { label: "各プランカードのボタン文言（例：詳しく見る）", name: "buttonLabel", widget: string, required: false, hint: "未入力の場合、カード内のボタンは表示されません。人気プランバッジONのプランはボタンが強調表示されます。" }
              - { label: "ボタンのリンク先", name: "buttonHref", widget: string, required: false, default: "/services" }
              - label: "プラン"
                name: "items"
                widget: list
                required: false
                fields:
                  - { label: "プラン名", name: "name", widget: string, required: false }
                  - { label: "説明", name: "description", widget: string, required: false }
                  - { label: "価格（税抜・数値）", name: "price", widget: number, value_type: int, required: false }
                  - { label: "人気プランバッジを表示", name: "popular", widget: boolean, default: false }
                  - label: "含まれる内容"
                    name: "features"
                    widget: list
                    required: false
                    field: { label: "項目", name: "feature", widget: string, required: false }

          - label: "アクセス"
            name: "access"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - label: "店舗情報"
                name: "store"
                widget: object
                fields:
                  - { label: "店舗名", name: "name", widget: string, required: false }
                  - { label: "郵便番号", name: "postalCode", widget: string, required: false }
                  - { label: "住所", name: "address", widget: string, required: false }
                  - { label: "最寄り駅", name: "nearestStation", widget: string, required: false }
                  - { label: "営業時間", name: "businessHours", widget: string, required: false }
                  - { label: "定休日", name: "closedDays", widget: string, required: false }
                  - { label: "駐車場", name: "parking", widget: string, required: false }
                  - { label: "Googleマップ埋め込みURL", name: "mapEmbedUrl", widget: string, required: false }
                  - { label: "店舗外観画像", name: "image", widget: image, required: false }
                  - { label: "店舗外観 代替テキスト", name: "imageAlt", widget: string, required: false }
              - label: "項目ラベル"
                name: "labels"
                widget: object
                hint: "各項目の行は、ここのラベルまたは右側の店舗情報の値のどちらかが空欄の場合、サイト上で自動的に非表示になります。"
                fields:
                  - { label: "郵便番号", name: "postalCode", widget: string, required: false }
                  - { label: "住所", name: "address", widget: string, required: false }
                  - { label: "最寄り駅", name: "nearestStation", widget: string, required: false }
                  - { label: "電話番号", name: "phone", widget: string, required: false }
                  - { label: "営業時間", name: "businessHours", widget: string, required: false }
                  - { label: "定休日", name: "closedDays", widget: string, required: false }
                  - { label: "駐車場", name: "parking", widget: string, required: false }
                  - { label: "公式SNS", name: "sns", widget: string, required: false }

          - label: "FAQ"
            name: "faq"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - label: "質問項目"
                name: "items"
                widget: list
                required: false
                fields:
                  - { label: "質問", name: "q", widget: string, required: false }
                  - { label: "回答（Enterキーで改行可）", name: "a", widget: text, required: false }

          - label: "お問い合わせ"
            name: "contactSection"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "本文（Enterキーで改行、HTML（<br />等）も使用可）", name: "body", widget: text, required: false }
              - label: "アピールポイント"
                name: "points"
                widget: list
                required: false
                field: { label: "ポイント", name: "point", widget: string, required: false }
              - label: "送信ボタン・送信結果メッセージ"
                name: "form"
                widget: object
                hint: "各入力欄のラベル・プレースホルダー・必須／表示切替は「下層ページ ＞ お問い合わせ・ご予約」の「フォーム入力項目の設定」で編集します。"
                fields:
                  - { label: "送信ボタン文言", name: "submitLabel", widget: string, required: false }
                  - { label: "送信中のボタン文言", name: "sendingLabel", widget: string, required: false }
                  - { label: "送信成功時のメッセージ", name: "successMessage", widget: text, required: false }
                  - { label: "送信失敗時のメッセージ", name: "errorMessage", widget: text, required: false }
              # ※ 送信先（Web3Formsキー）・通知メールの件名／送信者名は
              #   独立ファイル項目「お問い合わせフォーム設定」（contact-form.json）。

          # --- 3. 会社・サイト基本情報 --------------------------------------
          - label: "会社・サイト基本情報"
            name: "company"
            widget: object
            fields:
              - { label: "会社名", name: "name", widget: string, required: false }
              - { label: "ロゴ画像", name: "logo", widget: image, required: false }
              - { label: "サイトタイトル（<title>用）", name: "siteName", widget: string, required: false }
              - { label: "キャッチコピー（内部用）", name: "tagline", widget: string, required: false }
              - { label: "サイト説明文（meta description）", name: "description", widget: text, required: false }
              - { label: "代表者名", name: "representative", widget: string, required: false }
              - { label: "設立年", name: "establishedYear", widget: number, value_type: int, required: false }
              - { label: "OGP画像（SNSシェア時のサムネイル）", name: "ogImage", widget: image, required: false }

          # --- 4. 連絡先 ---------------------------------------------------
          - label: "連絡先"
            name: "contact"
            widget: object
            fields:
              - { label: "電話番号（表示用）", name: "phone", widget: string, required: false }
              - { label: "電話番号（tel:リンク用）", name: "phoneHref", widget: string, required: false }
              - { label: "メールアドレス", name: "email", widget: string, required: false }
              - { label: "「お電話」ボタン文言（スマホ下部固定バー）", name: "phoneLabel", widget: string, required: false }
              - { label: "「LINEで相談」ボタン文言（スマホ下部固定バー）", name: "lineLabel", widget: string, required: false }
              - { label: "「お電話」ボタンを表示する（スマホ下部固定バー）", name: "showPhoneButton", widget: boolean, default: true, hint: "「お電話」「LINEで相談」の2つのボタンは、このスイッチと対応する値（電話番号／LINEのURL）の両方が揃っている場合のみ表示されます。両方表示なら半分ずつ、片方のみなら全幅、両方非表示ならバー自体が表示されません。LINEのURLは下の「SNS設定」で管理します。" }
              - { label: "「LINEで相談」ボタンを表示する（スマホ下部固定バー）", name: "showLineButton", widget: boolean, default: true }

          # --- 4b. SNS設定（サイト全体で一括管理。連絡先から独立） -----------
          - label: "SNS設定"
            name: "sns"
            widget: list
            required: false
            label_singular: "SNS"
            summary: "{{fields.id}}（{{fields.url}}）"
            hint: "各SNSの公式アカウントURLと表示ON/OFFをまとめて管理します。ドラッグ&ドロップの並び順が、トップページ「店舗概要・アクセス」・会社概要ページの「公式SNS」・フッターなど、SNSアイコンを掲載するすべての箇所の表示順になります。「表示する」をOFFにするか、URLが未入力のSNSはアイコンが表示されません。スマホ下部バーの「LINEで相談」ボタンも、この LINE のURL／表示ON/OFFを参照します。"
            fields:
              - label: "SNS"
                name: "id"
                widget: select
                options:
                  - { label: "LINE", value: "line" }
                  - { label: "Instagram", value: "instagram" }
                  - { label: "X（旧Twitter）", value: "x" }
                  - { label: "Facebook", value: "facebook" }
                  - { label: "YouTube", value: "youtube" }
              - { label: "URL", name: "url", widget: string, required: false }
              - { label: "このSNSを表示する", name: "enabled", widget: boolean, default: true }

          # --- 5. 共通UI文言 -------------------------------------------------
          - label: "共通UI文言"
            name: "ui"
            widget: object
            fields:
              - { label: "「プライバシーポリシー」リンク文言", name: "privacyPolicyLabel", widget: string, required: false }
              - { label: "お問い合わせフォーム同意文（末尾）", name: "privacyConsentSuffix", widget: string, required: false }
          # ※ お問い合わせフォームの送信設定は、この siteInfo.yml ではなく
          #   独立したファイル項目「お問い合わせフォーム設定」
          #   （src/data/contact-form.json）で管理する（下記 settings コレクション参照）。

          # --- 6. その他既存セクション ---------------------------------------
          - label: "セクション表示順序"
            name: "sectionOrder"
            widget: list
            required: false
            hint: "ドラッグ&ドロップで並び替えると、そのままサイト上の表示順になります（背景の白／グレーの交互配色も自動で追従します）。「セクションの表示・非表示」で非表示にしたセクションは、ここに残っていても表示されません。選択肢の文言は各セクションの「見出し」フィールドの内容に自動で追従します。"
            summary: "{{fields.id}}"
            fields:
              - label: "セクション"
                name: "id"
                widget: select
                options:
                  - { label: "選ばれる3つの理由", value: "features" }
                  - { label: "サービス・事業内容", value: "services" }
                  - { label: "ご相談から納品までの流れ", value: "flow" }
                  - { label: "商品・プラン一覧（型化ページ）", value: "products" }
                  - { label: "実績・活用事例", value: "works" }
                  - { label: "料金プラン", value: "plans" }
                  - { label: "よくある質問", value: "faq" }
                  - { label: "店舗概要・アクセス", value: "access" }
                  - { label: "お問い合わせ", value: "contact" }

          - label: "ヘッダーナビゲーション"
            name: "nav"
            widget: list
            required: false
            fields:
              - { label: "表示名", name: "label", widget: string, required: false }
              - { label: "リンク先", name: "href", widget: string, required: false }

          - label: "ヘッダーCTAボタン"
            name: "navCta"
            widget: object
            fields:
              - { label: "表示名", name: "label", widget: string, required: false }
              - { label: "リンク先", name: "href", widget: string, required: false }

          - label: "フッターナビゲーション"
            name: "footerNav"
            widget: list
            required: false
            fields:
              - { label: "表示名", name: "label", widget: string, required: false }
              - { label: "リンク先", name: "href", widget: string, required: false }

          - label: "共通アイコン"
            name: "icons"
            widget: object
            fields:
              - { label: "チェックマークアイコン", name: "check", widget: image, required: false }

          # --- 7. コピーライト表記 -------------------------------------------
          - { label: "コピーライト表記", name: "copyright", widget: string, required: false }

          # --- 8. セクションの表示・非表示（旧：機能フラグ） -----------------
          - label: "セクションの表示・非表示"
            name: "features"
            widget: object
            hint: "各項目のラベル文言は、対応するセクションの「見出し」フィールドの内容に自動で追従します（上の各セクション設定タブで見出しを変更すると、ここの表示もあわせて更新されます）。"
            fields:
              - { label: "「選ばれる3つの理由」セクションを表示する", name: "enableFeatures", widget: boolean, default: true }
              - { label: "「サービス・事業内容」セクションを表示する", name: "enableServices", widget: boolean, default: true }
              - { label: "「ご相談から納品までの流れ」セクションを表示する", name: "enableFlow", widget: boolean, default: true }
              - { label: "商品・型化ページを表示する（竹/松プラン）", name: "enableProducts", widget: boolean, default: false }
              - { label: "「実績・活用事例」セクションを表示する", name: "enableWorks", widget: boolean, default: true }
              - { label: "「料金プラン」セクションを表示する", name: "enablePlans", widget: boolean, default: true }
              - { label: "「よくある質問」セクションを表示する", name: "enableFaq", widget: boolean, default: true }
              - { label: "「店舗概要・アクセス」セクションを表示する", name: "enableAccess", widget: boolean, default: true }
              - { label: "「お問い合わせ」セクションを表示する", name: "enableContact", widget: boolean, default: true }
              - { label: "「お知らせ」セクションを表示する（トップページ／ヒーロー直下）", name: "enableNews", widget: boolean, default: true }

          # --- 9. 商品・施工事例ページ（共通文言）（一番最下部） -------------
          - label: "商品・施工事例ページ（共通文言）"
            name: "productPage"
            widget: object
            fields:
              - { label: "パンくずリストの「トップ」表示名", name: "breadcrumbHome", widget: string, required: false }
              - { label: "「仕様・含まれる内容」見出し", name: "specsHeading", widget: string, required: false }
              - { label: "相談CTAボタン文言", name: "ctaLabel", widget: string, required: false }

      - name: "siteSettings"
        label: "デザインテーマ設定（site-settings.json）"
        file: "src/data/site-settings.json"
        fields:
          - label: "テーマカラー"
            name: "theme"
            widget: select
            default: "blue"
            hint: "サイト全体のメインカラー（ボタン・リンク・見出し等）をプリセットから切り替えます。保存後、再ビルド・再デプロイで反映されます。"
            options:
              - { label: "ブルー（デフォルト）", value: "blue" }
              - { label: "レッド", value: "red" }
              - { label: "グリーン", value: "green" }
              - { label: "パープル", value: "purple" }
              - { label: "オレンジ", value: "orange" }

      # ----------------------------------------------------------------------
      # 3つ目のファイル項目。「サイト全体設定」「デザインテーマ設定」と並ぶ。
      # お問い合わせフォーム（Contact.astro / contact.astro）の送信先と、
      # Web3Forms 通知メールの件名・送信者名。src/lib/contactFormSettings.ts が参照。
      # ----------------------------------------------------------------------
      - name: "contactFormSettings"
        label: "お問い合わせフォーム設定（contact-form.json）"
        file: "src/data/contact-form.json"
        fields:
          - name: "web3forms_access_key"
            label: "Web3Forms アクセスキー"
            widget: "string"
            required: false
            hint: "Web3Formsで取得した36桁のアクセスキー（e.g. xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx）を入力してください"
          - { label: "通知メールの件名", name: "contact_email_subject", widget: string, required: false }
          - { label: "通知メールの送信者名", name: "contact_email_from_name", widget: string, required: false }

  # ==========================================================================
  # ② フォルダコレクション：型化ページ（products）を追加・編集・削除
  # ==========================================================================
  - name: "products"
    label: "商品一覧（型化ページ）"
    folder: "src/content/products"
    create: true
    delete: true
    # このコレクションは src/content/products/*.md（リポジトリ直下から2階層）に
    # 保存される。画像は全コレクション共通の src/assets/ に保存しつつ、
    # frontmatter・本文には .md から見た相対パス（../../assets/xxx）で記録する。
    # グローバル設定（public_folder: /src/assets）のままだと、frontmatter の
    # image() は解決できるが本文中の Markdown 画像（![](...)）が最適化されず
    # /src/assets/... のまま出力され本番で404になるため、ここで上書きする。
    media_folder: "/src/assets"
    public_folder: "../../assets"
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "タイトル", name: "title", widget: string, required: false }
      - { label: "価格（税抜・数値）", name: "price", widget: number, value_type: int, required: false }
      - { label: "メイン画像", name: "mainImage", widget: image, required: false }
      - { label: "概要（一覧・OGP用の要約文）", name: "summary", widget: text, required: false }
      - label: "仕様・含まれる内容"
        name: "specs"
        widget: list
        required: false
        field: { label: "項目", name: "spec", widget: string, required: false }
      - { label: "表示順（小さいほど先頭）", name: "order", widget: number, value_type: int, default: 0, required: false }
      - { label: "公開日", name: "publishedAt", widget: datetime, required: false }
      - { label: "本文", name: "body", widget: markdown, required: false }

  # ==========================================================================
  # ③ 複数ページ版（master-template-multi）専用：下層ページのファイルコレクション
  #    各下層ページのテキスト・数値は src/data/*.yml に集約し、
  #    対応する下層ページ（src/pages/*.astro）が siteInfo.yml と同じ要領で
  #    型付き参照する。1ファイル = 1下層ページ。
  # ==========================================================================
  - name: "pages"
    label: "下層ページ"
    files:
      # --- サービス内容・料金 -------------------------------------------------
      - name: "services"
        label: "サービス内容・料金"
        label_singular: "サービス内容・料金"
        summary: "{{fields.heading}}"
        file: "src/data/services.yml"
        fields:
          - { label: "ページ見出し", name: "heading", widget: string, required: false }
          - { label: "リード文（Enterキーで改行可）", name: "lead", widget: text, required: false }
          - label: "サービス詳細"
            name: "items"
            widget: list
            required: false
            fields:
              - { label: "サービス名", name: "title", widget: string, required: false }
              - { label: "説明（Enterキーで改行可）", name: "description", widget: text, required: false }
              - { label: "画像", name: "image", widget: image, required: false }
              - label: "含まれる内容"
                name: "features"
                widget: list
                required: false
                field: { label: "項目", name: "feature", widget: string, required: false }
          - label: "料金表"
            name: "priceTable"
            widget: list
            required: false
            fields:
              - { label: "項目名", name: "name", widget: string, required: false }
              - { label: "価格（税抜・数値）", name: "price", widget: number, value_type: int, required: false }
              - { label: "備考", name: "note", widget: string, required: false }
          - { label: "料金に関する注記文", name: "priceNote", widget: text, required: false }

      # --- 会社概要・アクセス -----------------------------------------------
      - name: "about"
        label: "会社概要"
        label_singular: "会社概要"
        summary: "{{fields.heading}}"
        file: "src/data/about.yml"
        fields:
          - { label: "ページ見出し", name: "heading", widget: string, required: false }
          - { label: "リード文（Enterキーで改行可）", name: "lead", widget: text, required: false }
          - label: "セクションの表示・非表示"
            name: "sections"
            widget: object
            hint: "この会社概要ページ内の各セクションを、それぞれ個別に表示・非表示できます。"
            fields:
              - { label: "「代表挨拶」を表示する", name: "greeting", widget: boolean, default: true }
              - { label: "「会社概要（表形式）」を表示する", name: "companyOverview", widget: boolean, default: true }
              - { label: "「アクセス」を表示する", name: "access", widget: boolean, default: true }
          - label: "代表挨拶"
            name: "greeting"
            widget: object
            fields:
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "本文（Enterキーで改行可）", name: "body", widget: text, required: false }
              - { label: "代表者名", name: "name", widget: string, required: false }
              - { label: "代表者写真", name: "image", widget: image, required: false }
          - label: "会社概要（表形式）"
            name: "profile"
            widget: list
            required: false
            fields:
              - { label: "項目名", name: "label", widget: string, required: false }
              - { label: "内容（Enterキーで改行可）", name: "value", widget: text, required: false }
          - { label: "「公式SNS」行のラベル", name: "companySnsLabel", widget: string, required: false, hint: "会社概要（表形式）の末尾に、SNS設定で表示ONにしたSNSのアイコンを並べた行を追加します（表示するアイコン・並び順はサイト設定の「SNS設定」に連動）。この欄を空にすると既定の「公式SNS」を使用します。" }
          - label: "アクセス情報"
            name: "access"
            widget: object
            hint: "表示順・ラベル・内容・表示可否を自由に編集できます。「+ アクセス項目」で行を追加、ゴミ箱アイコンで削除、ドラッグで並び替えできます。ラベルまたは内容が空欄の行、「この項目を表示する」がOFFの行はサイト上に表示されません。"
            fields:
              - label: "アクセス項目"
                name: "items"
                label_singular: "アクセス項目"
                widget: list
                required: false
                summary: "{{fields.label}}：{{fields.value}}"
                fields:
                  - { label: "ラベル（例：郵便番号／住所／最寄り駅／駐車場）", name: "label", widget: string, required: false }
                  - { label: "内容（Enterキーで改行可）", name: "value", widget: text, required: false }
                  - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true }
              - { label: "Googleマップ埋め込みURL", name: "mapEmbedUrl", widget: string, required: false }

      # --- お問い合わせ・ご予約 ---------------------------------------------
      - name: "contact"
        label: "お問い合わせ・ご予約"
        label_singular: "お問い合わせ・ご予約"
        summary: "{{fields.heading}}"
        file: "src/data/contactPage.yml"
        fields:
          - { label: "ページ見出し", name: "heading", widget: string, required: false }
          - { label: "フォーム上部の案内文（Enterキーで改行可）", name: "intro", widget: text, required: false }
          - label: "ご予約・お問い合わせの注意事項"
            name: "notes"
            widget: list
            required: false
            field: { label: "注意事項", name: "note", widget: string, required: false }

          # --- フォーム入力項目の設定（表示順は お名前→会社名→メールアドレス→電話番号→お問い合わせ内容 で固定） ---
          - label: "フォーム入力項目の設定"
            name: "formFields"
            widget: object
            hint: "各入力欄の表示/非表示・ラベル・プレースホルダー・必須を設定します。表示順は固定（電話番号はメールアドレスとお問い合わせ内容の間）。トップページの「お問い合わせ」セクションと /contact ページの両方に反映されます。"
            fields:
              - label: "お名前"
                name: "name"
                widget: object
                fields:
                  - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true }
                  - { label: "ラベル", name: "label", widget: string, required: false }
                  - { label: "プレースホルダー（入力例）", name: "placeholder", widget: string, required: false }
                  - { label: "必須にする", name: "required", widget: boolean, default: true }
              - label: "会社名"
                name: "company"
                widget: object
                fields:
                  - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true }
                  - { label: "ラベル", name: "label", widget: string, required: false }
                  - { label: "プレースホルダー（入力例）", name: "placeholder", widget: string, required: false }
                  - { label: "必須にする", name: "required", widget: boolean, default: false }
              - label: "メールアドレス"
                name: "email"
                widget: object
                fields:
                  - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true }
                  - { label: "ラベル", name: "label", widget: string, required: false }
                  - { label: "プレースホルダー（入力例）", name: "placeholder", widget: string, required: false }
                  - { label: "必須にする", name: "required", widget: boolean, default: true }
              - label: "連絡先・電話番号"
                name: "phone"
                widget: object
                fields:
                  - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true }
                  - { label: "ラベル", name: "label", widget: string, required: false }
                  - { label: "プレースホルダー（入力例）", name: "placeholder", widget: string, required: false }
                  - { label: "必須にする", name: "required", widget: boolean, default: false }
              - label: "お問い合わせ内容"
                name: "message"
                widget: object
                fields:
                  - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true }
                  - { label: "ラベル", name: "label", widget: string, required: false }
                  - { label: "プレースホルダー（入力例）", name: "placeholder", widget: string, required: false }
                  - { label: "必須にする", name: "required", widget: boolean, default: true }

          # --- カスタム追加項目（固定項目の後ろに表示。CMS で自由に追加・削除できる） ---
          - label: "カスタム追加項目"
            name: "custom_fields"
            label_singular: "カスタム項目"
            widget: list
            required: false
            summary: "{{fields.label}}（{{fields.name}}）"
            hint: "固定項目（お名前〜お問い合わせ内容）の後ろに追加される入力欄。「+ カスタム項目」で追加、各項目のゴミ箱アイコンで削除できます（固定項目は削除できません）。"
            fields:
              - { label: "項目名（ラベル）", name: "label", widget: string, required: false }
              - { label: "フィールドID（送信データのキー名）", name: "name", widget: string, required: false, hint: "半角英数字と _ のみ（例: budget, deadline）。空欄・固定項目と同名・重複はサイトに表示されません。" }
              - { label: "プレースホルダー（入力例）", name: "placeholder", widget: string, required: false }
              - label: "入力タイプ"
                name: "type"
                widget: select
                default: "text"
                options:
                  - { label: "テキスト", value: "text" }
                  - { label: "数値", value: "number" }
                  - { label: "電話番号", value: "tel" }
                  - { label: "メールアドレス", value: "email" }
                  - { label: "複数行テキスト", value: "textarea" }
                  - { label: "選択肢（プルダウン）", value: "select" }
              - label: "選択肢（入力タイプが「選択肢」のときのみ使用）"
                name: "options"
                widget: list
                required: false
                field: { label: "選択肢", name: "option", widget: string, required: false }
              - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true }
              - { label: "必須にする", name: "required", widget: boolean, default: false }

          - label: "プライバシーポリシー"
            name: "privacyPolicy"
            widget: object
            fields:
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "本文（空行で段落区切り／行頭「## 」で小見出し）", name: "body", widget: text, required: false }
              - { label: "最終改定日", name: "updatedAt", widget: string, required: false }

  # ==========================================================================
  # ④ 複数ページ版（master-template-multi）専用：お知らせ・ブログ（投稿型）
  #    1記事 = src/content/news/*.md（frontmatter + Markdown本文）。
  #    ファイル名がURLスラッグになる（例: hello.md → /news/hello/）。
  # ==========================================================================
  - name: "news"
    label: "お知らせ・ブログ"
    folder: "src/content/news"
    create: true
    delete: true
    # products と同様、本文中の Markdown 画像も含めて .md からの相対パス
    # （../../assets/xxx）で記録する（詳細は products コレクションのコメント参照）。
    media_folder: "/src/assets"
    public_folder: "../../assets"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["publishedAt", "title"]
    fields:
      - { label: "記事タイトル", name: "title", widget: string, required: false }
      - { label: "アイキャッチ画像", name: "eyecatch", widget: image, required: false }
      - { label: "アイキャッチ 代替テキスト", name: "eyecatchAlt", widget: string, required: false }
      - { label: "公開日", name: "publishedAt", widget: datetime, required: false }
      - label: "カテゴリ"
        name: "category"
        widget: select
        required: false
        options:
          - { label: "お知らせ", value: "info" }
          - { label: "ブログ", value: "blog" }
          - { label: "イベント", value: "event" }
          - { label: "実績紹介", value: "works" }
      - { label: "抜粋（一覧・OGP用の要約文）", name: "summary", widget: text, required: false }
      - { label: "下書き（チェック中はサイトに公開されません）", name: "draft", widget: boolean, default: false }
      - { label: "本文", name: "body", widget: markdown, required: false }
