# ============================================================================
# public/admin/config.yml — Decap CMS 設定
# ・backend は GitHub 直接連携（OAuth）。Git Gateway（Netlify Identity）は
#   使用しない。GitHubリポジトリへ直接コミットする方式のため、CMSへの
#   ログインには GitHub OAuth App の登録と、そのOAuthフローを仲介する
#   認可サーバーが必要。ここでは自前の Cloudflare Worker（cms-oauth-worker/、
#   base_url に指定）をOAuthプロキシとして使用している。
#   参考: https://decapcms.org/docs/github-backend/
# ・/admin 自体へのアクセス制限は、デプロイ後に Cloudflare Access 等で行う
#   （このリポジトリのコードでは認可制御を行わない。CLAUDE.md 参照）。
# ・システムの構造上必須な識別子（下記「セクション表示順序」の
#   セレクト値等）を除き、原則すべてのフィールドを required: false
#   （任意入力）にしている。未入力の場合、サイト側の各コンポーネントが
#   対応する表示要素を自動的に非表示にする。
# ============================================================================

backend:
  name: github
  repo: easygoing247/master-template-multi
  branch: main
  base_url: https://master-template-oauth.easygoing247.workers.dev
  auth_endpoint: /auth

# ローカル動作確認用：`npm run cms:proxy`（別ターミナルで decap-server を起動）と
# 併用すると、GitHub OAuth なしで localhost 上のファイルへ直接読み書きできる。
# 本番ビルド（Cloudflare Pages等）にデプロイした際は、localhost以外では
# 自動的に無視され、上の github backend（OAuth経由）が使われる。
local_backend: true

# 本番サイトのURL。CMS内の「サイトを表示」リンクやプレビューの絶対URL基準に使われる。
site_url: "https://master-template-multi.easygoing247.workers.dev"
display_url: "https://master-template-multi.easygoing247.workers.dev"

# アップロードした画像の保存先（Astroの src/assets を直接指すことで、
# CMSから差し替えた画像も astro:assets の最適化対象になる）
media_folder: "src/assets"
public_folder: "/src/assets"

locale: "ja"

collections:
  # ==========================================================================
  # ① ファイルコレクション：siteInfo.yml を丸ごと編集
  #    表示順は「ヒーロー→セクション表示順序の並び→基本情報・共通設定→
  #    その他→コピーライト→セクションの表示・非表示→商品ページ共通文言」
  #    の順に固定している（管理画面での探しやすさのため）。
  # ==========================================================================
  - name: "settings"
    label: "サイト設定"
    files:
      - name: "siteInfo"
        label: "サイト全体設定（siteInfo.yml）"
        file: "src/data/siteInfo.yml"
        fields:
          # --- 1. ヒーローセクション（固定で一番上） -----------------------
          - label: "ヒーローセクション"
            name: "hero"
            widget: object
            fields:
              - { label: "見出し（Enterキーで改行、HTML（<br />等）も使用可）", name: "heading", widget: text, required: false }
              - { label: "本文（Enterキーで改行、HTML（<br />等）も使用可）", name: "body", widget: text, required: false }
              - { label: "CTAボタン文言", name: "ctaLabel", widget: string, required: false }
              - { label: "CTAボタン遷移先", name: "ctaHref", widget: string, required: false }
              - { label: "背景画像", name: "image", widget: image, required: false }
              - { label: "画像 代替テキスト", name: "imageAlt", widget: string, required: false }
              - label: "バッジ（3〜4個推奨）"
                name: "badges"
                widget: list
                required: false
                field: { label: "バッジ文言", name: "badge", widget: string, required: false }

          # --- 1b. お知らせセクション（ヒーローと「選ばれる理由」の間に固定表示） ---
          - label: "お知らせセクション（トップページ）"
            name: "newsSection"
            widget: object
            hint: "トップページのヒーローと「選ばれる3つの理由」の間に表示されるお知らせ一覧。他のセクションと異なり表示位置を並び替えできない固定配置のため、表示ON/OFFはこの中の「表示する」で切り替えます（下の「セクション表示順序」には含まれません）。"
            fields:
              - { label: "このセクションを表示する", name: "enabled", widget: boolean, default: true, required: false }
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "トップページに表示する件数", name: "count", widget: number, value_type: int, default: 3, min: 1, max: 10 }
              - { label: "一覧ページへのリンク文言（例：お知らせ一覧へ）", name: "linkLabel", widget: string, required: false }
              - { label: "リンク先", name: "linkHref", widget: string, required: false, default: "/news" }

          # --- 2. 「セクション表示順序」に含まれる各セクション -------------
          - label: "選ばれる理由"
            name: "features_section"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - label: "項目"
                name: "items"
                widget: list
                required: false
                fields:
                  - { label: "番号", name: "number", widget: string, required: false }
                  - { label: "タイトル", name: "title", widget: string, required: false }
                  - { label: "本文（Enterキーで改行可）", name: "text", widget: text, required: false }
                  - { label: "アイコン画像", name: "icon", widget: image, required: false }

          - label: "サービス"
            name: "services"
            widget: object
            hint: "個別のサービス項目（画像・タイトル・説明）は「下層ページ ＞ サービス内容・料金」の「サービス詳細」で一元管理します。ここではトップページのセクション見出しと下層ページへのリンク文言のみを設定します。"
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "下層ページへのリンク文言（例：サービス内容を見る）", name: "linkLabel", widget: string, required: false, hint: "未入力の場合、セクション内のリンクボタンは表示されません。" }
              - { label: "リンク先", name: "linkHref", widget: string, required: false, default: "/services" }

          - label: "制作の流れ"
            name: "flow"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - label: "ステップ"
                name: "steps"
                widget: list
                required: false
                fields:
                  - { label: "番号", name: "number", widget: number, value_type: int, required: false }
                  - { label: "タイトル", name: "title", widget: string, required: false }
                  - { label: "本文（Enterキーで改行可）", name: "text", widget: text, required: false }
                  - { label: "このステップを強調表示する", name: "highlight", widget: boolean, default: false, required: false, hint: "ONにしたステップだけ、テーマカラーの背景で目立たせて表示します（複数ONも可）。" }

          - label: "商品一覧"
            name: "productsSection"
            widget: object
            hint: "個別の商品（画像・商品名・概要・価格・バッジ）は「商品作成」コレクションで一元管理します。ここではトップページのセクション見出し・表示件数・「/products」への誘導リンクのみを設定します。"
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "トップページに表示する件数", name: "count", widget: number, value_type: int, default: 4, min: 1, max: 12, required: false }
              - { label: "「/products」への誘導リンク文言（例：さらに商品を見る）", name: "linkLabel", widget: string, required: false, hint: "未入力の場合、セクション下部のリンクボタンは表示されません。" }
              - { label: "リンク先", name: "linkHref", widget: string, required: false, default: "/products" }

          - label: "実績"
            name: "works"
            widget: object
            hint: "個別の実績項目（画像・タイトル・概要・本文）は「実績・活用事例作成」コレクションで一元管理します。ここではトップページのセクション見出し・表示件数・並び順・列数のみを設定します。"
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "トップページに表示する件数", name: "count", widget: number, value_type: int, default: 3, min: 1, max: 12, required: false, hint: "⚠️「表示順序」に追加済みの実績数がこの件数以上になっている場合、新しく作成した実績（表示順序に未追加のもの）はこの件数の枠に入らずトップページに表示されません。新しい実績を必ず表示させたい場合は、この件数を増やすか、下の「表示順序」に手動で追加してください。" }
              - { label: "PC表示時の並列カード枚数（1〜3）", name: "columns", widget: number, value_type: int, default: 3, min: 1, max: 3, required: false, hint: "実績カードの表示件数がこの枚数を超える場合、両端の矢印でスライド閲覧できるようになります。" }
              - label: "表示順序"
                name: "order"
                widget: list
                required: false
                summary: "{{fields.item}}"
                hint: "ドラッグ&ドロップで並び替えると、トップページでの表示順に反映されます。ここに追加していない実績（または新しく作成した実績）は、この一覧の後ろに公開日の新しい順で表示されますが、上の「トップページに表示する件数」の枠を超える分は表示されません。ここに追加する実績を絞り込みすぎると、新しい実績が表示されなくなるのでご注意ください。各行には選択中の実績のURL用識別子（例：corporate-site-renewal）が表示されます。"
                field:
                  label: "実績"
                  name: "item"
                  widget: relation
                  collection: "works"
                  search_fields: ["title"]
                  display_fields: ["title"]
                  value_field: "{{slug}}"
                  required: false

          - label: "料金プラン"
            name: "plans"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "注記文", name: "note", widget: string, required: false }
              - { label: "人気プランバッジ文言", name: "popularBadgeLabel", widget: string, required: false }
              - { label: "各プランカードのボタン文言（例：詳しく見る）", name: "buttonLabel", widget: string, required: false, hint: "未入力の場合、カード内のボタンは表示されません。人気プランバッジONのプランはボタンが強調表示されます。" }
              - { label: "ボタンのリンク先", name: "buttonHref", widget: string, required: false, default: "/services" }
              - label: "プラン"
                name: "items"
                widget: list
                required: false
                fields:
                  - { label: "プラン名", name: "name", widget: string, required: false }
                  - { label: "説明", name: "description", widget: string, required: false }
                  - { label: "価格（税抜・数値）", name: "price", widget: number, value_type: int, required: false }
                  - { label: "人気プランバッジを表示", name: "popular", widget: boolean, default: false, required: false }
                  - label: "含まれる内容"
                    name: "features"
                    widget: list
                    required: false
                    field: { label: "項目", name: "feature", widget: string, required: false }

          - label: "アクセス"
            name: "access"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - label: "店舗情報"
                name: "store"
                widget: object
                fields:
                  - { label: "店舗名", name: "name", widget: string, required: false }
                  - { label: "郵便番号", name: "postalCode", widget: string, required: false }
                  - { label: "住所", name: "address", widget: string, required: false }
                  - { label: "最寄り駅", name: "nearestStation", widget: string, required: false }
                  - { label: "営業時間", name: "businessHours", widget: string, required: false }
                  - { label: "定休日", name: "closedDays", widget: string, required: false }
                  - { label: "駐車場", name: "parking", widget: string, required: false }
                  - { label: "Googleマップ埋め込みURL", name: "mapEmbedUrl", widget: string, required: false }
                  - { label: "店舗外観画像", name: "image", widget: image, required: false }
                  - { label: "店舗外観 代替テキスト", name: "imageAlt", widget: string, required: false }
              - label: "項目ラベル"
                name: "labels"
                widget: object
                hint: "各項目の行は、ここのラベルまたは右側の店舗情報の値のどちらかが空欄の場合、サイト上で自動的に非表示になります。"
                fields:
                  - { label: "郵便番号", name: "postalCode", widget: string, required: false }
                  - { label: "住所", name: "address", widget: string, required: false }
                  - { label: "最寄り駅", name: "nearestStation", widget: string, required: false }
                  - { label: "電話番号", name: "phone", widget: string, required: false }
                  - { label: "営業時間", name: "businessHours", widget: string, required: false }
                  - { label: "定休日", name: "closedDays", widget: string, required: false }
                  - { label: "駐車場", name: "parking", widget: string, required: false }
                  - { label: "公式SNS", name: "sns", widget: string, required: false }

          - label: "FAQ"
            name: "faq"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - label: "質問項目"
                name: "items"
                widget: list
                required: false
                fields:
                  - { label: "質問", name: "q", widget: string, required: false }
                  - { label: "回答（Enterキーで改行可）", name: "a", widget: text, required: false }

          - label: "お問い合わせ"
            name: "contactSection"
            widget: object
            fields:
              - { label: "見出し上部ラベル", name: "eyebrow", widget: string, required: false }
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "本文（Enterキーで改行、HTML（<br />等）も使用可）", name: "body", widget: text, required: false }
              - label: "アピールポイント"
                name: "points"
                widget: list
                required: false
                field: { label: "ポイント", name: "point", widget: string, required: false }
              - label: "送信ボタン・送信結果メッセージ"
                name: "form"
                widget: object
                hint: "各入力欄のラベル・プレースホルダー・必須／表示切替は「下層ページ ＞ お問い合わせ・ご予約」の「フォーム入力項目の設定」で編集します。"
                fields:
                  - { label: "送信ボタン文言", name: "submitLabel", widget: string, required: false }
                  - { label: "送信中のボタン文言", name: "sendingLabel", widget: string, required: false }
                  - { label: "送信成功時のメッセージ", name: "successMessage", widget: text, required: false }
                  - { label: "送信失敗時のメッセージ", name: "errorMessage", widget: text, required: false }
              # ※ 送信先（Web3Formsキー）・通知メールの件名／送信者名は
              #   独立ファイル項目「お問い合わせフォーム設定」（contact-form.json）。

          # --- 3. 会社・サイト基本情報 --------------------------------------
          - label: "会社・サイト基本情報"
            name: "company"
            widget: object
            fields:
              - { label: "会社名", name: "name", widget: string, required: false }
              - { label: "ロゴ画像", name: "logo", widget: image, required: false }
              - { label: "テキストロゴ（サイト名）", name: "textLogo", widget: string, required: false, hint: "ロゴ画像が未設定の場合、またはこの下の「テキストロゴを使用する」がONの場合に、ヘッダー・フッターのロゴ位置へ文字として表示されます。未入力の場合は「会社名」を使用します。" }
              - { label: "テキストロゴを使用する（ロゴ画像より優先）", name: "useTextLogo", widget: boolean, default: false, required: false }
              - { label: "サイトタイトル（<title>用）", name: "siteName", widget: string, required: false }
              - { label: "キャッチコピー（内部用）", name: "tagline", widget: string, required: false }
              - { label: "サイト説明文（meta description）", name: "description", widget: text, required: false }
              - { label: "代表者名", name: "representative", widget: string, required: false }
              - { label: "設立年", name: "establishedYear", widget: number, value_type: int, required: false }
              - { label: "OGP画像（SNSシェア時のサムネイル）", name: "ogImage", widget: image, required: false }

          # --- 4. 連絡先 ---------------------------------------------------
          - label: "連絡先"
            name: "contact"
            widget: object
            hint: "※ここに入力した情報は、トップページ「アクセス」セクション、プライバシーポリシー「事業者情報」、およびAI参照用データ（/llms.txt）に自動反映されます。（スマホ下部固定バーの設定は別セクション「画面下部固定バー」で行えます）"
            fields:
              - { label: "電話番号（表示用）", name: "phone", widget: string, required: false }
              - { label: "電話番号（tel:リンク用）", name: "phoneHref", widget: string, required: false }
              - { label: "メールアドレス", name: "email", widget: string, required: false }

          # --- 4b. SNS設定（サイト全体で一括管理。連絡先から独立） -----------
          - label: "SNS設定"
            name: "sns"
            widget: list
            required: false
            label_singular: "SNS"
            summary: "{{fields.id}}"
            hint: "各SNSの公式アカウントURLと表示ON/OFFをまとめて管理します。ドラッグ&ドロップの並び順が、トップページ「店舗概要・アクセス」・会社概要ページの「公式SNS」・フッターなど、SNSアイコンを掲載するすべての箇所の表示順になります。「表示する」をOFFにするか、URLが未入力のSNSはアイコンが表示されません。スマホ下部バーの「LINEで相談」ボタンも、この LINE のURL／表示ON/OFFを参照します。"
            fields:
              - label: "SNS"
                name: "id"
                widget: select
                options:
                  - { label: "LINE", value: "line" }
                  - { label: "Instagram", value: "instagram" }
                  - { label: "X（旧Twitter）", value: "x" }
                  - { label: "Facebook", value: "facebook" }
                  - { label: "YouTube", value: "youtube" }
                  - { label: "TikTok", value: "tiktok" }
              - { label: "URL", name: "url", widget: string, required: false }
              - { label: "このSNSを表示する", name: "enabled", widget: boolean, default: true, required: false }

          # --- 5. 共通UI文言 -------------------------------------------------
          - label: "共通UI文言"
            name: "ui"
            widget: object
            fields:
              - { label: "「プライバシーポリシー」リンク文言", name: "privacyPolicyLabel", widget: string, required: false }
              - { label: "お問い合わせフォーム同意文（末尾）", name: "privacyConsentSuffix", widget: string, required: false }
          # ※ お問い合わせフォームの送信設定は、この siteInfo.yml ではなく
          #   独立したファイル項目「お問い合わせフォーム設定」
          #   （src/data/contact-form.json）で管理する（下記 settings コレクション参照）。

          # --- 6. その他既存セクション ---------------------------------------
          - label: "セクション表示順序"
            name: "sectionOrder"
            widget: list
            required: false
            hint: "ドラッグ&ドロップで並び替えると、そのままサイト上の表示順になります（背景の白／グレーの交互配色も自動で追従します）。各項目の「このセクションを表示する」をOFFにすると、並び順を保ったまま非表示にできます（2026-09、旧「セクションの表示・非表示」タブは統合により廃止）。選択肢の文言は各セクションの「見出し」フィールドの内容に自動で追従します。「お知らせ」セクションはヒーロー直下に固定配置のためここには含まれません（上の「お知らせセクション」内で表示切替）。"
            summary: "{{fields.id}}"
            fields:
              - label: "セクション"
                name: "id"
                widget: select
                options:
                  - { label: "選ばれる3つの理由", value: "features" }
                  - { label: "サービス・事業内容", value: "services" }
                  - { label: "ご相談から納品までの流れ", value: "flow" }
                  - { label: "商品一覧", value: "products" }
                  - { label: "実績・活用事例", value: "works" }
                  - { label: "料金プラン", value: "plans" }
                  - { label: "よくある質問", value: "faq" }
                  - { label: "店舗概要・アクセス", value: "access" }
                  - { label: "お問い合わせ", value: "contact" }
              - { label: "このセクションを表示する", name: "enable", widget: boolean, default: true, required: false }

          - label: "ヘッダーナビゲーション"
            name: "nav"
            widget: list
            required: false
            hint: "リンク先が「下層ページ編集」の各ページ（/services 等）の場合、「表示名」が未入力ならそのページの「ページ見出し」が自動的に表示されます。個別の表記にしたい場合のみ「表示名」を入力してください。トップページ内セクションへのリンク（例：/#works）は対応する「ページ見出し」が無いため、表示名の入力が必要です。"
            fields:
              - { label: "表示名", name: "label", widget: string, required: false, hint: "※未入力の場合は「下層ページ編集」の「ページ見出し」が反映されます。個別の表記にしたい場合のみ入力してください。" }
              - { label: "リンク先", name: "href", widget: string, required: false }

          - label: "ヘッダーCTAボタン"
            name: "navCta"
            widget: object
            fields:
              - { label: "表示名", name: "label", widget: string, required: false }
              - { label: "リンク先", name: "href", widget: string, required: false }

          - label: "フッターナビゲーション"
            name: "footerNav"
            widget: list
            required: false
            hint: "リンク先が「下層ページ編集」の各ページ（/services 等）の場合、「表示名」が未入力ならそのページの「ページ見出し」が自動的に表示されます。個別の表記にしたい場合のみ「表示名」を入力してください。トップページ内セクションへのリンク（例：/#works）は対応する「ページ見出し」が無いため、表示名の入力が必要です。"
            fields:
              - { label: "表示名", name: "label", widget: string, required: false, hint: "※未入力の場合は「下層ページ編集」の「ページ見出し」が反映されます。個別の表記にしたい場合のみ入力してください。" }
              - { label: "リンク先", name: "href", widget: string, required: false }

          - label: "画面下部固定バー"
            name: "stickyContactBar"
            widget: object
            hint: "スマホ表示時、画面下部に常時表示される固定バー（左右2ボタン）の設定です（PC表示では非表示）。個別リンク先を入力した場合はそちらが最優先で使われ、未入力の場合のみ上の「連絡先」「SNS設定」の共通情報にフォールバックします。"
            fields:
              - label: "左ボタン"
                name: "leftButton"
                widget: object
                hint: "既定では「連絡先」の電話番号へ発信するボタンです。"
                fields:
                  - { label: "ボタン文言", name: "label", widget: string, required: false }
                  - { label: "表示する", name: "show", widget: boolean, default: true, required: false, hint: "左右どちらのボタンも、このスイッチと対応するリンク先（個別設定または共通の連絡先／LINE URL）の両方が揃っている場合のみ表示されます。両方表示なら半分ずつ、片方のみなら全幅、両方非表示ならバー自体が表示されません。" }
                  - label: "背景カラー"
                    name: "color"
                    widget: select
                    default: "primary"
                    required: false
                    hint: "「デザインテーマ設定」に準拠したテーマカラー、またはLINE公式ブランドカラーに準じたグリーンから選べます。"
                    options:
                      - { label: "テーマカラー（デザインテーマ設定に連動）", value: "primary" }
                      - { label: "LINE風グリーン", value: "accent" }
                  - label: "アクション種別"
                    name: "actionType"
                    widget: select
                    default: "tel"
                    required: false
                    options:
                      - { label: "電話発信", value: "tel" }
                      - { label: "URLへ遷移", value: "url" }
                      - { label: "フォームへ遷移", value: "form" }
                  - { label: "個別リンク先", name: "customLink", widget: string, required: false, hint: "入力すると上の「連絡先」の電話番号より優先されます。アクション種別が「電話発信」の場合は電話番号（例: 09012345678）、それ以外はURL（例: /contact や https://...）を入力してください。未入力の場合は共通の連絡先の電話番号を使用します。" }
              - label: "右ボタン"
                name: "rightButton"
                widget: object
                hint: "既定では「SNS設定」のLINE URLへ遷移するボタンです。"
                fields:
                  - { label: "ボタン文言", name: "label", widget: string, required: false }
                  - { label: "表示する", name: "show", widget: boolean, default: true, required: false }
                  - label: "背景カラー"
                    name: "color"
                    widget: select
                    default: "accent"
                    required: false
                    hint: "「デザインテーマ設定」に準拠したテーマカラー、またはLINE公式ブランドカラーに準じたグリーンから選べます。"
                    options:
                      - { label: "LINE風グリーン", value: "accent" }
                      - { label: "テーマカラー（デザインテーマ設定に連動）", value: "primary" }
                  - label: "アクション種別"
                    name: "actionType"
                    widget: select
                    default: "url"
                    required: false
                    options:
                      - { label: "電話発信", value: "tel" }
                      - { label: "URLへ遷移", value: "url" }
                      - { label: "フォームへ遷移", value: "form" }
                  - { label: "個別リンク先", name: "customLink", widget: string, required: false, hint: "入力すると「SNS設定」のLINE URLより優先されます。アクション種別が「電話発信」の場合は電話番号、それ以外はURL（例: /contact や https://line.me/...）を入力してください。未入力の場合は共通のLINE URLを使用します。" }

          # --- 7. コピーライト表記 -------------------------------------------
          - { label: "コピーライト表記", name: "copyright", widget: string, required: false }

          # --- 8. 共通文言・実績詳細ページ（一番最下部） -------------
          - label: "共通文言・実績詳細ページ"
            name: "productPage"
            widget: object
            hint: "「パンくずリストの「トップ」表示名」はサイト全体（会社概要・サービス内容・お問い合わせ・お知らせ・実績詳細）のパンくずで共通利用します。それ以外の2項目は「実績・活用事例」の個別詳細ページ（/works/xxx）専用です。"
            fields:
              - { label: "パンくずリストの「トップ」表示名", name: "breadcrumbHome", widget: string, required: false }
              - { label: "「仕様・含まれる内容」見出し（実績詳細ページ）", name: "specsHeading", widget: string, required: false }
              - { label: "相談CTAボタン文言（実績詳細ページ）", name: "ctaLabel", widget: string, required: false }
              - { label: "相談CTAボタンのリンク先（実績詳細ページ）", name: "ctaHref", widget: string, required: false, default: "/#contact", hint: "未入力の場合はトップページのお問い合わせセクション（/#contact）へリンクします。" }

      - name: "siteSettings"
        label: "デザインテーマ設定（site-settings.json）"
        file: "src/data/site-settings.json"
        fields:
          - label: "テーマカラー"
            name: "theme"
            widget: select
            default: "blue"
            hint: "サイト全体のメインカラー（ボタン・リンク・見出し等）をプリセットから切り替えます。保存後、再ビルド・再デプロイで反映されます。"
            options:
              - { label: "ブルー（デフォルト）", value: "blue" }
              - { label: "レッド", value: "red" }
              - { label: "グリーン", value: "green" }
              - { label: "パープル", value: "purple" }
              - { label: "オレンジ", value: "orange" }

      # ----------------------------------------------------------------------
      # 3つ目のファイル項目。「サイト全体設定」「デザインテーマ設定」と並ぶ。
      # お問い合わせフォーム（Contact.astro / contact.astro）の送信先と、
      # Web3Forms 通知メールの件名・送信者名。src/lib/contactFormSettings.ts が参照。
      # ----------------------------------------------------------------------
      - name: "contactFormSettings"
        label: "お問い合わせフォーム設定（contact-form.json）"
        file: "src/data/contact-form.json"
        fields:
          - name: "web3forms_access_key"
            label: "Web3Forms アクセスキー"
            widget: "string"
            required: false
            hint: "Web3Formsで取得した36桁のアクセスキー（e.g. xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx）を入力してください"
          - { label: "通知メールの件名", name: "contact_email_subject", widget: string, required: false }
          - { label: "通知メールの送信者名", name: "contact_email_from_name", widget: string, required: false }

  # ==========================================================================
  # ②a 単一ファイルコレクション：「商品作成」（商品一覧・/products の元データ）
  #    型化ページ（1件=1ファイル）ではなく、1ファイル内の可変リスト（widget:
  #    list）構造。ドラッグ&ドロップで直感的に並び替え・追加・削除できる。
  #    トップページ「商品一覧」セクションと /products ページの両方が
  #    このデータを参照する（src/lib/pages.ts の productsPage / resolveProductItems）。
  # ==========================================================================
  - name: "productsCatalog"
    label: "商品作成"
    files:
      - name: "products"
        label: "商品一覧設定"
        file: "src/data/products.yml"
        summary: "{{fields.heading}}"
        fields:
          - { label: "ページ見出し（/products）", name: "heading", widget: string, required: false }
          - { label: "リード文（Enterキーで改行可）", name: "lead", widget: text, required: false }
          - { label: "上段掲載商品セクションの見出し", name: "featuredHeading", widget: string, required: false, default: "新商品", hint: "横長カードで表示するセクションの見出しです。空欄にすると「新商品」を表示します。" }
          - { label: "下段掲載商品セクションの見出し", name: "regularHeading", widget: string, required: false, default: "通年商品", hint: "縦型カードで表示するセクションの見出しです。空欄にすると「通年商品」を表示します。" }
          - { label: "下段掲載商品のグリッド列数（PC表示時の目安）", name: "regularColumns", widget: number, value_type: int, default: 3, min: 2, max: 4, required: false, hint: "※PC表示時の目安列数です。スマホでは常に1列、タブレット幅では自動調整されます。" }
          - label: "商品項目"
            name: "items"
            widget: list
            required: false
            summary: "{{fields.name}}"
            hint: "画像・商品名・概要・価格のうち、空欄の項目はサイト上で自動的に非表示になります（商品名が空欄の項目はカードごと非表示）。"
            fields:
              - { label: "商品画像", name: "image", widget: image, required: false }
              - { label: "商品画像 代替テキスト（Alt属性）", name: "alt", widget: string, required: false, hint: "未入力の場合は商品名で代用されます。" }
              - { label: "商品名", name: "name", widget: string, required: false }
              - { label: "概要（説明文。Enterキーで改行可）", name: "description", widget: text, required: false }
              - { label: "価格（税抜・数値）", name: "price", widget: number, value_type: int, required: false }
              - { label: "バッジを表示する", name: "showBadge", widget: boolean, default: false, required: false, hint: "ONにして下の「バッジ文言」を入力すると、商品名の上にテーマカラーのバッジが表示されます。" }
              - { label: "バッジ文言（例：新商品／おすすめ／限定）", name: "badgeText", widget: string, default: "", required: false }
              - label: "表示セクション区分"
                name: "section"
                widget: select
                default: "regular"
                required: false
                hint: "この商品をどちらのセクションに表示するかを選びます。"
                options:
                  - { label: "上段掲載商品（新商品等）", value: "featured" }
                  - { label: "下段掲載商品（通年商品等）", value: "regular" }
                  - { label: "両方に表示", value: "both" }

  # ==========================================================================
  # ②b フォルダコレクション：型化ページ（works）＝実績・活用事例を追加・編集・削除
  # ==========================================================================
  - name: "works"
    label: "実績・活用事例作成"
    folder: "src/content/works"
    create: true
    delete: true
    # このコレクションは src/content/works/*.md（リポジトリ直下から2階層）に
    # 保存される。画像は全コレクション共通の src/assets/ に保存しつつ、
    # frontmatter・本文には .md から見た相対パス（../../assets/xxx）で記録する。
    # グローバル設定（public_folder: /src/assets）のままだと、frontmatter の
    # image() は解決できるが本文中の Markdown 画像（![](...)）が最適化されず
    # /src/assets/... のまま出力され本番で404になるため、ここで上書きする。
    media_folder: "/src/assets"
    public_folder: "../../assets"
    # タイトル（日本語）をそのままファイル名・URLスラッグにすると、非ASCII文字
    # 入りのURLになるだけでなく、「公開して新規作成／公開して複製する」実行後に
    # 編集画面が新規作成画面へ遷移せず元の画面に留まる不具合の一因にもなり得る
    # （Decap既定の {{slug}} は全角文字の扱いにバージョン差異があり、スラッグ
    # 計算に失敗すると後続のリダイレクト処理まで巻き込んで止まることがある）。
    # news コレクションと同じ方針で、半角英数字の「URL用識別子」フィールドから
    # 明示的にファイル名を組み立てる。
    slug: "{{fields.urlSlug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["publishedAt", "title"]
    fields:
      - { label: "タイトル", name: "title", widget: string, required: false }
      - { label: "URL用識別子（半角英数字）", name: "urlSlug", widget: string, required: false, pattern: ['^[a-z0-9-]+$', '半角英小文字、数字、ハイフンのみ使用可能です'], hint: "タイトル入力に応じて、漢字・ひらがな・カタカナを自動でローマ字（ヘボン式）に変換して補完します（初回は変換辞書の読み込みに少し時間がかかることがあります）。この欄を直接編集すると自動補完は止まりますので、必要に応じて手動で調整してください。未入力のまま保存した場合は自動でランダムな識別子が割り当てられます。例: corporate-site-renewal" }
      - { label: "価格（税抜・数値）", name: "price", widget: number, value_type: int, required: false, hint: "未入力の場合、カードに価格は表示されません。" }
      - { label: "メイン画像", name: "image", widget: image, required: false }
      - { label: "メイン画像 代替テキスト（Alt属性）", name: "imageAlt", widget: string, required: false, hint: "スクリーンリーダー・検索エンジン向けの画像説明文です。未入力の場合はタイトルで代用されます。" }
      - { label: "概要（一覧・OGP用の要約文）", name: "summary", widget: text, required: false }
      - label: "仕様・含まれる内容"
        name: "specs"
        widget: list
        required: false
        field: { label: "項目", name: "spec", widget: string, required: false }
      - { label: "公開日", name: "publishedAt", widget: datetime, required: false }
      - label: "本文"
        name: "body"
        widget: markdown
        required: false
        hint: "※個別ページに掲載されている「このプランで相談する ›」ボタンの表記やリンク先を変更する場合は、「サイト全体設定」＞「共通文言・実績詳細ページ」から設定を行ってください（このコレクションの個別項目からは変更できません）。"
        # ツールバーはよく使う項目のみに絞り、意味の近い順にグループ化
        # （太字系→見出し→引用→リスト）。「+」ボタン（コンポーネント追加）
        # から挿入できるカスタムブロックは editor_components で個別に登録
        # した6種（public/admin/editor-components.js参照）のみに絞る。
        buttons: &richTextButtons
          [
            "bold",
            "italic",
            "strikethrough",
            "code",
            "heading-one",
            "heading-two",
            "heading-three",
            "quote",
            "link",
            "bulleted-list",
            "numbered-list",
          ]
        editor_components: &richTextComponents
          [
            "image",
            "youtube-video",
            "video-file",
            "highlight-marker",
            "callout-box",
            "speech-bubble",
            "aligned-text",
            "blank-line",
          ]

  # ==========================================================================
  # ③ 複数ページ版（master-template-multi）専用：下層ページのファイルコレクション
  #    各下層ページのテキスト・数値は src/data/*.yml に集約し、
  #    対応する下層ページ（src/pages/*.astro）が siteInfo.yml と同じ要領で
  #    型付き参照する。1ファイル = 1下層ページ。
  # ==========================================================================
  - name: "pages"
    label: "下層ページ編集"
    files:
      # --- サービス内容・料金 -------------------------------------------------
      - name: "services"
        label: "サービス内容・料金"
        label_singular: "サービス内容・料金"
        summary: "{{fields.pageName}}"
        file: "src/data/services.yml"
        fields:
          - { label: "ページ名（下層ページ編集の一覧に表示される項目名）", name: "pageName", widget: string, required: false, default: "サービス内容・料金", hint: "管理画面の「下層ページ編集」一覧にこの項目の表記として表示されます。サイト上の見出し（下の「ページ見出し」）とは別に、管理用の識別名として自由に変更できます。" }
          - { label: "ページ見出し", name: "heading", widget: string, required: false, hint: "※このページへのヘッダー・フッターのナビ項目で「表示名」が未入力の場合、この見出しがナビの表示名としても使われます。" }
          - { label: "リード文（Enterキーで改行可）", name: "lead", widget: text, required: false }
          - { label: "「サービス詳細」セクションの見出し", name: "itemsHeading", widget: string, required: false, default: "サービス内容", hint: "サービス詳細（画像＋説明）の一覧の上に表示される見出し。空欄にすると「サービス内容」を表示します。" }
          - label: "サービス詳細"
            name: "items"
            widget: list
            required: false
            fields:
              - { label: "サービス名", name: "title", widget: string, required: false }
              - { label: "バッジテキスト（例：人気／おすすめ）", name: "badgeText", widget: string, required: false, hint: "入力すると、サービス名の左隣にテーマカラーのバッジが表示されます。未入力ならバッジは表示されません。" }
              - { label: "説明（Enterキーで改行可）", name: "description", widget: text, required: false }
              - { label: "画像", name: "image", widget: image, required: false }
              - { label: "画像 代替テキスト（Alt属性）", name: "alt", widget: string, required: false, hint: "未入力の場合はサービス名で代用されます。" }
              - { label: "画像とテキストの配置を左右反転する", name: "reverseLayout", widget: boolean, default: false, required: false, hint: "OFF：画像が左・テキストが右（既定）／ON：画像が右・テキストが左。スマホ表示（1カラム）では常に画像→テキストの順です。" }
              - label: "含まれる内容"
                name: "features"
                widget: list
                required: false
                field: { label: "項目", name: "feature", widget: string, required: false }
          - { label: "「料金表」セクションの見出し", name: "priceHeading", widget: string, required: false, default: "料金表", hint: "料金表の上に表示される見出し。空欄にすると「料金表」を表示します。" }
          - label: "料金表"
            name: "priceTable"
            widget: list
            required: false
            fields:
              - { label: "項目名", name: "name", widget: string, required: false }
              - { label: "価格（税抜・数値）", name: "price", widget: number, value_type: int, required: false }
              - { label: "備考", name: "note", widget: string, required: false }
              - { label: "項目名の左に強調バッジを表示する", name: "showBadge", widget: boolean, default: false, required: false, hint: "ONにして下の「バッジ文言」を入力すると、項目名の左隣にテーマカラーのバッジが表示されます。" }
              - { label: "バッジ文言（例：人気／おすすめ／限定）", name: "badgeText", widget: string, default: "", required: false }
              - { label: "強調表示（ハイライト）", name: "highlight", widget: boolean, default: false, required: false, hint: "ONにすると、トップページ「料金プラン」の人気プランと同様の青枠で、この項目だけ枠線とかげを付けて強調表示します（上の「強調バッジ」とは独立して併用できます）。" }
              - label: "含まれる内容／特徴"
                name: "features"
                widget: list
                required: false
                hint: "各項目の文頭にチェックマークを付けて、備考の下に箇条書き表示します（料金プランの「含まれる内容」と同仕様）。"
                field: { label: "項目", name: "feature", widget: string, required: false }
          - { label: "料金に関する注記文", name: "priceNote", widget: text, required: false }

      # --- 会社概要・アクセス -----------------------------------------------
      - name: "about"
        label: "会社概要"
        label_singular: "会社概要"
        summary: "{{fields.pageName}}"
        file: "src/data/about.yml"
        fields:
          - { label: "ページ名（下層ページ編集の一覧に表示される項目名）", name: "pageName", widget: string, required: false, default: "会社概要", hint: "管理画面の「下層ページ編集」一覧にこの項目の表記として表示されます。サイト上の見出し（下の「ページ見出し」）とは別に、管理用の識別名として自由に変更できます。" }
          - { label: "ページ見出し", name: "heading", widget: string, required: false, hint: "※このページへのヘッダー・フッターのナビ項目で「表示名」が未入力の場合、この見出しがナビの表示名としても使われます。" }
          - { label: "リード文（Enterキーで改行可）", name: "lead", widget: text, required: false }
          - label: "セクションの表示・非表示"
            name: "sections"
            widget: object
            hint: "この会社概要ページ内の各セクションを、それぞれ個別に表示・非表示できます。"
            fields:
              - { label: "「代表挨拶」を表示する", name: "greeting", widget: boolean, default: true, required: false }
              - { label: "「会社概要（表形式）」を表示する", name: "companyOverview", widget: boolean, default: true, required: false }
              - { label: "「アクセス」を表示する", name: "access", widget: boolean, default: true, required: false }
          - label: "代表挨拶"
            name: "greeting"
            widget: object
            fields:
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "本文（Enterキーで改行可）", name: "body", widget: text, required: false }
              - { label: "代表者名", name: "name", widget: string, required: false }
              - { label: "代表者写真", name: "image", widget: image, required: false }
              - { label: "代表者写真 代替テキスト（Alt属性）", name: "alt", widget: string, required: false, hint: "未入力の場合は代表者名で代用されます。" }
          - label: "会社概要（表形式）"
            name: "profile"
            widget: list
            required: false
            fields:
              - { label: "項目名", name: "label", widget: string, required: false }
              - { label: "内容（Enterキーで改行可）", name: "value", widget: text, required: false }
          - { label: "「公式SNS」行のラベル", name: "companySnsLabel", widget: string, required: false, hint: "会社概要（表形式）の末尾に、SNS設定で表示ONにしたSNSのアイコンを並べた行を追加します（表示するアイコン・並び順はサイト設定の「SNS設定」に連動）。この欄を空にすると既定の「公式SNS」を使用します。" }
          - label: "アクセス情報"
            name: "access"
            widget: object
            hint: "表示順・ラベル・内容・表示可否を自由に編集できます。「+ アクセス項目」で行を追加、ゴミ箱アイコンで削除、ドラッグで並び替えできます。ラベルまたは内容が空欄の行、「この項目を表示する」がOFFの行はサイト上に表示されません。"
            fields:
              - label: "アクセス項目"
                name: "items"
                label_singular: "アクセス項目"
                widget: list
                required: false
                summary: "{{fields.label}}：{{fields.value}}"
                fields:
                  - { label: "ラベル（例：郵便番号／住所／最寄り駅／駐車場）", name: "label", widget: string, required: false }
                  - { label: "内容（Enterキーで改行可）", name: "value", widget: text, required: false }
                  - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true, required: false }
              - { label: "Googleマップ埋め込みURL", name: "mapEmbedUrl", widget: string, required: false }

      # --- お問い合わせ・ご予約 ---------------------------------------------
      - name: "contact"
        label: "お問い合わせ・ご予約"
        label_singular: "お問い合わせ・ご予約"
        summary: "{{fields.pageName}}"
        file: "src/data/contactPage.yml"
        fields:
          - { label: "ページ名（下層ページ編集の一覧に表示される項目名）", name: "pageName", widget: string, required: false, default: "お問い合わせ・ご予約", hint: "管理画面の「下層ページ編集」一覧にこの項目の表記として表示されます。サイト上の見出し（下の「ページ見出し」）とは別に、管理用の識別名として自由に変更できます。" }
          - { label: "ページ見出し", name: "heading", widget: string, required: false, hint: "※このページへのヘッダー・フッターのナビ項目で「表示名」が未入力の場合、この見出しがナビの表示名としても使われます。" }
          - { label: "フォーム上部の案内文（Enterキーで改行可）", name: "intro", widget: text, required: false }
          - label: "ご予約・お問い合わせの注意事項"
            name: "notes"
            widget: list
            required: false
            field: { label: "注意事項", name: "note", widget: string, required: false }

          # --- フォーム入力項目の設定（表示順は お名前→会社名→メールアドレス→電話番号→お問い合わせ内容 で固定） ---
          - label: "フォーム入力項目の設定"
            name: "formFields"
            widget: object
            hint: "各入力欄の表示/非表示・ラベル・プレースホルダー・必須を設定します。表示順は固定（電話番号はメールアドレスとお問い合わせ内容の間）。トップページの「お問い合わせ」セクションと /contact ページの両方に反映されます。"
            fields:
              - label: "お名前"
                name: "name"
                widget: object
                fields:
                  - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true, required: false }
                  - { label: "ラベル", name: "label", widget: string, required: false }
                  - { label: "プレースホルダー（入力例）", name: "placeholder", widget: string, required: false }
                  - { label: "必須にする", name: "required", widget: boolean, default: true, required: false }
              - label: "会社名"
                name: "company"
                widget: object
                fields:
                  - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true, required: false }
                  - { label: "ラベル", name: "label", widget: string, required: false }
                  - { label: "プレースホルダー（入力例）", name: "placeholder", widget: string, required: false }
                  - { label: "必須にする", name: "required", widget: boolean, default: false, required: false }
              - label: "メールアドレス"
                name: "email"
                widget: object
                fields:
                  - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true, required: false }
                  - { label: "ラベル", name: "label", widget: string, required: false }
                  - { label: "プレースホルダー（入力例）", name: "placeholder", widget: string, required: false }
                  - { label: "必須にする", name: "required", widget: boolean, default: true, required: false }
              - label: "連絡先・電話番号"
                name: "phone"
                widget: object
                fields:
                  - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true, required: false }
                  - { label: "ラベル", name: "label", widget: string, required: false }
                  - { label: "プレースホルダー（入力例）", name: "placeholder", widget: string, required: false }
                  - { label: "必須にする", name: "required", widget: boolean, default: false, required: false }
              - label: "お問い合わせ内容"
                name: "message"
                widget: object
                fields:
                  - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true, required: false }
                  - { label: "ラベル", name: "label", widget: string, required: false }
                  - { label: "プレースホルダー（入力例）", name: "placeholder", widget: string, required: false }
                  - { label: "必須にする", name: "required", widget: boolean, default: true, required: false }

          # --- カスタム追加項目（固定項目の後ろに表示。CMS で自由に追加・削除できる） ---
          - label: "カスタム追加項目"
            name: "custom_fields"
            label_singular: "カスタム項目"
            widget: list
            required: false
            summary: "{{fields.label}}（{{fields.name}}）"
            hint: "固定項目（お名前〜お問い合わせ内容）の後ろに追加される入力欄。「+ カスタム項目」で追加、各項目のゴミ箱アイコンで削除できます（固定項目は削除できません）。"
            fields:
              - { label: "項目名（ラベル）", name: "label", widget: string, required: false }
              - { label: "フィールドID（送信データのキー名）", name: "name", widget: string, required: false, hint: "半角英数字と _ のみ（例: budget, deadline）。空欄・固定項目と同名・重複はサイトに表示されません。" }
              - { label: "プレースホルダー（入力例）", name: "placeholder", widget: string, required: false }
              - label: "入力タイプ"
                name: "type"
                widget: select
                default: "text"
                options:
                  - { label: "テキスト", value: "text" }
                  - { label: "数値", value: "number" }
                  - { label: "電話番号", value: "tel" }
                  - { label: "メールアドレス", value: "email" }
                  - { label: "複数行テキスト", value: "textarea" }
                  - { label: "選択肢（プルダウン）", value: "select" }
              - label: "選択肢（入力タイプが「選択肢」のときのみ使用）"
                name: "options"
                widget: list
                required: false
                field: { label: "選択肢", name: "option", widget: string, required: false }
              - { label: "この項目を表示する", name: "enabled", widget: boolean, default: true, required: false }
              - { label: "必須にする", name: "required", widget: boolean, default: false, required: false }

          - label: "プライバシーポリシー"
            name: "privacyPolicy"
            widget: object
            fields:
              - { label: "見出し", name: "heading", widget: string, required: false }
              - { label: "本文（空行で段落区切り／行頭「## 」で小見出し）", name: "body", widget: text, required: false }
              - { label: "最終改定日", name: "updatedAt", widget: string, required: false }

      # --- お知らせ一覧ページ（/news の見出し・リード文設定。個々の記事は
      #     下の「お知らせ」（投稿型コレクション）で編集する） -----------------
      - name: "newsPage"
        label: "お知らせ一覧ページ"
        label_singular: "お知らせ一覧ページ"
        summary: "{{fields.pageName}}"
        file: "src/data/newsPage.yml"
        fields:
          - { label: "ページ名（下層ページ編集の一覧に表示される項目名）", name: "pageName", widget: string, required: false, default: "お知らせ一覧ページ", hint: "管理画面の「下層ページ編集」一覧にこの項目の表記として表示されます。サイト上の見出し（下の「ページ見出し」）とは別に、管理用の識別名として自由に変更できます。" }
          - { label: "ページ見出し", name: "heading", widget: string, required: false, default: "お知らせ", hint: "※このページへのヘッダー・フッターのナビ項目で「表示名」が未入力の場合、この見出しがナビの表示名としても使われます。" }
          - { label: "リード文（Enterキーで改行可）", name: "lead", widget: text, required: false }
          - { label: "一覧セクションの見出し", name: "listHeading", widget: string, required: false, default: "お知らせ一覧", hint: "カテゴリ絞り込み・記事一覧の直前に表示される見出し。空欄にすると「お知らせ一覧」を表示します。" }

  # ==========================================================================
  # ④ 複数ページ版（master-template-multi）専用：お知らせ（投稿型）
  #    1記事 = src/content/news/*.md（frontmatter + Markdown本文）。
  #    ファイル名がURLスラッグになる（例: hello.md → /news/hello/）。
  # ==========================================================================
  - name: "news"
    label: "お知らせ投稿"
    folder: "src/content/news"
    create: true
    delete: true
    # products と同様、本文中の Markdown 画像も含めて .md からの相対パス
    # （../../assets/xxx）で記録する（詳細は products コレクションのコメント参照）。
    media_folder: "/src/assets"
    public_folder: "../../assets"
    # 記事タイトル（日本語）をそのままファイル名・URLスラッグにすると、
    # 非ASCII文字を含むURL（環境によっては文字化け・リンク切れの原因）に
    # なるため、Decap既定の {{slug}}（タイトルから自動生成）は使わず、
    # 半角英数字限定の「URL用識別子」フィールド（下の fields 参照）から
    # 明示的に組み立てる。
    # ※ フィールド名は "slug" ではなく "urlSlug" にしている（Astro の Content
    #   Collections が frontmatter の `slug` キーをURL上書き用の予約語として
    #   特別扱いするため。詳細は src/content/config.ts のコメント参照）。
    slug: "{{fields.urlSlug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["publishedAt", "title"]
    fields:
      - { label: "記事タイトル", name: "title", widget: string, required: false }
      - { label: "URL用識別子（半角英数字）", name: "urlSlug", widget: string, required: false, pattern: ['^[a-z0-9-]+$', '半角英小文字、数字、ハイフンのみ使用可能です'], hint: "タイトル入力に応じて、漢字・ひらがな・カタカナを自動でローマ字（ヘボン式）に変換して補完します（初回は変換辞書の読み込みに少し時間がかかることがあります）。この欄を直接編集すると自動補完は止まりますので、必要に応じて手動で調整してください。未入力のまま保存した場合は自動でランダムな識別子が割り当てられます。例: new-product-info" }
      - { label: "アイキャッチ画像", name: "image", widget: image, required: false }
      - { label: "アイキャッチ 代替テキスト", name: "imageAlt", widget: string, required: false }
      - { label: "公開日", name: "publishedAt", widget: datetime, required: false }
      - label: "カテゴリ"
        name: "category"
        widget: select
        required: false
        options:
          - { label: "お知らせ", value: "info" }
          - { label: "ブログ", value: "blog" }
          - { label: "イベント", value: "event" }
          - { label: "実績紹介", value: "works" }
      - { label: "抜粋（一覧・OGP用の要約文）", name: "summary", widget: text, required: false }
      - { label: "この記事を一覧の最上部に固定表示する", name: "pinned", widget: boolean, default: false, required: false }
      - { label: "固定時の表示優先度（数字が小さいほど上に表示）", name: "pinOrder", widget: number, value_type: int, default: 1, required: false, hint: "固定表示が有効な記事が複数ある場合に適用されます。" }
      - { label: "下書き（チェック中はサイトに公開されません）", name: "draft", widget: boolean, default: false, required: false }
      - label: "本文"
        name: "body"
        widget: markdown
        required: false
        buttons: *richTextButtons
        editor_components: *richTextComponents
