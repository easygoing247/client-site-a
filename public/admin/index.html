<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!--
      管理画面はタップ操作主体のUI（ドラッグ並び替え・スイッチ・独自タッチ
      スクロール等）を多く含み、意図しないピンチズームで操作を誤りやすい
      ため、拡大・縮小を禁止する（本体サイトのLayout.astroには影響しない、
      このファイル内だけの設定）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>管理画面 | Decap CMS</title>
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Decap CMS 関連スクリプトはこのページのみで読み込む（本体サイトへは絶対に混入させない）。
      本番公開後のアクセス制限は Cloudflare Access 側で行うこと（CLAUDE.md 参照）。
    -->
    <style>
      /*
        Decap CMS 本体のデフォルトCSSは、エントリ編集画面のツールバー／
        エディター領域（左：フォーム／右：プレビューの2カラム分割）に
        min-width: 800px を強制しており、スマホ幅では横スクロールの原因になる。
        クラス名はビルドごとに変わるハッシュ付き（例: css-hn3jn7-EditorContainer）
        のため、部分一致セレクタで安定して打ち消す。
        分割ビュー自体は react-split-pane 由来の固定クラス（.SplitPane, .Pane1,
        .Pane2, .Resizer）を持つため、そちらは通常のクラス名で指定できる。
      */
      html,
      body {
        overflow-x: hidden;
        max-width: 100%;
      }

      /*
        viewportのuser-scalable=noはAndroid Chrome等では効くが、iOS Safariは
        これを無視して2本指ピンチによる拡大を許可してしまう仕様がある。
        touch-action: manipulationを指定すると、ピンチズームや（連続タップに
        よる）ダブルタップズームのジェスチャーだけをブラウザに無効化させ、
        通常のタップ・縦スクロールのジェスチャーは妨げない
        （下部の<script>によるgesturestart等の抑止と合わせた二重の対策）。
      */
      html,
      body {
        touch-action: manipulation;
      }

      /*
        Decap CMS標準の挙動として、required: falseの項目名の末尾には
        「 (任意)」という接尾辞が自動的に <span> として追加される
        （例：<label>CTAボタン文言<span> (任意)</span></label>）。
        本プロジェクトはほぼ全項目をrequired: falseにしているため、この
        接尾辞があらゆる項目名に付いてしまい、かえって視認性を下げている。
        required: trueの項目（省略時の既定値）にはこの<span>自体が
        存在しないため、FieldLabel内の<span>を一律非表示にしても
        「(任意)」の接尾辞だけが消え、他の項目名表示には影響しない。
        （真に必須な項目にだけ「（必須）」を表示する処理は、下部の
        <script>でラベル文言に応じて個別に追加している。）
      */
      label[class*='FieldLabel'] > span {
        display: none;
      }

      /*
        リスト項目（機能フラグの並び替えリスト等）のドラッグハンドルは、
        タッチ操作だとブラウザ標準の縦スクロールジェスチャーと競合し、
        ドラッグ移動が効かない／画面が一緒にスクロールしてしまう問題がある。
        ハンドル要素にだけ touch-action:none を指定し、ブラウザ側の
        スクロールジェスチャーに奪われず react-sortable-hoc 側の
        ドラッグ処理へタッチイベントを渡す。
      */
      [class*='DragIconContainer'] {
        touch-action: none;
      }

      /*
        管理画面クイックナビ（項目一覧）ボタン・メニュー。
        スマホ・タブレット・PCいずれの画面幅でも表示する。位置（right/left）は
        JS側（updateNavButtonPosition）でPC時のプレビューペインの実際の表示
        状態に応じて動的に調整するため、ここでは初期値のみ指定する。
      */
      #cms-quick-nav-btn {
        display: none;
        position: fixed;
        right: 16px;
        bottom: 16px;
        width: 52px;
        height: 52px;
        border-radius: 999px;
        background: #1e40af;
        color: #fff;
        border: none;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
        font-size: 22px;
        line-height: 1;
        z-index: 9000;
        cursor: pointer;
      }

      #cms-quick-nav-btn.visible {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #cms-quick-nav-menu {
        display: none;
        position: fixed;
        right: 16px;
        bottom: 78px;
        width: min(78vw, 320px);
        max-height: 60vh;
        overflow-y: auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
        z-index: 9000;
        padding: 6px;
      }

      #cms-quick-nav-menu.open {
        display: block;
      }

      #cms-quick-nav-menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 11px 12px;
        border: none;
        background: none;
        font-size: 13px;
        color: #1f2937;
        border-bottom: 1px solid #eef0f4;
        cursor: pointer;
      }

      #cms-quick-nav-menu button:last-child {
        border-bottom: none;
      }

      #cms-quick-nav-menu button:active {
        background: #f1f5fb;
      }

      /*
        「プレビュー表示を切り替える」「スクロール同期を切り替える」の
        丸型ボタン（ViewControls）は、Decap本体の既定では
        position: absolute でプレビューペイン右上に重ねて配置されており、
        プレビュー内のコンテンツと干渉してしまう。
        下部の<script>でこの要素自体をヘッダー右側（アカウントアイコン
        側の区切り線のすぐ左、後述のToolbarSubSectionLast内）へDOM移動
        させるため、絶対配置を解除し、ヘッダーの他の項目と同様に
        横並びのflexで自然に並ぶようにする。
      */
      [class*='ViewControls'] {
        position: static !important;
        top: auto !important;
        right: auto !important;
        left: auto !important;
        bottom: auto !important;
        z-index: auto !important;
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        gap: 4px;
        width: auto !important;
        height: auto !important;
      }

      /*
        上のViewControlsを見た目だけヘッダー右側（ToolbarSubSectionLast付近）
        へ寄せるための固定配置。以前は targetWrapper.appendChild() でDOM上
        物理的に付け替えていたが、この要素はDecap本体（React）が生成・管理
        するノードのため、後から編集画面をアンマウントする際にReact側は
        「元の親要素の子である」という内部参照のまま removeChild しようと
        し、実際の親（我々が appendChild で差し替えた側）と食い違って
        `NotFoundError: Failed to execute 'removeChild' ...` が発生する
        ことがあった。特に「公開して新規作成」はエディタ全体を一旦
        アンマウントしてから真っさらな新規フォームを再マウントする、より
        大きな作り直しを伴うため、このタイミングで例外が起きると
        画面遷移そのものが失敗し、直前の編集画面に留まってしまう
        （「公開して複製する」は既存フォームを流用する軽い更新のため
        同じ経路を通らず、症状が出にくかったと考えられる）。
        DOM上の親子関係には一切手を加えず、CSSのposition:fixedのみで
        見た目の位置を再現することで、Reactのアンマウント処理と衝突しない
        ようにする（下部の<script> relocateViewControls() 参照）。
      */
      [class*='ViewControls'].cms-view-controls-pinned {
        position: fixed !important;
        z-index: 1001 !important;
      }

      /*
        「プレビューのチェック」テキストボタン（RefreshPreviewButton）は
        クリックしても目に見える反応がなく、実質的に不要なため非表示にする
        （React管理下のノードのため、DOM上から物理的に削除するとReact側の
        再レンダー時に不整合を起こす恐れがあるため、display:noneで隠す
        方式を取る）。上のViewControlsをこのボタンの元あった場所
        （ToolbarSubSectionLast内、アカウントアイコン側の区切り線の
        すぐ左）へ移動させるため、ここでスペースを空ける。
      */
      [class*='PreviewButtonContainer'] {
        display: none !important;
      }

      /*
        編集フォーム最下部の余白確保。
        クイックナビ（左下部のメニューアイコン／メニュー、#cms-quick-nav-btn
        ／#cms-quick-nav-menu）は画面幅を問わず position:fixed で常に
        画面下部に重なって表示されるため、フォーム自体の余白がゼロだと
        最後の項目（入力欄・スイッチ等）がこのボタンの下に隠れてしまい、
        スクロールしてもタップ・入力ができない事故につながる。
        実際にスクロールしているコンテナ（PC幅は
        [class*="ControlPaneContainer"] 自身、スマホ幅は
        [class*="EditorContainer"] だが、そのスクロール可能領域は
        .SplitPane > .Pane1 > ControlPaneContainer の高さに連動する
        ＝9.7章参照）に直接 padding-bottom を持たせることで、画面幅に
        関わらず1箇所の指定で最下部の余白を確保できる。
        Decap本体（emotion）がこのクラスへ自前の padding を動的に注入して
        おり、その <style> タグはこのファイルの静的な <style> より後に
        DOM挿入される＝詳細度が同じ場合はDecap側が後勝ちしてしまうため、
        !important で確実に上書きする（このファイル内の他の箇所と同じ理由・
        同じ対策）。
      */
      [class*='ControlPaneContainer'] {
        padding-bottom: 90px !important;
      }

      @media (max-width: 799px) {
        /*
          html/body は overflow-x のみ隠しており、overflow-y は既定（visible）
          のままだった。管理画面のコンテンツは [class*="EditorContainer"]
          （position:absolute, overflow:hidden）がJSでscrollTopを操作する
          方式のため、ページ本体（body）側が万一わずかでも縦にスクロール
          可能だと、実機でのスワイプ時にブラウザ標準のページスクロールと
          自前のタッチスクロール処理が同時に発生し、位置がずれて「画面が
          固まった」ように見える不具合につながっていた。
          スマホ幅ではページ本体自体を縦方向にもスクロール不可にし、
          スクロールは常に自前のタッチスクロール処理（下部の<script>）
          経由の scrollTop 操作に一本化する。
        */
        html,
        body {
          overflow-y: hidden;
        }

        [class*='ToolbarContainer'],
        [class*='EditorContainer'] {
          min-width: 0 !important;
          width: 100% !important;
        }

        /*
          スマホでヘッダー左側の「◯◯のエントリを作成中」「保存済／公開済」が
          極端に狭い幅（実測14px）へ押し込まれ、1文字ずつ縦積みになって
          見切れる・下の編集領域に被る不具合の修正。
          原因：右側の [class*="ToolbarSectionMeta"]（本番サイトURLリンク
          "master-template-multi.easygoing247.workers.dev" ＋ アカウント
          アイコン）が幅400px超を占有し、左側の
          [class*="ToolbarSectionBackLink"] を圧迫していた。
          → URLリンクはスマホでは非表示（アカウントメニューは残す）、
            左側セクションに伸長を許可し、テキストは縮小＋省略記号で1行に収める。
        */
        [class*='ToolbarSectionBackLink'] {
          flex: 1 1 auto !important;
          min-width: 0 !important;
          max-width: 66% !important;
          overflow: hidden !important;
        }
        /* BackArrow の隣、BackCollection / BackStatus を包む無名 div */
        [class*='ToolbarSectionBackLink'] > div:not([class*='BackArrow']) {
          min-width: 0 !important;
          flex: 1 1 auto !important;
          display: flex !important;
          flex-direction: column !important;
          justify-content: center !important;
          align-items: flex-start !important;
          overflow: hidden !important;
          height: auto !important;
        }
        [class*='BackCollection'] {
          font-size: 11px !important;
          line-height: 1.35 !important;
          max-width: 100% !important;
          white-space: nowrap !important;
          overflow: hidden !important;
          text-overflow: ellipsis !important;
        }
        [class*='BackStatus'] {
          font-size: 10px !important;
          line-height: 1.2 !important;
          white-space: nowrap !important;
        }
        [class*='ToolbarSectionMeta'] {
          flex: 0 0 auto !important;
          min-width: 0 !important;
        }
        [class*='AppHeaderSiteLink'] {
          display: none !important;
        }

        /*
          ツールバー（戻る／公開状態／「公開」ボタン等）をスクロール追従
          （スティッキー）にする。
          Decap本体は既定でこれを position:absolute; top:0 として
          [class*="EditorContainer"] の内容領域の先頭に重ねて配置しており、
          （自前のタッチスクロール処理で操作している）scrollTopの値が
          増えると他のコンテンツと一緒に画面外へスクロールしてしまっていた。
          position:sticky に変更することで通常のフロー内要素として扱われ、
          スクロール量に応じて自身の本来の位置を保ちつつ、画面上端に
          達した時点でそこに固定される（＝スクロール中も常にタップ可能）。
        */
        [class*='ToolbarContainer'] {
          position: sticky !important;
          top: 0 !important;
          z-index: 1000 !important;
          background: #fff;
          box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
        }

        /*
          [class*="EditorContainer"] にはツールバー分の高さ（66px）を
          確保する padding-top が最初から設定されている（元々ツールバーを
          position:absoluteで重ねて配置する前提のスペーサー）。
          sticky化した今、この padding-top が「コンテインブロックの
          コンテント領域の開始位置」を66pxに押し下げてしまい、sticky要素は
          その内側（コンテント領域）より上には固定できない仕様のため、
          画面最上部（0px）ではなく66px地点までしか追従できなくなる。
          padding-top を打ち消し、ツールバー自身の高さぶんは通常の
          フロー内で自然に確保させることで、0pxにきちんと固定されるようにする。
        */
        [class*='EditorContainer'] {
          padding-top: 0 !important;
        }

        /*
          「テーマカラー」「セクション表示順序」等のselectウィジェット
          （react-select）が展開する選択肢メニューは、コントロール自身の
          直近の祖先要素からposition:absoluteで飛び出す形で描画される。
          飛び出し先の途中にある祖先要素（[class*="ControlPaneContainer"]等）
          のoverflow指定によっては、そこで見切れてしまう場合がある。
          overflow:visibleは効果があるケースもあるが、途中の祖先すべてを
          洗い出して個別に打ち消す方式は見落としに弱く、実機では依然として
          見切れ・スクロール不可が発生することを確認したため、根本対応は
          下部の<script>でメニュー自体をposition:fixedに切り替える方式で
          行っている（要素を祖先のoverflow制限から完全に独立させるため、
          途中の祖先が何であっても影響を受けなくなる）。
          このoverflow:visibleは、JSが介入する直前の一瞬だけ見切れて見える
          ちらつきを防ぐための保険として残している。
          （[class*="EditorContainer"] 自体は自前スクロールの要となるため
          overflow:hiddenのまま変更しない。）
        */
        [class*='ControlPaneContainer'] {
          overflow: visible !important;
        }

        /*
          左右分割レイアウトを解除し、フォームのみを全幅表示する。
          .SplitPane の height:auto は一見不要に見えるが、これを外すと
          .SplitPane 自身が持つ inline の overflow:hidden ＋ 固定高さ（100%）
          によってフォームの内容がその高さ（ツールバー分を除いた表示領域）で
          クリップされ、下の方の項目が一切表示・到達不能になる不具合が起きる
          ことを確認済み（削除厳禁）。
          このheight:autoにより .SplitPane 自身がコンテンツの全高まで
          広がり、その分だけ祖先の [class*="EditorContainer"]（overflow:hidden）
          側でスクロール可能領域として認識されるようになり、JSからの
          scrollTop操作でスクロールできる仕組みになっている。
          なお [class*="EditorContainer"] は overflow:hidden のまま変更しない
          こと。auto に変更すると同様にDecap内部のサイズ計測が崩れ、内容が
          圧縮表示される不具合を確認済み。実機でのスワイプ操作は、後述の
          スクリプト内で scrollTop を直接書き換える自前のタッチスクロール
          処理を実装して対応している。
        */
        .SplitPane {
          position: relative !important;
          display: block !important;
          height: auto !important;
        }

        .Pane1 {
          width: 100% !important;
          max-width: 100% !important;
          flex: 0 0 100% !important;
        }

        .Pane2,
        .Resizer {
          display: none !important;
        }

        /*
          プレビューペインを非表示にした際、プレビュー切替／更新／スクロール同期
          ボタン群（ToolbarSectionMain の2番目の子要素）だけが極端に狭い幅に
          押し込まれ、ラベル文字が1文字ずつ縦積みで表示されてしまうため、
          プレビュー本体と合わせてこのボタン群も非表示にする。
          （1番目の子要素＝公開状態バッジは残す）
        */
        [class*='ToolbarSectionMain'] > div:last-child {
          display: none !important;
        }

        /*
          プレビュー表示切替／スクロール同期切替ボタン（下部の<script>で
          ヘッダー右側へ移動させているEditorToggle／ViewControls）も、
          プレビューペイン自体を非表示にしている以上不要なため、
          移動先のヘッダー内でも非表示にする。
        */
        [class*='EditorToggle'],
        [class*='ViewControls'] {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!--
      バージョンは意図的に固定（キャレット範囲 ^3.0.0 にしない）。unpkg は
      semver 範囲をリクエスト毎に解決するため、範囲指定のままだと配信される
      実体バージョンが無告知で変わり得る（再現性が無く、退行版に当たっても
      気付けない）。実際に「公開して新規作成／公開して複製する」を実行しても
      フォームが新規作成画面へ遷移せず旧エントリの画面に留まる不具合が
      発生したため、スラッグ生成まわりの改善（フルネームでの特殊文字対応・
      テンプレート文字列でのフィルタ対応等）を含む最新安定版へ明示的に
      固定した。更新時は https://github.com/decaporg/decap-cms/releases を
      確認し、この行のバージョンとコメントの日付を両方更新すること。
      （固定日: 2026-09。当時の最新安定版 3.16.2）
    -->
    <script src="https://unpkg.com/decap-cms@3.16.2/dist/decap-cms.js"></script>
    <!--
      「サイト全体設定」「デザインテーマ設定」のリアルタイムプレビュー
      テンプレート（CMS.registerPreviewTemplate）。decap-cms.js が公開する
      window.h / window.createClass / window.CMS を使うため、
      本体スクリプトの読み込み直後・かつCMSの初期化前にこの位置で読み込む。
    -->
    <script src="./preview.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/admin/';
            });
          }
        });
      }
    </script>

    <!--
      以下は Decap CMS 本体のReactアプリに対する後付けのDOM拡張スクリプト。
      Decap本体を改造せず、レンダリング結果のDOMを監視・補完する形で
      「スマホ用クイックナビ」と「見出し⇄機能フラグ／セクション表示順序の
      表示文言 同期」を実現している。
      Decap CMSのクラス名はビルドごとに変わるハッシュ付きのため、個別の
      ハッシュ文字列には依存せず、部分一致セレクタとDOM構造（ControlContainer
      の入れ子段数）で要素を特定している。
    -->
    <script>
      (function () {
        // ==================================================================
        // 0) ピンチズームの無効化（iOS Safari対策）
        //    viewportメタタグの user-scalable=no / maximum-scale=1.0 と
        //    CSSの touch-action: manipulation だけでは、iOS Safariが2本指
        //    ピンチによる拡大を無視して許可してしまう場合がある。
        //    iOS SafariはWebKit独自のgesture系イベント（標準化されていない）
        //    を発火するため、これらをすべて preventDefault() し、ピンチ操作
        //    そのものを無効化する（Android Chrome等はそもそもgesture*イベント
        //    を発火しないため、この処理は影響しない）。
        // ==================================================================
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (eventName) {
          document.addEventListener(
            eventName,
            function (e) {
              e.preventDefault();
            },
            { passive: false }
          );
        });

        // ------------------------------------------------------------------
        // 共通ヘルパー：エントリ編集フォームの「トップレベル項目」を判定する。
        // Decap CMSは各フィールド（オブジェクト／リスト／単一フィールドいずれも）
        // を [class*="ControlContainer"] でラップして入れ子にするため、
        // ある要素からフォームのルート（[class*="ControlPaneContainer"]）まで
        // ControlContainer が何回出現するかを数えれば「入れ子の深さ」が分かる。
        // 深さ1＝管理画面に並ぶ大項目（会社・サイト基本情報、機能フラグ 等）。
        // ------------------------------------------------------------------
        function getFormRoot() {
          return document.querySelector('[class*="ControlPaneContainer"]');
        }

        // Decapのエディター画面は、画面幅によって実際にスクロールしている
        // コンテナが異なる。
        // ・PC幅（800px以上）：[class*="ControlPaneContainer"]（フォーム側の
        //   ペイン自体）が overflow-y:auto でネイティブにスクロールする
        //   （プレビュー追従スクロール（syncPreviewScroll）が同要素の
        //   scrollイベントを見ているのと同じコンテナ）。
        // ・スマホ幅（799px以下）：ドロップダウンの選択肢がクリップされない
        //   よう [class*="ControlPaneContainer"] 自体は overflow:visible!important
        //   に上書きしているため、代わりに [class*="EditorContainer"] を
        //   overflow:hiddenのまま自前でscrollTop操作する独自スクロール実装
        //   になっている。
        // ネイティブの scrollIntoView() ではどちらの実装でもスクロールしない
        // ため、実際にスクロールするコンテナを探して scrollTop を書き換える。
        // 単に「scrollHeightがclientHeightより大きい」だけで判定すると、
        // PC幅でも [class*="EditorContainer"] 側にわずかな内部差分（数十px、
        // ツールバー領域の丸め誤差等）があり誤検出してしまう
        // （overflow-y:hiddenのまま実際には自前スクロールに使われていない
        // ダミーの余白のため、scrollTopを書き換えても画面上は一切動かない）。
        // overflow-y が visible な要素は scrollTop を書き換えても効果が無い
        // （スクロール可能領域を持たない）ため候補から除外し、それ以外で
        // 実際にオーバーフローしている最初の候補を採用することで、PC幅・
        // スマホ幅のどちらでも正しいコンテナを取り違えないようにする。
        function findScrollContainer() {
          var candidates = [
            document.querySelector('[class*="ControlPaneContainer"]'),
            document.querySelector('[class*="EditorContainer"]'),
            document.querySelector('.Pane1'),
            document.scrollingElement,
            document.documentElement,
          ];
          for (var i = 0; i < candidates.length; i++) {
            var el = candidates[i];
            if (!el) continue;
            if (getComputedStyle(el).overflowY === 'visible') continue;
            if (el.scrollHeight - el.clientHeight > 4) return el;
          }
          return null;
        }

        function animateScrollTop(container, destination) {
          // requestAnimationFrame はブラウザの描画タイミングに依存するため、
          // 省電力タブや一部のプレビュー環境で発火が遅延・停止することがある。
          // setInterval であれば描画状態に関わらず一定間隔で確実に進むため、
          // スクロールアニメーションにはこちらを使う。
          var start = container.scrollTop;
          var change = destination - start;
          var duration = 420;
          var stepMs = 16;
          var startTime = Date.now();
          function easeInOutQuad(t) {
            return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          }
          var timer = setInterval(function () {
            var elapsed = Date.now() - startTime;
            var progress = Math.min(1, elapsed / duration);
            container.scrollTop = start + change * easeInOutQuad(progress);
            if (progress >= 1) clearInterval(timer);
          }, stepMs);
        }

        function scrollToElement(target) {
          if (!target) return;
          try {
            var container = findScrollContainer();
            if (!container) throw new Error('scroll container not found');
            // この画面は [class*="EditorContainer"] が overflow:hidden かつ
            // scrollTopをJSから直接書き換える独自スクロール実装のため、
            // CSSの scroll-behavior/Element.scrollTo の smooth 指定が効かない。
            // setInterval で scrollTop を手動アニメーションさせる。
            var containerRect = container.getBoundingClientRect();
            var targetRect = target.getBoundingClientRect();
            var destination = container.scrollTop + (targetRect.top - containerRect.top) - 12;
            animateScrollTop(container, Math.max(0, destination));
          } catch (e) {
            // 想定外の構造の場合はネイティブのスクロールにフォールバックする
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }

        // ==================================================================
        // 3) スマホでの縦スクロール（自前実装）
        //    [class*="EditorContainer"] は overflow:hidden のため、ブラウザ
        //    標準のスワイプ操作では一切スクロールしない。Decap本体はおそらく
        //    独自のドラッグ／リサイズ計算に依存した内部実装でスクロールを
        //    実現しているが、CSSでプレビュー側を非表示にする都合上その前提が
        //    崩れやすく、実機でスワイプが効かなくなる不具合が確認された。
        //    ここでは、指のドラッグ量をそのまま scrollTop に反映する最小限の
        //    タッチスクロールを自前で実装し、Decap内部実装に依存せず確実に
        //    動作するようにする（PCでは元々マウスホイールで動くため対象外）。
        // ==================================================================
        var touchScrollContainer = null;
        var touchStartY = 0;
        var touchStartScrollTop = 0;
        var touchIsDragging = false;
        var touchHasMoved = false;
        var TOUCH_MOVE_THRESHOLD = 6; // px（誤反応を避けるための最小移動量）

        function isTouchScrollExempt(target) {
          // フォーム操作要素・ドラッグ並び替えハンドル・クイックナビUI・
          // プルダウンの選択肢・モーダル内は、それぞれ本来の操作を優先し、
          // 自前スクロールの対象外とする。
          return !!(
            target.closest &&
            target.closest(
              [
                'input',
                'textarea',
                'select',
                '[contenteditable]',
                '[class*="DragIconContainer"]',
                '#cms-quick-nav-btn',
                '#cms-quick-nav-menu',
                '[class$="-menu"]',
                '[class*="-option"]',
                '[class*="Modal"]',
                '[role="dialog"]',
              ].join(',')
            )
          );
        }

        document.addEventListener(
          'touchstart',
          function (e) {
            if (!window.matchMedia('(max-width: 799px)').matches) return;
            if (e.touches.length !== 1) return;
            if (isTouchScrollExempt(e.target)) return;
            var container = findScrollContainer();
            if (!container) return;
            touchScrollContainer = container;
            touchStartY = e.touches[0].clientY;
            touchStartScrollTop = container.scrollTop;
            touchIsDragging = true;
            touchHasMoved = false;
          },
          { passive: true }
        );

        document.addEventListener(
          'touchmove',
          function (e) {
            if (!touchIsDragging || !touchScrollContainer) return;
            var deltaY = e.touches[0].clientY - touchStartY;
            if (Math.abs(deltaY) > TOUCH_MOVE_THRESHOLD) touchHasMoved = true;
            if (touchHasMoved) {
              // ブラウザ標準のページスクロール／バウンスが自前スクロールと
              // 同時に発生すると、[class*="EditorContainer"] が
              // position:absolute のためページ本体のスクロールに引きずられて
              // 表示位置がずれ、実機では「画面が固まった」ように見える不具合が
              // あった。このジェスチャーは自前スクロールとして処理している
              // ことを明示し、標準スクロールを完全に無効化する。
              // （このリスナーは exempt 対象＝input/textarea/select/モーダル等
              // では touchIsDragging が立たず、ここに到達しないため、
              // それらの要素本来のネイティブスクロール／操作は妨げない）
              e.preventDefault();
              touchScrollContainer.scrollTop = touchStartScrollTop - deltaY;
            }
          },
          { passive: false }
        );

        function endTouchScroll() {
          touchIsDragging = false;
          touchHasMoved = false;
          touchScrollContainer = null;
        }
        document.addEventListener('touchend', endTouchScroll, { passive: true });
        document.addEventListener('touchcancel', endTouchScroll, { passive: true });

        function controlDepth(el, root) {
          var depth = 0;
          var cur = el;
          while (cur && cur !== root) {
            if (typeof cur.className === 'string' && cur.className.indexOf('ControlContainer') !== -1) {
              depth++;
            }
            cur = cur.parentElement;
          }
          return depth;
        }

        // Decapが required: false の項目名に自動付与する「 (任意)」接尾辞
        // （CSS側では[class*="FieldLabel"] > spanとして非表示にしているが、
        // textContentには引き続き含まれる）を取り除く。クイックナビの
        // ボタン文言表示、および見出し文言でのグループ特定（文字列完全一致）
        // の両方で、この接尾辞込みのテキストのままだと表示・比較の両面で
        // 支障が出るため、テキストを読み取る箇所では必ずこれを経由する。
        function stripOptionalSuffix(text) {
          return text.replace(/\s*\(任意\)\s*$/, '');
        }

        function topLevelFieldLabels(root) {
          if (!root) return [];
          var labels = Array.prototype.slice.call(root.querySelectorAll('[class*="FieldLabel"]'));
          return labels.filter(function (l) {
            return controlDepth(l, root) === 1;
          });
        }

        // 深さ1のラベルテキストから、そのグループの ControlContainer 本体を辿る
        function findGroupContainer(root, groupLabelText) {
          var labels = topLevelFieldLabels(root);
          var match = null;
          for (var i = 0; i < labels.length; i++) {
            if (stripOptionalSuffix(labels[i].textContent).trim() === groupLabelText) {
              match = labels[i];
              break;
            }
          }
          if (!match) return null;
          var el = match;
          while (el && !(typeof el.className === 'string' && el.className.indexOf('ControlContainer') !== -1)) {
            el = el.parentElement;
          }
          return el;
        }

        // ==================================================================
        // 1) スマホ用クイックナビ：管理画面の各大項目へスムーズスクロールする
        //    フローティングメニュー（スマホ幅かつエントリ編集画面でのみ表示）
        // ==================================================================
        var navBtn = document.createElement('button');
        navBtn.id = 'cms-quick-nav-btn';
        navBtn.type = 'button';
        navBtn.setAttribute('aria-label', '項目一覧を開く');
        navBtn.textContent = '☰';

        var navMenu = document.createElement('div');
        navMenu.id = 'cms-quick-nav-menu';

        document.body.appendChild(navBtn);
        document.body.appendChild(navMenu);

        function closeNavMenu() {
          navMenu.classList.remove('open');
        }

        function rebuildNavMenu() {
          var root = getFormRoot();
          navMenu.innerHTML = '';
          if (!root) return false;
          var labels = topLevelFieldLabels(root);
          if (!labels.length) return false;
          labels.forEach(function (label) {
            var text = stripOptionalSuffix(label.textContent).trim();
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = text;
            btn.addEventListener('click', function () {
              // メニューを開いてから実際にタップするまでの間にCMS側の再描画で
              // 参照が古くなっている可能性があるため、クリック時に同じラベル
              // 文言の要素を改めて探し直してからスクロールする。
              var freshRoot = getFormRoot();
              var freshLabels = topLevelFieldLabels(freshRoot);
              var freshTarget = label;
              for (var i = 0; i < freshLabels.length; i++) {
                if (stripOptionalSuffix(freshLabels[i].textContent).trim() === text) {
                  freshTarget = freshLabels[i];
                  break;
                }
              }
              // スマホでは入力中のキーボードが開いたままだと fixed 要素の
              // 表示位置とタップ判定がずれることがあるため、先にフォーカスを外す
              if (document.activeElement && typeof document.activeElement.blur === 'function') {
                document.activeElement.blur();
              }
              closeNavMenu();
              scrollToElement(freshTarget);
            });
            navMenu.appendChild(btn);
          });
          return true;
        }

        navBtn.addEventListener('click', function () {
          if (navMenu.classList.contains('open')) {
            closeNavMenu();
            return;
          }
          if (document.activeElement && typeof document.activeElement.blur === 'function') {
            document.activeElement.blur();
          }
          if (rebuildNavMenu()) {
            navMenu.classList.add('open');
          }
        });

        document.addEventListener('click', function (e) {
          if (!navMenu.classList.contains('open')) return;
          if (e.target === navBtn || navMenu.contains(e.target)) return;
          closeNavMenu();
        });

        // PC幅（Decap本体が左：フォーム／右：プレビューの2カラム表示を行う
        // min-width:800px 以上の幅）では、ボタン／メニューがプレビューペインに
        // 重ならないよう、実際に表示中の Pane1（フォーム側）の右端の位置に
        // 合わせて right を動的に調整する。
        // スマホ・タブレット幅（799px以下）では、既にCSSでプレビュー自体を
        // 非表示にして単一カラム表示にしているため、常に画面右下に固定表示
        // する＝スマホと全く同じ見た目・挙動になる。
        // （閾値はプレビュー2カラム化のCSSと同じ799pxに揃えている）
        function updateNavButtonPosition() {
          if (window.matchMedia('(max-width: 799px)').matches) {
            navBtn.style.right = '16px';
            navMenu.style.right = '16px';
            return;
          }
          var pane1 = document.querySelector('.Pane1');
          var pane2 = document.querySelector('.Pane2');
          var previewVisible =
            pane2 && getComputedStyle(pane2).display !== 'none' && pane2.getBoundingClientRect().width > 0;
          if (previewVisible && pane1) {
            var offset = Math.max(16, window.innerWidth - pane1.getBoundingClientRect().right + 16);
            navBtn.style.right = offset + 'px';
            navMenu.style.right = offset + 'px';
          } else {
            navBtn.style.right = '16px';
            navMenu.style.right = '16px';
          }
        }

        function updateNavButtonVisibility() {
          var onEntryScreen = !!getFormRoot();
          navBtn.classList.toggle('visible', onEntryScreen);
          if (!onEntryScreen) closeNavMenu();
          updateNavButtonPosition();
        }

        window.addEventListener('resize', updateNavButtonVisibility);
        window.addEventListener('hashchange', function () {
          closeNavMenu();
          updateNavButtonVisibility();
        });

        // ==================================================================
        // 2) 見出し ⇄ 機能フラグ／セクション表示順序 の表示文言 同期
        //    Decap CMS はフィールドラベルや選択肢を config.yml 由来の
        //    固定文字列として描画し、他フィールドの値と連動させる仕組みを
        //    持たないため、実際の見出し入力値を定期的にDOMへ反映させる形で
        //    疑似的に同期する。
        // ==================================================================

        // セクションID → 対応する見出しセクションの大項目ラベル文言
        // （config.yml の該当オブジェクトフィールドの label と一致させること）
        var GROUP_LABELS = {
          features: '選ばれる理由',
          services: 'サービス',
          flow: '制作の流れ',
          products: '商品一覧',
          works: '実績',
          plans: '料金プラン',
          faq: 'FAQ',
          access: 'アクセス',
          contact: 'お問い合わせ',
        };

        // 機能フラグ／セクション表示順序の選択肢は、この順序で並んでいる
        // （config.yml の features フィールド順・sectionOrder の options 順と一致させること）
        var OPTION_ORDER = ['features', 'services', 'flow', 'products', 'works', 'plans', 'faq', 'access', 'contact'];

        var HEADING_FALLBACK = {
          features: '選ばれる3つの理由',
          services: 'サービス・事業内容',
          flow: 'ご相談から納品までの流れ',
          products: '商品一覧',
          works: '実績・活用事例',
          plans: '料金プラン',
          faq: 'よくある質問',
          access: '店舗概要・アクセス',
          contact: 'お問い合わせ',
        };

        var latestHeadings = Object.assign({}, HEADING_FALLBACK);

        function findHeadingValueInGroup(groupContainer) {
          if (!groupContainer) return null;
          var labels = Array.prototype.slice.call(groupContainer.querySelectorAll('[class*="FieldLabel"]'));
          var headingLabel = null;
          for (var i = 0; i < labels.length; i++) {
            if (controlDepth(labels[i], groupContainer) === 1 && stripOptionalSuffix(labels[i].textContent).trim() === '見出し') {
              headingLabel = labels[i];
              break;
            }
          }
          if (!headingLabel) return null;
          var forId = headingLabel.getAttribute('for');
          var input = forId ? document.getElementById(forId) : null;
          return input && input.value ? input.value : null;
        }

        function syncSectionLabels() {
          var root = getFormRoot();
          if (!root) return;

          var headings = Object.assign({}, HEADING_FALLBACK);
          Object.keys(GROUP_LABELS).forEach(function (key) {
            var container = findGroupContainer(root, GROUP_LABELS[key]);
            var val = findHeadingValueInGroup(container);
            if (val) headings[key] = val;
          });
          latestHeadings = headings;

          // 機能フラグのチェックボックスラベル（config.yml の定義順に並ぶ前提）
          var featuresContainer = findGroupContainer(root, '機能フラグ（プラン切り替え）');
          if (featuresContainer) {
            var checkboxLabels = Array.prototype.slice
              .call(featuresContainer.querySelectorAll('[class*="FieldLabel"]'))
              .filter(function (l) {
                return controlDepth(l, featuresContainer) === 1;
              });
            OPTION_ORDER.forEach(function (key, i) {
              // 商品・型化ページの表示チェックボックスは「（竹/松プラン）」という
              // プラン文脈の補足が付いた専用文言のため、他と違い上書きしない。
              if (key === 'products') return;
              var label = checkboxLabels[i];
              if (label) label.textContent = '「' + headings[key] + '」セクションを表示する';
            });
          }

          // セクション表示順序：各アイテムの「選択中の表示テキスト」
          var orderContainer = findGroupContainer(root, 'セクション表示順序');
          if (orderContainer) {
            var items = orderContainer.querySelectorAll('[class*="SortableListItem"]');
            items.forEach(function (item) {
              var idLabel = item.querySelector('[class*="NestedObjectLabel"]');
              var key = idLabel ? idLabel.textContent.trim() : null;
              if (!key || !headings[key]) return;
              var singleValue = item.querySelector('[class*="singleValue"]');
              if (singleValue) singleValue.textContent = headings[key];
            });
          }
        }

        // セレクトの選択肢（プルダウンを開いた瞬間に生成される）は
        // config.yml 由来の固定ラベルで毎回描画し直されるため、開くたびに書き換える。
        // ただし、この書き換えは「セクション表示順序」の並び替えリスト内にある
        // セクション選択プルダウンだけが対象。他のプルダウン（テーマカラー選択
        // 等、今後追加されるものも含む）まで巻き込んで書き換えてしまわないよう、
        // 開いたメニューが実際に「セクション表示順序」のコンテナ配下にあるか
        // どうかを毎回確認してから適用する。
        var menuObserver = new MutationObserver(function (mutations) {
          mutations.forEach(function (m) {
            m.addedNodes.forEach(function (node) {
              if (!(node instanceof HTMLElement)) return;
              var menu = null;
              if (node.className && typeof node.className === 'string' && /-menu$/.test(node.className)) {
                menu = node;
              } else if (node.querySelector) {
                menu = node.querySelector('[class$="-menu"]');
              }
              if (!menu) return;

              var root = getFormRoot();
              var orderContainer = root ? findGroupContainer(root, 'セクション表示順序') : null;
              if (!orderContainer || !orderContainer.contains(menu)) return;

              var options = menu.querySelectorAll('[class*="-option"]');
              // 「セクション表示順序」の選択肢数（OPTION_ORDER基準）と一致しない
              // 場合は誤爆防止のため何もしない。
              if (options.length !== OPTION_ORDER.length) return;
              options.forEach(function (opt, i) {
                var key = OPTION_ORDER[i];
                if (key && latestHeadings[key]) {
                  opt.textContent = latestHeadings[key];
                }
              });
            });
          });
        });
        menuObserver.observe(document.body, { childList: true, subtree: true });

        // ==================================================================
        // 4) select ウィジェット（react-select）の選択肢メニューを
        //    スマホ表示でも完全に表示・操作できるようにする（根本対応）。
        //    Decap本体は選択肢メニューを、コントロールの直近の祖先要素から
        //    position:absoluteで飛び出す形で描画する。この方式だと、
        //    途中にあるどれか一つの祖先要素にでもoverflow:hiddenや高さ制限が
        //    あれば、そこで見切れてしまう（今回問題になった
        //    [class*="ControlPaneContainer"]に限らず、Decapの内部実装が
        //    変わって別の祖先が同様の制限を持つようになった場合も同じ問題が
        //    再発しうる）。
        //    途中の祖先を一つずつ洗い出して打ち消す対症療法ではなく、
        //    メニュー自体を position:fixed に切り替えて祖先要素のoverflow
        //    制限から完全に切り離し、実際のコントロールの画面上の表示位置
        //    （getBoundingClientRect）を基準に自前で配置し直す。
        //    position:fixedの要素は、途中の祖先にtransform/filter/contain
        //    等（この画面には存在しないことを確認済み）が無い限りビュー
        //    ポート基準で配置されるため、[class*="EditorContainer"]を
        //    含むどの祖先のoverflow:hiddenの影響も受けない
        //    （[class*="EditorContainer"]自体は自前スクロールの要のため、
        //    このoverflow:hiddenは変更せずそのまま維持する）。
        // ==================================================================
        var fixedMenuState = null; // { menu: Element, control: Element }

        function repositionFixedMenu() {
          if (!fixedMenuState) return;
          var menu = fixedMenuState.menu;
          if (!document.body.contains(menu)) {
            fixedMenuState = null;
            return;
          }
          var rect = fixedMenuState.control.getBoundingClientRect();
          var margin = 4;
          var edgeGap = 8;
          var spaceBelow = window.innerHeight - rect.bottom - margin - edgeGap;
          var spaceAbove = rect.top - margin - edgeGap;
          menu.style.left = rect.left + 'px';
          menu.style.width = rect.width + 'px';
          if (spaceBelow >= 120 || spaceBelow >= spaceAbove) {
            // コントロールの下に十分な余白がある場合はそのまま下に表示する
            menu.style.top = rect.bottom + margin + 'px';
            menu.style.bottom = 'auto';
            menu.style.maxHeight = Math.max(120, spaceBelow) + 'px';
          } else {
            // 画面下端に近く下に十分な余白がない場合はコントロールの上に表示する
            menu.style.top = 'auto';
            menu.style.bottom = window.innerHeight - rect.top + margin + 'px';
            menu.style.maxHeight = Math.max(120, spaceAbove) + 'px';
          }
        }

        function activateFixedMenu(menu) {
          // menuの直近の親（react-selectの"container"）配下に、同じ
          // ウィジェットのコントロール本体（[class*="-control"]）が
          // 兄弟要素として存在する前提で、それを配置の基準にする。
          var container = menu.parentElement;
          var control = container && container.querySelector('[class*="-control"]');
          if (!control) return;
          menu.style.position = 'fixed';
          menu.style.zIndex = '99999';
          menu.style.margin = '0';
          menu.style.overflowY = 'auto';
          menu.style.webkitOverflowScrolling = 'touch';
          fixedMenuState = { menu: menu, control: control };
          repositionFixedMenu();
        }

        var fixedMenuObserver = new MutationObserver(function (mutations) {
          if (!window.matchMedia('(max-width: 799px)').matches) return;
          var root = getFormRoot();
          if (!root) return;
          mutations.forEach(function (m) {
            m.addedNodes.forEach(function (node) {
              if (!(node instanceof HTMLElement)) return;
              var menu =
                typeof node.className === 'string' && /-menu$/.test(node.className)
                  ? node
                  : node.querySelector && node.querySelector('[class$="-menu"]');
              // フォーム領域（selectウィジェットが存在しうる範囲）配下の
              // メニューのみを対象にし、万一Decapの他の場所に同様の
              // クラス名を持つ要素があっても誤って巻き込まないようにする。
              if (menu && root.contains(menu)) activateFixedMenu(menu);
            });
          });
        });
        fixedMenuObserver.observe(document.body, { childList: true, subtree: true });

        window.addEventListener('resize', repositionFixedMenu);
        // scrollイベントはバブリングしないため、[class*="EditorContainer"]
        // 自身で発生するscroll（自前タッチスクロールによるscrollTop変更）も
        // 確実に検知できるよう、キャプチャ段階でdocumentに登録する。
        document.addEventListener('scroll', repositionFixedMenu, true);

        // ==================================================================
        // 5) 真に必須な項目にだけ「（必須）」を明記する
        //    Decap本体はrequired: falseの項目にのみ「(任意)」<span>を
        //    自動付与し（上のCSSで非表示化済み）、required: true
        //    （省略時の既定値）の項目には何も表示しない。本プロジェクトで
        //    唯一required: falseにしていない＝真に必須なフィールドは、
        //    「セクション表示順序」「SNS表示順序」の各項目が持つセレクト
        //    （順序リストの構造上必須な識別子）と、「デザインテーマ設定」の
        //    「テーマカラー」の3つのみ。ラベル文言はconfig.yml側で
        //    このプロジェクト内でのみ使われる一意な文言のため、文言一致で
        //    判定して問題ない。
        // ==================================================================
        var REQUIRED_FIELD_LABEL_TEXTS = ['セクション', 'SNS', 'テーマカラー'];
        function markRequiredFieldLabels() {
          var labels = document.querySelectorAll('label[class*="FieldLabel"]');
          labels.forEach(function (label) {
            if (label.querySelector('.cms-required-badge')) return;
            // 先頭のテキストノード（Decapが付与する"(任意)"<span>より前の
            // 本来のラベル文言部分）だけを比較対象にする。
            var firstNode = label.childNodes[0];
            var text = firstNode && firstNode.nodeType === Node.TEXT_NODE ? firstNode.textContent.trim() : label.textContent.trim();
            if (REQUIRED_FIELD_LABEL_TEXTS.indexOf(text) === -1) return;
            var badge = document.createElement('span');
            badge.className = 'cms-required-badge';
            badge.textContent = '（必須）';
            label.appendChild(badge);
          });
        }

        // ==================================================================
        // 6) PC表示：フォーム／プレビューの境界線（.Resizer）をドラッグして
        //    幅を変更した後、スクロールが効かなくなる不具合の対策。
        //    Decap本体が内部で使っているreact-split-paneは、ドラッグ中に
        //    プレビュー側のiframeがマウス／タッチイベントを奪ってドラッグの
        //    追従が止まってしまうのを防ぐため、ドラッグ中だけiframe（および
        //    フォーム側コンテナ）に pointer-events:none 相当の制限を一時的に
        //    かける実装になっている。ドラッグ終了のタイミングによっては、
        //    この制限や、リサイズに伴うレイアウト再計算で上書きされた
        //    overflow-y の指定が正しい状態に戻らないまま残ってしまい、
        //    フォーム側・プレビュー側のどちらもスクロール操作を受け付け
        //    なくなることがある。
        //    .Resizer 上で開始したドラッグが終了した際に、フォーム側
        //    コンテナのoverflow-yと、プレビュー側iframeのpointer-eventsを
        //    強制的に正しい値へ戻すことで復旧する。
        // ==================================================================
        var resizerDragActive = false;

        function isResizerTarget(target) {
          return !!(target && target.closest && target.closest('.Resizer'));
        }

        document.addEventListener(
          'mousedown',
          function (e) {
            if (isResizerTarget(e.target)) resizerDragActive = true;
          },
          true
        );
        document.addEventListener(
          'touchstart',
          function (e) {
            if (isResizerTarget(e.target)) resizerDragActive = true;
          },
          true
        );

        function restoreScrollAfterResize() {
          // フォーム側：ドラッグ中の一時的な指定が残っていても、常に
          // 縦スクロール可能・横スクロール不可の状態に戻す。
          var controlPane = document.querySelector('[class*="ControlPaneContainer"]');
          if (controlPane) {
            controlPane.style.overflowY = 'auto';
            controlPane.style.overflowX = 'hidden';
          }
          // プレビュー側：ドラッグ中にiframeへ掛けたpointer-events制限を解除する。
          var pane2 = document.querySelector('.Pane2');
          if (pane2) {
            pane2.style.pointerEvents = '';
            var iframe = pane2.querySelector('iframe');
            if (iframe) iframe.style.pointerEvents = '';
          }
          // ドラッグ用に付与されるカーソル／テキスト選択禁止の指定も
          // 元に戻す（残っていてもスクロール自体は妨げないが、念のため）。
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }

        function endResizerDrag() {
          if (!resizerDragActive) return;
          resizerDragActive = false;
          // Decap側（react-split-pane）自身の状態更新・再レンダーと
          // 競合しないよう、直後とレイアウト確定後の2回に分けて実行する。
          setTimeout(restoreScrollAfterResize, 0);
          setTimeout(restoreScrollAfterResize, 150);
        }

        document.addEventListener('mouseup', endResizerDrag, true);
        document.addEventListener('touchend', endResizerDrag, true);
        document.addEventListener('touchcancel', endResizerDrag, true);
        // ドラッグ中にウィンドウ外へマウスが出て離された場合の保険。
        document.addEventListener(
          'mouseleave',
          function (e) {
            if (e.target === document.documentElement) endResizerDrag();
          },
          true
        );

        // ==================================================================
        // 7) 「プレビュー表示を切り替える」「スクロール同期を切り替える」
        //    ボタン（ViewControls）を、プレビューペイン右上のフローティング
        //    表示から、画面最上部のヘッダーバー内、非表示にした
        //    「プレビューのチェック」ボタンが元あった場所（アカウント
        //    アイコン側の区切り線のすぐ左＝ToolbarSubSectionLast付近）へ
        //    "見た目だけ" 寄せる。
        //
        //    【重要・過去の実装からの変更点】
        //    以前は targetWrapper.appendChild(viewControls) でDOM上
        //    物理的に付け替えていたが、この要素はDecap本体（React）が
        //    生成・管理するノードであり、物理的な再親付けは危険だと判明
        //    した：Reactは内部のFiberツリーで「元の親の子である」という
        //    参照を保持し続けるため、後で編集画面をアンマウントする際に
        //    その元の親に対して removeChild しようとし、実際の親（我々が
        //    appendChildで差し替えた側）と食い違って
        //    `NotFoundError: Failed to execute 'removeChild' on 'Node'...`
        //    が発生し得る。これが起きるとReactのアンマウント処理自体が
        //    失敗し、「公開して新規作成」（エディタ全体を一旦アンマウント
        //    してから真っさらな新規フォームを再マウントする、大きな
        //    作り直しを伴う操作）が画面遷移しないまま直前の編集画面に
        //    留まってしまう不具合の原因になっていた（「公開して複製する」
        //    は既存フォームを流用する軽い更新のため同じ経路を通らず、
        //    症状が出にくかったと考えられる）。
        //    そのため、DOM上の親子関係には一切手を加えず、CSSの
        //    position:fixed（`.cms-view-controls-pinned`。<style>参照）＋
        //    ToolbarSubSectionLast の getBoundingClientRect() から算出した
        //    座標を直接指定することで、見た目だけをヘッダー内にあるように
        //    再現する。ToolbarContainer は常にビューポート上部に固定表示
        //    されるため、mutation・タイマーで再計算しても問題ない。
        // ==================================================================
        var lastViewControlsNode = null;
        function relocateViewControls() {
          var viewControls = document.querySelector('[class*="ViewControls"]');
          if (!viewControls) {
            lastViewControlsNode = null;
            return;
          }
          if (viewControls !== lastViewControlsNode) {
            // エントリ編集画面を開き直す・別のエントリへ移動する等で
            // ボタンが新しく生成された場合は、既定のON（アイコン青）へ戻す。
            lastViewControlsNode = viewControls;
            scrollSyncEnabled = true;
            lastSyncedScrollTop = null;
            applyScrollSyncIcon();
          }
          var targetWrapper = document.querySelector('[class*="ToolbarSubSectionLast"]');
          if (!targetWrapper) {
            viewControls.classList.remove('cms-view-controls-pinned');
            viewControls.style.top = '';
            viewControls.style.left = '';
            return;
          }
          var rect = targetWrapper.getBoundingClientRect();
          if (rect.width === 0 && rect.height === 0) return; // 非表示中は計算しない
          viewControls.classList.add('cms-view-controls-pinned');
          // ToolbarSubSectionLast の右端に沿わせ、縦方向は中央に揃える
          // （appendChildで最後の子として並んでいた頃の見た目に近づける）。
          var controlsRect = viewControls.getBoundingClientRect();
          viewControls.style.left = Math.max(0, rect.right - controlsRect.width) + 'px';
          viewControls.style.top = rect.top + (rect.height - controlsRect.height) / 2 + 'px';
        }

        var viewControlsObserver = new MutationObserver(function () {
          relocateViewControls();
        });
        viewControlsObserver.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('resize', relocateViewControls);
        relocateViewControls();

        // ==================================================================
        // 8) スクロール同期（Scroll Sync）機能の実装。
        //    Decap本体のスクロール同期機能は、独自のプレビューテンプレート
        //    （このファイルとpreview.jsで定義しているHTML構造）を想定した
        //    仕組みではないため、ボタン自体の見た目（アイコンの色）は
        //    切り替わるものの、実際にプレビュー側は追従しないことを確認
        //    済み。そのため、フォーム側の状態に応じてプレビュー側
        //    （iframe内）を独自に追従スクロールさせる処理をここで実装する。
        //
        //    ・ON/OFFの状態表示：このボタンはDecap本体の描画により、
        //      「初期表示＝アイコンが青くハイライト」「1回目クリック後＝
        //      グレー」という既定の見た目になる（実測で確認済み）。
        //      つまり「青＝ON（既定値）」がDecap自身の見た目上の初期状態
        //      であるため、自前で管理するON/OFFフラグの初期値も
        //      trueにして、この見た目と一致させる。
        //    ・同期の精度：単純なスクロール量の割合（％）による同期では、
        //      フォーム側とプレビュー側でセクションごとの縦の分量が
        //      大きく異なる（画像1枚だけのセクションと、長文＋リストが
        //      並ぶセクション等）ため、同じ割合でも対応するセクションが
        //      ずれてしまう。そのため、「現在フォーム側で表示されている
        //      のはどの大項目（セクション）か」をラベル文言から特定し、
        //      プレビュー側の同じid（<section id="services">等、
        //      preview.js側で各セクションに付与済み）の要素へ直接
        //      スクロールする、セクション単位のピンポイント同期に変更する。
        // ==================================================================
        var scrollSyncEnabled = true;

        // ボタンの見た目（アイコンの色）をDecap本体の内部状態に頼らず、
        // 自前のscrollSyncEnabledの値から直接・確実に描画する。
        // Decap本体が独自に付け替えるCSSクラス（ビルドごとにハッシュ値が
        // 変わり、どちらが「ON」の配色かを外部から安定して読み取れない）
        // に依存すると、Decap側の描画タイミングや内部実装の変化により
        // 「青＝ON」の対応関係がずれるおそれがある。そのため、青／グレーの
        // 配色そのものをこちらで責任を持って適用し、見た目と実際の同期
        // 挙動が常に一致するようにする。
        var SCROLL_SYNC_COLOR_ON = '#3a69c7';
        var SCROLL_SYNC_COLOR_OFF = '#798291';

        function findScrollSyncToggleButton() {
          var toggles = document.querySelectorAll('[class*="EditorToggle"]');
          for (var i = 0; i < toggles.length; i++) {
            if (toggles[i].title === 'スクロール同期を切り替える') return toggles[i];
          }
          return null;
        }

        function applyScrollSyncIcon() {
          var toggle = findScrollSyncToggleButton();
          if (!toggle) return;
          var path = toggle.querySelector('svg path');
          if (!path) return;
          path.style.fill = scrollSyncEnabled ? SCROLL_SYNC_COLOR_ON : SCROLL_SYNC_COLOR_OFF;
        }

        function getPreviewDocument() {
          var iframe = document.querySelector('.Pane2 iframe') || document.querySelector('[class*="PreviewPaneContainer"] iframe');
          return iframe && iframe.contentDocument ? iframe.contentDocument : null;
        }

        // フォーム側で現在最も上（＝編集中）に表示されている大項目の
        // ラベル文言から、対応するセクションキー（GROUP_LABELSの逆引き）
        // を特定する。ラベルはDOM順＝表示順のため、フォーム側コンテナの
        // 表示領域の先頭よりわずかに下（見出し行が隠れきる手前）にある
        // 最後のラベルを「現在表示中の項目」とみなす（スクロールスパイ）。
        function findActiveSectionKey() {
          var root = getFormRoot();
          var controlPane = document.querySelector('[class*="ControlPaneContainer"]');
          if (!root || !controlPane) return null;
          var labels = topLevelFieldLabels(root);
          if (!labels.length) return null;
          var threshold = controlPane.getBoundingClientRect().top + 48;
          var activeLabel = labels[0];
          for (var i = 0; i < labels.length; i++) {
            if (labels[i].getBoundingClientRect().top <= threshold) {
              activeLabel = labels[i];
            } else {
              break;
            }
          }
          var text = stripOptionalSuffix(activeLabel.textContent).trim();
          for (var key in GROUP_LABELS) {
            if (GROUP_LABELS[key] === text) return key;
          }
          return null;
        }

        // すべてのコレクション（サイト全体設定／商品一覧／下層ページ／
        // お知らせ）で共通のプレビュー追従スクロール。
        //  (A) サイト全体設定 … フォームの大項目ラベルとプレビューの
        //      <section id="..."> が1対1に対応するため、編集中セクションの
        //      見出し位置へスナップする（従来どおりの精度重視の同期）。
        //  (B) それ以外（プレビューが1枚の連続ページ）… 対応する section id が
        //      無いので、フォーム側のスクロール進捗率をプレビュー側へ比例
        //      適用して追従させる（編集位置に応じてプレビューも同じ割合の
        //      位置まで移動する）。
        function syncPreviewScroll() {
          if (!scrollSyncEnabled) return;
          var previewDoc = getPreviewDocument();
          if (!previewDoc) return;
          var controlPane = document.querySelector('[class*="ControlPaneContainer"]');
          if (!controlPane) return;
          var scrollEl = previewDoc.scrollingElement || previewDoc.documentElement;
          if (!scrollEl) return;

          // (A) セクション単位のピンポイント同期
          var key = findActiveSectionKey();
          if (key) {
            var target = previewDoc.getElementById(key);
            if (target) {
              var headerEl = previewDoc.querySelector('header');
              var headerHeight = headerEl ? headerEl.getBoundingClientRect().height : 0;
              // section要素自体ではなく内側の子要素（見出しブロック）を基準に
              // することで、見出しがヘッダー直下に収まる位置を正確に計算できる。
              var contentEl = target.firstElementChild || target;
              var targetTop = contentEl.getBoundingClientRect().top + scrollEl.scrollTop;
              scrollEl.scrollTop = Math.max(0, targetTop - headerHeight - 12);
              return;
            }
          }

          // (B) スクロール進捗率による比例同期
          var formMax = controlPane.scrollHeight - controlPane.clientHeight;
          var viewportH = previewDoc.documentElement ? previewDoc.documentElement.clientHeight : 0;
          var previewMax = scrollEl.scrollHeight - viewportH;
          if (formMax <= 0 || previewMax <= 0) return;
          var ratio = controlPane.scrollTop / formMax;
          if (ratio < 0) ratio = 0;
          if (ratio > 1) ratio = 1;
          scrollEl.scrollTop = Math.round(ratio * previewMax);
        }

        document.addEventListener(
          'click',
          function (e) {
            var toggle = e.target && e.target.closest && e.target.closest('[class*="EditorToggle"]');
            if (!toggle || toggle.title !== 'スクロール同期を切り替える') return;
            scrollSyncEnabled = !scrollSyncEnabled;
            applyScrollSyncIcon();
            if (scrollSyncEnabled) {
              // OFFだった間の基準値を引き継がないよう、ONに戻した直後は
              // 必ず一度だけ同期を実行する。
              lastSyncedScrollTop = null;
              syncPreviewScroll();
            }
          },
          true
        );

        // フォーム側コンテナのscrollイベントはバブリングしないため、
        // キャプチャ段階でdocumentに登録して検知する。
        //
        // 以前はここに加えて「入力欄にフォーカスした瞬間にも同期をかけ
        // 直す」focusinリスナーを設けていたが、これが以下の不具合の
        // 原因になっていた：
        //  ・入力欄をクリックすると、ブラウザが「フォーカスした要素を
        //    表示領域内に収めるための自動スクロール」をわずかに行う
        //    ことがある（ちょうど画面端に近い項目ほど起きやすい）。
        //  ・この“わずかな”scrollイベントとfocusinの両方が
        //    syncPreviewScroll()を呼び、プレビュー側をセクション見出し
        //    位置まで強制的に巻き戻してしまっていた。
        //  ・その結果、プレビュー側で手動スクロールして下部の項目
        //    （例：ステップ5）を見えるようにしていても、フォーム側で
        //    文字入力を始めた途端に見出し位置へリセットされ、その項目が
        //    再び見切れてしまっていた。
        // フォーカスやカーソル移動・文字入力そのものは「セクションを
        // 移動する意図」ではないため、focusinでの同期は完全に廃止する。
        // さらにscrollイベント側にも、移動量が一定以上（＝明確な
        // スクロール操作）の場合のみ同期する閾値を設け、フォーカス時の
        // 数px程度の自動スクロールでは反応しないようにする。
        var lastSyncedScrollTop = null;
        var SCROLL_SYNC_THRESHOLD = 80;

        document.addEventListener(
          'scroll',
          function (e) {
            if (!scrollSyncEnabled) return;
            var controlPane = document.querySelector('[class*="ControlPaneContainer"]');
            if (e.target !== controlPane) return;
            if (lastSyncedScrollTop !== null && Math.abs(controlPane.scrollTop - lastSyncedScrollTop) < SCROLL_SYNC_THRESHOLD) {
              return;
            }
            lastSyncedScrollTop = controlPane.scrollTop;
            syncPreviewScroll();
          },
          true
        );

        window.addEventListener('load', function () {
          updateNavButtonVisibility();
          setInterval(function () {
            updateNavButtonVisibility();
            syncSectionLabels();
            markRequiredFieldLabels();
            relocateViewControls();
            // Decapが自身の状態変化等でボタンのSVGを再描画し、こちらの
            // 見た目上書き（fill）が失われることがあるため、常にこちらの
            // scrollSyncEnabledの値と一致した色に維持し続ける。
            applyScrollSyncIcon();
          }, 500);
        });

        // ==================================================================
        // 9) 「公開して新規作成」実行後にフォームが空欄へリセットされない
        //    不具合の補正。
        //
        //    調査の結果（ローカルバックエンドで実機検証済み）：
        //    ・「公開して新規作成」を押すと git への保存自体は正しく行われる
        //      （persistEntry・postSaveイベントは正常に発火する）。
        //    ・しかし、既存エントリの編集画面（#/collections/<name>/entries/
        //      <slug>）から実行した場合、Decap側は保存後に
        //      `#/collections/<name>/new` へのルート遷移を行わない
        //      （ハッシュが変化しないまま同じ編集画面に留まる）ことを
        //      複数回の実機検証で確認した。既に `/new` 画面にいる状態から
        //      実行した場合はハッシュの見た目上の変化こそないが、その場合も
        //      Reduxの内部状態はリセットされず直前の入力値が残り続ける。
        //      （「公開して複製する」は同じ経路でも正しく `/new` へ遷移し、
        //      複製元の内容がプリセットされる＝これは仕様どおりの正しい
        //      動作なので対象外とする。）
        //    ・`/new` へブラウザの通常のページ読み込み（リロード）で
        //      直接アクセスすると、Reduxが初期状態から組み立てられるため
        //      必ず空欄になることを確認済み。
        //    → Decap側の「新規作成」アクションが期待通りに遷移・リセットを
        //      行わないため、保存完了（postSaveイベント）を検知した時点で
        //      このスクリプト側から確実に `#/collections/<name>/new` へ
        //      ページの再読み込みを行うことで補正する。
        //
        //    メニュー項目のクリックだけでは保存完了のタイミングが分からず、
        //    postSaveイベントだけでは「どのボタンで保存されたか」が
        //    分からないため、両方を組み合わせる：クリック時にコレクション名を
        //    ハッシュから読み取って控えておき、postSave発火時にそのコレクション
        //    の `/new` へ強制的に遷移し直す。
        // ==================================================================
        var pendingCreateNewCollection = null;
        document.addEventListener(
          'click',
          function (e) {
            var node = e.target;
            var text = '';
            for (var i = 0; i < 6 && node; i++) {
              text = (node.textContent || '').trim();
              if (text) break;
              node = node.parentElement;
            }
            if (!/^公開して新規作成/.test(text)) return;
            var m = location.hash.match(/^#\/collections\/([^/]+)/);
            pendingCreateNewCollection = m ? m[1] : null;
          },
          true
        );
        // ==================================================================
        // 10) 画面を移動せず連続して「公開する」を実行すると、2回目以降
        //     ボタンが不活性のまま復帰しない不具合の補正。
        //
        //     Decap CMS（旧Netlify CMS）には、boolean／selectウィジェットを
        //     含むエントリで「値を変更→公開→続けて値を変更」すると、
        //     公開ボタンの活性判定（内部の差分検知）が壊れたままになる
        //     既知の不具合報告がある（decaporg/decap-cms#6202）。
        //     ローカル環境（local_backend、文字列／真偽値／選択肢の各
        //     ウィジェットで複数パターン）では再現しなかったが、実運用
        //     （GitHub連携・ネットワーク遅延あり）では発生しうるとして
        //     報告されたため、発生条件を問わず確実に解消できるよう、
        //     上の「公開して新規作成」と同じ考え方・同じ手法（postSave
        //     検知＋location.reload()でReduxの内部状態を必ずクリーンな
        //     状態から組み立て直す）を、通常の「公開する」実行後にも
        //     適用する。
        //
        //     安全性：postSaveが発火する時点で直前の変更はすべて
        //     git（ローカルでは decap-server）へ保存済みであり、
        //     未保存の入力は存在しない。そのためリロードしても
        //     入力中のデータを失うことはない（＝「保存が終わった
        //     瞬間」だけを狙ってリロードするのがポイントで、その後の
        //     新しい入力を検知してからリロードする設計にはしていない。
        //     後者だと、検知後にリロードするまでの間に入力された
        //     未保存の変更を巻き込んで消してしまう恐れがあるため）。
        //     スクロール位置だけはリロードで失われると体験を損なうため、
        //     リロード直前に編集フォームのスクロール位置を
        //     sessionStorage へ退避し、再読み込み後に復元する
        //     （フォームのスクロールコンテナ特定は9.7章のscroll-sync系と
        //     同じ findScrollContainer() を再利用する）。
        // ==================================================================
        function saveScrollPositionForReload() {
          try {
            var container = findScrollContainer();
            if (container) {
              sessionStorage.setItem('cms-publish-reload-scroll', String(container.scrollTop));
            }
          } catch (e) {
            // sessionStorageが使えない環境（プライベートブラウズ等）では
            // スクロール位置の復元だけ諦め、リロード自体は続行する。
          }
        }

        function restoreScrollPositionAfterReload() {
          var saved;
          try {
            saved = sessionStorage.getItem('cms-publish-reload-scroll');
            if (saved !== null) sessionStorage.removeItem('cms-publish-reload-scroll');
          } catch (e) {
            return;
          }
          if (saved === null || saved === undefined) return;
          var target = parseFloat(saved);
          if (!isFinite(target) || target <= 0) return;
          var attempts = 0;
          var timer = setInterval(function () {
            attempts++;
            var container = findScrollContainer();
            // エントリ本体（フォーム）が実際にマウントされ、スクロール
            // 可能になるまで待ってから復元する。20回（約4秒）試みても
            // 復元できなければ諦める（別エントリへ直接アクセスした場合等）。
            if (container && container.scrollHeight - container.clientHeight > 4) {
              container.scrollTop = target;
              clearInterval(timer);
            } else if (attempts > 20) {
              clearInterval(timer);
            }
          }, 200);
        }

        window.CMS.registerEventListener({
          name: 'postSave',
          handler: function () {
            if (pendingCreateNewCollection) {
              var collectionName = pendingCreateNewCollection;
              pendingCreateNewCollection = null;
              // postSave発火の直後はDecap自身の後続処理（トースト表示等）が
              // まだ進行中のため、わずかに待ってから遷移・リロードする。
              setTimeout(function () {
                location.hash = '#/collections/' + collectionName + '/new';
                location.reload();
              }, 300);
              return;
            }
            // 通常の「公開する」実行後（＝新規作成への遷移を伴わない場合）。
            saveScrollPositionForReload();
            setTimeout(function () {
              location.reload();
            }, 300);
          },
        });
        window.addEventListener('load', restoreScrollPositionAfterReload);
      })();
    </script>
  </body>
</html>
