        //     sessionStorage へ退避し、再読み込み後に復元する
        //     （フォームのスクロールコンテナ特定は9.7章のscroll-sync系と
        //     同じ findScrollContainer() を再利用する）。
        // ==================================================================
        function saveScrollPositionForReload() {
          try {
            var container = findScrollContainer();
            if (container) {
              sessionStorage.setItem('cms-publish-reload-scroll', String(container.scrollTop));
            }
          } catch (e) {
            // sessionStorageが使えない環境（プライベートブラウズ等）では
            // スクロール位置の復元だけ諦め、リロード自体は続行する。
          }
        }

        function restoreScrollPositionAfterReload() {
          var saved;
          try {
            saved = sessionStorage.getItem('cms-publish-reload-scroll');
            if (saved !== null) sessionStorage.removeItem('cms-publish-reload-scroll');
          } catch (e) {
            return;
          }
          if (saved === null || saved === undefined) return;
          var target = parseFloat(saved);
          if (!isFinite(target) || target <= 0) return;
          var attempts = 0;
          var timer = setInterval(function () {
            attempts++;
            var container = findScrollContainer();
            // エントリ本体（フォーム）が実際にマウントされ、スクロール
            // 可能になるまで待ってから復元する。20回（約4秒）試みても
            // 復元できなければ諦める（別エントリへ直接アクセスした場合等）。
            if (container && container.scrollHeight - container.clientHeight > 4) {
              container.scrollTop = target;
              clearInterval(timer);
            } else if (attempts > 20) {
              clearInterval(timer);
            }
          }, 200);
        }

        window.CMS.registerEventListener({
          name: 'postSave',
          handler: function () {
            if (pendingCreateNewCollection) {
              var collectionName = pendingCreateNewCollection;
              pendingCreateNewCollection = null;
              // postSave発火の直後はDecap自身の後続処理（トースト表示等）が
              // まだ進行中のため、わずかに待ってから遷移・リロードする。
              setTimeout(function () {
                location.hash = '#/collections/' + collectionName + '/new';
                location.reload();
              }, 300);
              return;
            }
            // 画像メタデータ（メディア管理）の編集画面から「公開する」を
            // 実行した場合：保存後にこの画面へ留まり続けると、他ページへの
            // 導線が無いまま閉じ込められてしまう（9.40で報告された不具合）。
            // ジャンプ元の画面（sessionStorageに退避済み）へ戻り、かつ
            // ヘッダーの「メディア」ボタンを自動で再度開いて、実際に
            // メディアライブラリの一覧へ戻ったことが視覚的に分かるように
            // する（`pendingMediaMetaReturn`フラグをリロード後の`load`
            // イベントハンドラ側で検知し、ハッシュの書き換え＋モーダルの
            // 再オープンを行う。9.19で確立した「postSave発火時点では
            // 未保存の入力が存在しないため、いつでも安全にreloadできる」
            // 原則をそのまま踏襲）。
            if (/^#\/collections\/mediaLibrary\/entries\//.test(location.hash)) {
              try {
                sessionStorage.setItem('cms-media-meta-return-pending', '1');
              } catch (e) {}
              setTimeout(function () {
                location.reload();
              }, 300);
              return;
            }
            // 通常の「公開する」実行後（＝新規作成への遷移を伴わない場合）。
            saveScrollPositionForReload();
            setTimeout(function () {
              location.reload();
            }, 300);
          },
        });
        window.addEventListener('load', restoreScrollPositionAfterReload);
        window.addEventListener('load', function () {
          var pending;
          try {
            pending = sessionStorage.getItem('cms-media-meta-return-pending');
            sessionStorage.removeItem('cms-media-meta-return-pending');
          } catch (e) {
            pending = null;
          }
          if (!pending) return;
          var returnHash = popMediaMetaReturnHash() || '#/collections/mediaLibrary';
          location.hash = returnHash;
          // フォーム（メディアライブラリを開いていた側の画面）が再マウント
          // されるのを待ってから、ヘッダーの「メディア」ボタンを自動的に
          // クリックしてモーダルを開き直す。
          var attempts = 0;
          var timer = setInterval(function () {
            attempts++;
            if (openMediaLibraryButton() || attempts > 25) {
              clearInterval(timer);
            }
          }, 200);
        });

        // ==================================================================
        // 11) メディアライブラリへのドラッグ&ドロップアップロード対応。
        //
        //     decap-cms@3.16.2 本体バンドルを解析した結果、メディア
        //     ライブラリのモーダルには react-dropzone 等のドラッグ&
        //     ドロップアップロード機構が組み込まれておらず（"Dropzone"
        //     文字列自体がバンドル中に存在しない）、既定では「アップロード
        //     する」ボタン経由の `<input type="file">` からの選択のみが
        //     アップロード手段であることを確認した。
        //
        //     実装方針：ドロップされたファイルをこちらで直接GitHubへ
        //     アップロードする（＝Decap本体の保存処理を再実装する）のは
        //     リスクが高いため行わない。代わりに、モーダル内の既存の
        //     `<input type="file">`（"アップロードする"ボタンの実体）に
        //     対して、ドロップされたファイル群を `DataTransfer` 経由で
        //     セットし、`change` イベントを発火させることで、Decap自身の
        //     既存のアップロード処理をそのまま起動させる（安全性は
        //     ボタンをクリックして手動でファイルを選択した場合と完全に
        //     同一）。
        //
        //     対象の判定：開いているモーダル（`[class*="StyledModal"]`。
        //     ハッシュ化されたクラス名のため前方一致で判定する既存の
        //     `findScrollContainer()` 等と同じ方式）の中に
        //     `input[type="file"]` が存在する場合のみ、そのモーダルを
        //     ドロップ対象として扱う（メディアライブラリ以外のモーダルを
        //     誤って対象にしないためのガード）。
        // ==================================================================
        function findOpenMediaLibraryModal() {
          var modals = document.querySelectorAll('[class*="StyledModal"]');
          for (var i = 0; i < modals.length; i++) {
            if (modals[i].querySelector('input[type="file"]')) {
              // CSS側で `:has()`（大きなDOM上での再計算コストが高い）を
              // 使わずにこのモーダルだけへ幅調整を適用できるよう、
              // 目印のクラスを付与しておく（14章のCSS参照）。
              if (!modals[i].classList.contains('cms-is-media-library')) {
                modals[i].classList.add('cms-is-media-library');
              }
              return modals[i];
            }
          }
          return null;
        }

        var mediaDropHighlightClass = 'cms-media-drop-active';

        document.addEventListener('dragover', function (e) {
          if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') === -1) return;
          var modal = findOpenMediaLibraryModal();
          if (!modal) return;
          e.preventDefault();
          modal.classList.add(mediaDropHighlightClass);
        });

        document.addEventListener('dragleave', function (e) {
          var modal = findOpenMediaLibraryModal();
          if (modal && e.target === modal) modal.classList.remove(mediaDropHighlightClass);
        });

        document.addEventListener('drop', function (e) {
          if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
          var modal = findOpenMediaLibraryModal();
          if (!modal) return;
          e.preventDefault();
          modal.classList.remove(mediaDropHighlightClass);
          var input = modal.querySelector('input[type="file"]');
          if (!input) return;
          try {
            var dt = new DataTransfer();
            Array.prototype.forEach.call(e.dataTransfer.files, function (file) {
              dt.items.add(file);
            });
            input.files = dt.files;
            input.dispatchEvent(new Event('change', { bubbles: true }));
          } catch (err) {
            // DataTransfer未対応の古いブラウザ等では、ドラッグ&ドロップは
            // 諦め、従来どおり「アップロードする」ボタンでの選択を促す
            // （例外を投げず静かにフォールバックする）。
          }
        });

        // アップロード直後にカテゴリ・タイトル・Altの登録を案内する
        // トースト。Decap本体のアップロード処理自体（GitHubへの実際の
        // コミット）にフックできる公開APIが無いため「アップロードが
        // 完了したこと」を正確には検知できないが、`input[type="file"]`
        // の`change`イベント（ボタン経由の手動選択・上記ドラッグ&
        // ドロップの両方で発火）を「アップロードを開始したタイミング」
        // の代理指標として使い、案内を表示する（多少タイミングが早くても
        // 実害は無い簡易な通知のため、この近似で十分と判断した）。
        // ⚠️ このトーストを`modal`の子要素として追加すると、実機検証で
        // 「アップロード完了に伴うメディア一覧の再描画で、Decap側が
        // モーダルの子要素ツリーを丸ごと作り直し、こちらが追加した
        // 要素だけが一瞬で消えてしまう」ことを確認した（モーダル要素
        // 自身は再利用される＝付与した目印クラスは残るが、中身は
        // Reactの再レンダーで置き換わる）。そのため`document.body`
        // 直下（React管理下の外）に配置し、`position: fixed`で
        // モーダルの実測位置に重ねて表示することで、この消失を回避する。
        function showUploadMetadataToast(modal) {
          if (document.querySelector('.cms-media-upload-toast')) return;
          var toast = document.createElement('div');
          toast.className = 'cms-media-upload-toast';
          var text = document.createElement('span');
          text.textContent = 'アップロードした画像のAlt属性・キャプションを設定しますか？';
          toast.appendChild(text);
          var actionBtn = document.createElement('button');
          actionBtn.type = 'button';
          actionBtn.className = 'cms-media-upload-toast-action';
          actionBtn.textContent = '今すぐ設定する →';
          actionBtn.addEventListener('click', function () {
            toast.remove();
            jumpToMediaLibraryEntry(null);
          });
          toast.appendChild(actionBtn);
          var closeBtn = document.createElement('button');
          closeBtn.type = 'button';
          closeBtn.className = 'cms-media-upload-toast-close';
          closeBtn.textContent = '×';
          closeBtn.setAttribute('aria-label', '閉じる');
          closeBtn.addEventListener('click', function () {
            toast.remove();
          });
          toast.appendChild(closeBtn);
          var rect = modal.getBoundingClientRect();
          toast.style.position = 'fixed';
          toast.style.left = rect.left + 24 + 'px';
          toast.style.right = window.innerWidth - rect.right + 24 + 'px';
          toast.style.bottom = window.innerHeight - rect.bottom + 16 + 'px';
          document.body.appendChild(toast);
          setTimeout(function () {
            if (toast.parentElement) toast.remove();
          }, 10000);
        }

        function wireUploadInputOnce(modal) {
          var input = modal.querySelector('input[type="file"]');
          if (!input || input.dataset.cmsUploadHintWired) return;
          input.dataset.cmsUploadHintWired = '1';
          input.addEventListener('change', function () {
            showUploadMetadataToast(modal);
          });
        }

        // ==================================================================
        // 12) メディアライブラリの✎ボタン：Alt属性・キャプション編集への
        //     ショートカット（9.39でカテゴリ機能を全廃し、この用途に集中）。
        //
        //     画像ごとのAlt属性・キャプションはこれまで「メディア管理」
        //     という独立したコレクションで管理していたが、9.39で
        //     サイドバー上の独立項目としての見た目を廃止し、ヘッダーの
        //     「メディア」ボタン1つに導線を一本化した。実体（コレクション
        //     自体）はconfig.yml上に存続させている——Decap自身の安全な
        //     保存機構（本物のフォーム＋本物の「公開する」ボタン）を
        //     使う唯一の方法が、コレクションのエントリとして保存する
        //     ことだから（9.26-Bで確立した「Reduxへの書き込みdispatch
        //     は一切行わない」という安全原則は今回も維持している）。
        // ==================================================================
        function findCardAncestor(el) {
          var node = el.parentElement;
          while (node && node.classList) {
            for (var i = 0; i < node.classList.length; i++) {
              if (/-Card$/.test(node.classList[i])) return node;
            }
            node = node.parentElement;
          }
          return null;
        }

        // メディアライブラリを開くたびに、Alt属性・キャプションの
        // 設定場所を案内する常設バナーを1行追加する。
        function ensureMediaLibraryHint(modal, searchContainer) {
          if (modal.querySelector('.cms-media-library-hint')) return;
          var hint = document.createElement('div');
          hint.className = 'cms-media-library-hint';
          hint.textContent = '画像のAlt属性・キャプションは、各カード右上の✎ボタンから設定できます。';
          searchContainer.parentElement.parentElement.insertBefore(hint, searchContainer.parentElement.nextSibling);
        }

        // 「編集」ショートカット：カードの✎ボタンから、画像メタデータの
        // 該当行へ直接ジャンプする。
        //
        // 実際に保存を成立させるにはDecap本体の非公開の内部処理
        // （persistEntry相当のReduxストアへのdispatch）を呼び出す必要が
        // あり、これは9.26-Bで確立した「Reduxストアは読み取り専用でのみ
        // 参照し、状態変更のdispatchは一切行わない」という安全原則に
        // 反する（公開APIの外側にある非公開の内部実装に書き込み処理を
        // 依存させることになり、decap-cms本体のバージョンアップで動作
        // しなくなった場合に、単に機能が止まるだけでなく保存内容が壊れる
        // 形で失敗するおそれがある）。そのため、実際の保存は必ずDecap
        // 本体の正規の「公開する」ボタンを経由させることを維持しつつ、
        // (a) 遷移先の画面を9.39でポップオーバー風の見た目に再構成し、
        // (b) 目的の行を自動的に展開・スクロールすることで、体感として
        // 「メディアライブラリの上に浮かぶ編集パネル」に近い操作感を
        // 実現している：
        //   1. メディアライブラリのモーダルを閉じ、画像メタデータの
        //      エントリへ遷移する。
        //   2. Reduxストア（読み取り専用）から`items`配列を参照し、
        //      クリックした画像のファイル名と一致する既存項目があれば、
        //      そのインデックスに対応するリスト行（DOM上の並び順は
        //      Reduxの配列順と一致する）を自動的に展開し、画面中央へ
        //      スクロールする。
        //   3. 一致する項目が無い場合は「Add 画像一覧」ボタンを
        //      自動的にクリックして新規行を追加するところまで代行する
        //      （画像の選択自体は、既存の画像ピッカーUIをそのまま
        //      使うため、ユーザーの最後の一手だけ残す）。
        // ジャンプ元の画面（メディアライブラリの背後にあった元のハッシュ）を
        // 記録しておき、後で「メディア一覧へ戻る」操作（保存後の自動遷移・
        // ×ボタンでの手動キャンセル）の戻り先として使う。sessionStorageにも
        // 保存しておくことで、保存後の`location.reload()`（9章参照）を
        // 挟んでも戻り先を見失わない。
        var MEDIA_META_RETURN_KEY = 'cms-media-meta-return-hash';
        function saveMediaMetaReturnHash() {
          try {
            sessionStorage.setItem(MEDIA_META_RETURN_KEY, location.hash || '');
          } catch (e) {}
        }
        function popMediaMetaReturnHash() {
          try {
            var v = sessionStorage.getItem(MEDIA_META_RETURN_KEY);
            sessionStorage.removeItem(MEDIA_META_RETURN_KEY);
            return v || '';
          } catch (e) {
            return '';
          }
        }
        // ヘッダーの「メディア」ボタンをプログラム的にクリックし、既定の
        // メディアライブラリ（アセットピッカー）モーダルを開き直す。
        function openMediaLibraryButton() {
          try {
            var buttons = document.querySelectorAll('button');
            for (var i = 0; i < buttons.length; i++) {
              if ((buttons[i].textContent || '').trim() === 'メディア') {
                buttons[i].click();
                return true;
              }
            }
          } catch (e) {}
          return false;
        }

        function jumpToMediaLibraryEntry(filename) {
          try {
            saveMediaMetaReturnHash();
            var modal = findOpenMediaLibraryModal();
            if (modal) {
              var closeBtn = modal.querySelector('button[aria-label="Close"]');
              if (closeBtn) closeBtn.click();
            }
            location.hash = '#/collections/mediaLibrary/entries/mediaLibrary';
            var attempts = 0;
            var timer = setInterval(function () {
              attempts++;
              var itemsField = document.querySelector('[id^="items-field-"]');
              if (itemsField) {
                clearInterval(timer);
                focusMediaLibraryItem(itemsField, filename);
              } else if (attempts > 25) {
                clearInterval(timer);
              }
            }, 200);
          } catch (e) {}
        }

        function focusMediaLibraryItem(itemsField, filename) {
          try {
            var index = -1;
            var store = findDecapReduxStore();
            if (store && filename) {
              var state = store.getState();
              var entities = state && state.entries && state.entries.get && state.entries.get('entities');
              var entry = entities && entities.get('mediaLibrary.mediaLibrary');
              var data = entry && entry.get('data');
              var items = data && data.get('items');
              if (items && typeof items.toJS === 'function') {
                var arr = items.toJS();
                for (var i = 0; i < arr.length; i++) {
                  if (arr[i] && arr[i].image && String(arr[i].image).split('/').pop() === filename) {
                    index = i;
                    break;
                  }
                }
              }
            }
            var rows = itemsField.querySelectorAll('[class*="SortableListItem"]');
            if (index >= 0 && rows[index]) {
              var toggle = rows[index].querySelector('[class*="TopBarButton"]');
              if (toggle) toggle.click();
              rows[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
              return;
            }
            // 一致する項目が無い＝この画像はまだ画像メタデータに
            // 未登録。新規行の追加まで代行する（画像選択は手動）。
            var addButtons = document.querySelectorAll('button');
            for (var j = 0; j < addButtons.length; j++) {
              if ((addButtons[j].textContent || '').indexOf('Add 画像一覧') !== -1) {
                addButtons[j].click();
                addButtons[j].scrollIntoView({ behavior: 'smooth', block: 'center' });
                break;
              }
            }
          } catch (e) {}
        }

        // カードに、上記ショートカットを起動する✎ボタンを重ねて表示する。
        function addEditShortcutButton(card, filename) {
          if (!card || card.querySelector('.cms-media-edit-shortcut')) return;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cms-media-edit-shortcut';
          btn.title = 'Alt属性・キャプションを編集';
          btn.textContent = '✎';
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            e.preventDefault();
            jumpToMediaLibraryEntry(filename);
          });
          var style = getComputedStyle(card);
          if (style.position === 'static') card.style.position = 'relative';
          card.appendChild(btn);
        }

        function addEditShortcutsToGrid(modal) {
          var textEls = modal.querySelectorAll('[class*="CardText"]');
          textEls.forEach(function (textEl) {
            var card = findCardAncestor(textEl);
            if (!card) return;
            addEditShortcutButton(card, (textEl.textContent || '').trim());
          });
        }

        function ensureMediaLibraryExtras() {
          try {
            var modal = findOpenMediaLibraryModal();
            if (!modal) return;
            var searchContainer = modal.querySelector('[class*="SearchContainer"]');
            if (!searchContainer) return;
            ensureMediaLibraryHint(modal, searchContainer);
            addEditShortcutsToGrid(modal);
            wireUploadInputOnce(modal);
          } catch (e) {}
        }

        var mediaLibraryExtrasObserver = new MutationObserver(ensureMediaLibraryExtras);
        mediaLibraryExtrasObserver.observe(document.body, { childList: true, subtree: true });

        // ==================================================================
        // 12b) 画像メタデータコレクションのサイドバー項目を非表示にし、
        //      ヘッダーの「メディア」ボタン1つに導線を一本化する（9.39）。
        //      コレクション自体はconfig.yml上に存続させている（12章の
        //      コメント参照）が、サイドバーからは見えなくする。
        // ==================================================================
        function hideMediaLibrarySidebarLink() {
          try {
            var link = document.querySelector('a[href="#/collections/mediaLibrary"]');
            if (!link) return;
            var li = link.closest('li');
            (li || link).style.display = 'none';
          } catch (e) {}
        }
        var mediaLibrarySidebarObserver = new MutationObserver(hideMediaLibrarySidebarLink);
        mediaLibrarySidebarObserver.observe(document.body, { childList: true, subtree: true });
        hideMediaLibrarySidebarLink();

        // ==================================================================
        // 12c) 画像メタデータのエントリ編集画面を、ポップオーバー風の
        //      見た目に再構成する（9.39）。
        //
        //      実際にはDecapの通常のエントリ編集画面（フォーム・
        //      「公開する」ボタンはすべて本物）だが、✎ショートカットで
        //      ここに遷移した際に「別ページに飛ばされた」という体感を
        //      与えないよう、この画面に限りCSSで中央フローティング
        //      カード＋背景を暗くするオーバーレイに再構成する。保存の
        //      仕組み自体は一切変更していない（＝本物のDecap保存フローが
        //      そのまま動く。安全性は1ミリも損なわれていない）。
        // ==================================================================
        function updateMediaMetaPopoverMode() {
          var isMediaMetaEntry = /^#\/collections\/mediaLibrary\/entries\//.test(location.hash);
          document.body.classList.toggle('cms-media-meta-popover', isMediaMetaEntry);
          if (isMediaMetaEntry) {
            ensureMediaMetaPopoverBackdrop();
            ensureMediaMetaPopoverCloseButton();
          } else {
            var backdrop = document.querySelector('.cms-media-popover-backdrop');
            if (backdrop) backdrop.remove();
            var closeBtn = document.querySelector('.cms-media-popover-close');
            if (closeBtn) closeBtn.remove();
          }
        }
        function ensureMediaMetaPopoverBackdrop() {
          if (document.querySelector('.cms-media-popover-backdrop')) return;
          var backdrop = document.createElement('div');
          backdrop.className = 'cms-media-popover-backdrop';
          document.body.appendChild(backdrop);
        }
        // 保存せずにこの画面から離れたい場合のための「×（閉じる）」ボタン。
        // ジャンプ元の画面（sessionStorageに退避済み。無ければメディア
        // ライブラリの一覧）へ戻り、続けてヘッダーの「メディア」ボタンを
        // 自動的に開き直す（9.40で報告された「閉じ込め」問題への対応）。
        // クリックしても保存処理は一切呼び出さない＝未保存の入力は
        // Decap自身の「保存されていません」警告の対象外にはならないが、
        // これは元々「公開する」ボタンを押さない限りDecapが持つ標準的な
        // 離脱確認の挙動であり、本ボタン固有の問題ではない。
        function ensureMediaMetaPopoverCloseButton() {
          if (document.querySelector('.cms-media-popover-close')) return;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cms-media-popover-close';
          btn.title = 'メディア一覧へ戻る（保存せずに閉じる）';
          btn.setAttribute('aria-label', 'メディア一覧へ戻る');
          btn.textContent = '×';
          btn.addEventListener('click', function () {
            var returnHash = popMediaMetaReturnHash() || '#/collections/mediaLibrary';
            location.hash = returnHash;
            var attempts = 0;
            var timer = setInterval(function () {
              attempts++;
              if (openMediaLibraryButton() || attempts > 25) {
                clearInterval(timer);
              }
            }, 200);
          });
          document.body.appendChild(btn);
        }
        window.addEventListener('hashchange', updateMediaMetaPopoverMode);
        updateMediaMetaPopoverMode();

        // ==================================================================
        // 12d) 画像メタデータ編集画面（ポップオーバー）に、選択中の画像を
        //      「新しいファイル名で複製保存」するミニUIを追加する（9.39）。
        //
        //      ファイル名そのものを安全に「改名」する方法は無い（Decapの
        //      画像ウィジェットは選択中のファイルパスを保持するだけで、
        //      実ファイルをリネームするAPIを持たない）。そこで「同じ内容を
        //      新しいファイル名でアップロードし、このエントリの画像欄を
        //      その新しいファイルに差し替える」という安全な代替手段を
        //      実装した。元のファイルは自動では削除しない——他のページ・
        //      エントリが元のファイル名をまだ参照している可能性があり、
        //      ここで機械的に削除すると、そちらの画像がサイト上でリンク
        //      切れになる重大なリスクがあるため。複製後、元のファイルが
        //      本当に不要になったことをユーザー自身が確認した上で、通常の
        //      メディアライブラリの「削除する」から手動で削除する運用と
        //      する（アップロード自体は9.32-Bで確立した「実際のファイル
        //      入力へDataTransfer経由でファイルを流し込みchangeイベントを
        //      発火させる」安全な手法をそのまま使い、選択もDecap本体の
        //      実際のクリック操作を模倣するだけで、保存・選択ロジック
        //      自体は一切独自実装していない）。
        // ==================================================================
        function ensureFilenameRenameUI() {
          try {
            if (!/^#\/collections\/mediaLibrary\/entries\//.test(location.hash)) return;
            var itemsField = document.querySelector('[id^="items-field-"]');
            if (!itemsField) return;
            var rows = itemsField.querySelectorAll('[class*="SortableListItem"]');
            rows.forEach(function (row) {
              if (row.querySelector('.cms-media-rename-ui')) return;
              var imgField = row.querySelector('[id^="image-field-"]');
              if (!imgField) return;
              var img = imgField.querySelector('img');
              if (!img || !img.src) return;
              var currentName = decodeURIComponent((img.src.split('/').pop() || '').split('?')[0]);
              if (!currentName) return;
              var wrap = document.createElement('div');
              wrap.className = 'cms-media-rename-ui';
              var label = document.createElement('div');
              label.className = 'cms-media-rename-label';
              label.textContent = '現在のファイル名：' + currentName;
              wrap.appendChild(label);
              var rowEl = document.createElement('div');
              rowEl.className = 'cms-media-rename-row';
              var input = document.createElement('input');
              input.type = 'text';
              input.placeholder = '新しいファイル名（拡張子込み。例：hero-2.jpg）';
              rowEl.appendChild(input);
              var btn = document.createElement('button');
              btn.type = 'button';
              btn.textContent = 'この名前で複製保存';
              btn.addEventListener('click', function () {
                renameMediaImage(imgField, input.value.trim(), btn);
              });
              rowEl.appendChild(btn);
              wrap.appendChild(rowEl);
              var note = document.createElement('div');
              note.className = 'cms-media-rename-note';
              note.textContent = '※元のファイルは自動削除されません（他ページでの参照を壊さないため）。不要になったら通常のメディアライブラリから手動で削除してください。';
              wrap.appendChild(note);
              imgField.parentElement.insertBefore(wrap, imgField.nextSibling);
            });
          } catch (e) {}
        }

        function renameMediaImage(imgField, newName, triggerBtn) {
          if (!newName) {
            alert('新しいファイル名を入力してください。');
            return;
          }
          if (!/^[\w.\-]+\.[A-Za-z0-9]+$/.test(newName)) {
            alert('半角英数字・._- と拡張子で入力してください（例：hero-2.jpg）。');
            return;
          }
          var img = imgField.querySelector('img');
          if (!img || !img.src) return;
          triggerBtn.disabled = true;
          triggerBtn.textContent = '処理中…';
          fetch(img.src)
            .then(function (res) {
              return res.blob();
            })
            .then(function (blob) {
              var file = new File([blob], newName, { type: blob.type });
              var buttons = imgField.querySelectorAll('button');
              var openBtn = null;
              buttons.forEach(function (b) {
                if (/画像を選択/.test(b.textContent || '')) openBtn = b;
              });
              if (!openBtn) throw new Error('picker button not found');
              openBtn.click();
              waitForMediaModalAndUpload(file, newName, function (ok) {
                triggerBtn.disabled = false;
                triggerBtn.textContent = ok ? '完了しました' : 'この名前で複製保存';
                if (ok) {
                  setTimeout(function () {
                    triggerBtn.textContent = 'この名前で複製保存';
                  }, 2000);
                }
              });
            })
            .catch(function () {
              triggerBtn.disabled = false;
              triggerBtn.textContent = 'この名前で複製保存';
              alert('画像の複製に失敗しました。お手数ですが手動でアップロードし直してください。');
            });
        }

        function waitForMediaModalAndUpload(file, filename, done) {
          var attempts = 0;
          var timer = setInterval(function () {
            attempts++;
            var modal = findOpenMediaLibraryModal();
            var input = modal && modal.querySelector('input[type="file"]');
            if (input) {
              clearInterval(timer);
              try {
                var dt = new DataTransfer();
                dt.items.add(file);
                input.files = dt.files;
                input.dispatchEvent(new Event('change', { bubbles: true }));
              } catch (e) {
                done(false);
                return;
              }
              waitForCardAndSelect(modal, filename, done);
            } else if (attempts > 25) {
              clearInterval(timer);
              done(false);
            }
          }, 200);
        }

        function waitForCardAndSelect(modal, filename, done) {
          var attempts = 0;
          var timer = setInterval(function () {
            attempts++;
            var textEls = modal.querySelectorAll('[class*="CardText"]');
            var target = null;
            textEls.forEach(function (t) {
              if ((t.textContent || '').trim() === filename) target = t;
            });
            if (target) {
              clearInterval(timer);
              var card = findCardAncestor(target);
              if (card) card.click();
              setTimeout(function () {
                var selectBtn = null;
                modal.querySelectorAll('button').forEach(function (b) {
                  if ((b.textContent || '').trim() === '選択する') selectBtn = b;
                });
                if (selectBtn) selectBtn.click();
                done(true);
              }, 300);
            } else if (attempts > 25) {
              clearInterval(timer);
              done(false);
            }
          }, 300);
        }

        var filenameRenameObserver = new MutationObserver(ensureFilenameRenameUI);
        filenameRenameObserver.observe(document.body, { childList: true, subtree: true });

        // ==================================================================
        // 13) 「サイト全体設定 ＞ 実績 ＞ 表示順序」リストの各行に、
        //     選択中の実績の「タイトル」を表示する。
        //
        //     config.yml の summary（"{{fields.item}}"）は、relation
        //     ウィジェットが保存するvalue_field（＝URL用識別子/slug）を
        //     そのまま表示するのが限界（Decap公式のmoustacheテンプレートは
        //     そのフィールド自身の値しか参照できず、他コレクションの
        //     エントリを検索して埋め込む機能を持たない）。ここでは
        //     9.26-Bと同じ「Reduxストアの読み取り専用参照」の手法で、
        //     `works.<slug>` エントリの`title`フィールドへ実際にアクセス
        //     できる場合はそちらへ表示を差し替える。
        //
        //     ただしReduxの`entities`は、そのコレクション（today's
        //     セッションで一度も開いていない実績エントリ）が未ロードの
        //     ままだと参照できない（9.26-B・9.32-Bと同じ制約）。その
        //     ためRedux参照が失敗した場合のみ、`works-titles.json`
        //     （src/pages/works-titles.json.ts、ビルド時に全実績の
        //     slug→titleを静的生成したもの）へフォールバックする
        //     （9.32-Bのメディアメタデータと同じ「本番公開済みデータの
        //     流用」パターン）。
        //
        //     置換前の生のslug文字列は`data-cms-order-slug`属性に
        //     保持しておく——一度置換した後に再度このパッチ関数が走った
        //     際、既にタイトルへ書き換え済みのtextContentを「slugだ」と
        //     誤認して再解決してしまうのを防ぐため。
        // ==================================================================
        var cmsWorksTitleCache = null;
        var cmsWorksTitleFetching = false;

        function getWorksTitleFromRedux(slug) {
          try {
            var store = findDecapReduxStore();
            if (!store) return null;
            var state = store.getState();
            var entities = state && state.entries && state.entries.get && state.entries.get('entities');
            if (!entities) return null;
            var entry = entities.get('works.' + slug);
            if (!entry) return null;
            var data = entry.get ? entry.get('data') : null;
            if (!data || typeof data.get !== 'function') return null;
            var title = data.get('title');
            return typeof title === 'string' && title.trim() ? title : null;
          } catch (e) {
            return null;
          }
        }

        function loadWorksTitleMapOnce(callback) {
          if (cmsWorksTitleCache) {
            callback(cmsWorksTitleCache);
            return;
          }
          if (cmsWorksTitleFetching) return;
          cmsWorksTitleFetching = true;
          fetch('/works-titles.json')
            .then(function (res) {
              return res.ok ? res.json() : {};
            })
            .then(function (json) {
              cmsWorksTitleCache = json || {};
              cmsWorksTitleFetching = false;
              callback(cmsWorksTitleCache);
            })
            .catch(function () {
              cmsWorksTitleCache = {};
              cmsWorksTitleFetching = false;
            });
        }

        function patchWorksOrderListLabels() {
          try {
            var orderFieldEl = document.querySelector('[id^="order-field-"]');
            if (!orderFieldEl || !orderFieldEl.closest('[id^="works-field-"]')) return;
            var labels = orderFieldEl.querySelectorAll('[class*="NestedObjectLabel"]');
            if (!labels.length) return;
            labels.forEach(function (labelEl) {
              var slug = labelEl.getAttribute('data-cms-order-slug');
              if (!slug) {
                slug = (labelEl.textContent || '').trim();
                if (!slug) return;
                labelEl.setAttribute('data-cms-order-slug', slug);
              }
              var reduxTitle = getWorksTitleFromRedux(slug);
              if (reduxTitle) {
                if (labelEl.textContent !== reduxTitle) labelEl.textContent = reduxTitle;
                return;
              }
              loadWorksTitleMapOnce(function (map) {
                var title = map[slug];
                if (title && labelEl.textContent === slug) {
                  labelEl.textContent = title;
                }
              });
            });
          } catch (e) {}
        }

        // ⚠️ MutationObserver（document.body全体監視）は使わない：実機検証で
        // 「サイト全体設定」エントリ画面自体が、常時バックグラウンドで
        // 秒間十数回程度のDOM変化（スクロール同期・クイックナビ等、他の
        // 既存機能が持つ定期処理由来）を起こしていることを確認しており、
        // ここで textContent を書き換える処理をdocument.body監視の
        // MutationObserverに直結すると、その書き換え自体が新たな
        // mutationとして観測されて再度ハンドラを呼び、さらに書き換えが
        // 起きる…という共鳴的なループに陥り、実機でタブが完全に応答
        // 不能になることを確認した（`patchFilesCollectionListLabels`
        // 9.26-Bが同じ手法でも問題ないのは、そちらは「下層ページ編集」
        // 一覧画面のような書き換え対象が見つからない場面が大半で、
        // 実際にDOM書き込みが起きないため共鳴が発生しないため。今回は
        // 「サイト全体設定」エントリ内での書き換えが常に発生するため
        // 事情が異なる）。そのため、mutationに反応する方式ではなく、
        // 一定間隔（1秒）でポーリングする方式に変更し、書き換えイベント
        // 自体が次の呼び出しの引き金にならないようにしている。
        patchWorksOrderListLabels();
        setInterval(patchWorksOrderListLabels, 1000);
        window.addEventListener('hashchange', patchWorksOrderListLabels);

        // ==================================================================
        // 19) 「実績・活用事例作成」コレクションの一覧画面を、実サイトの
        //     表示順（`Works.astro`と全く同じロジック）に連動させる。
        //
        //     Decap CMSの`sortable_fields`／既定ソートは、あくまで
        //     「そのコレクション自身が持つフィールド」でしか並び替え
        //     できない公開APIで、他のエントリ（`siteInfo.yml`の
        //     `works.order`のような、別コレクションが持つ手動
        //     キュレーションリスト）を参照して並び替える機能は
        //     存在しない（`works.order`をrelationウィジェットの
        //     `list`として実装しているのも、9.9で確立した「Decap側に
        //     こうした動的ソート機能が無いための代替策」だったことを
        //     踏まえると、一覧画面側だけを見た目上連動させる場合も
        //     同様にDecapの外側でJSにより実現するほかない）。
        //
        //     実装：一覧の`<ul>`はflexレイアウト
        //     （`display:flex`、実機確認済み）で`<li>`を横並びに
        //     並べているため、各`<li>`へCSSの`order`プロパティを
        //     設定するだけで、実際のDOM順序を変更せずに見た目の
        //     並び順だけを制御できる（`style.order`の変更は
        //     `attributes`ミューテーションであり、本ファイルの
        //     MutationObserverはいずれも`{childList, subtree}`のみを
        //     監視して`attributes`を監視していないため、9.33-Aで
        //     発見した「自分の書き換えが自分のObserverを再度呼び出す」
        //     共鳴ループの対象にもならない＝安全）。
        //     並び順の算出は9.26-Bと同じ「Reduxストアの読み取り専用
        //     参照」を使い、`Works.astro`の実際のソートロジック
        //     （表示順序リストを優先→そこに無い実績は`publishedAt`
        //     降順）をそのままJSに移植して再現する。
        //     実機検証で、一覧画面を開いた時点で`works`コレクションの
        //     全エントリ（サムネイル・タイトル表示のため）と
        //     `settings.siteInfo`（既定の起動画面のため）の両方が
        //     Reduxに読み込み済みであることを確認済みのため、静的JSON
        //     へのフォールバックは設けていない（万一どちらかが未読込の
        //     場合は、既定のDecap表示順のまま＝安全側に倒れる）。
        // ==================================================================
        // 「サイト全体設定」エントリがReduxに未ロードの場合（このセッションで
        // 一度も開いていない場合）に備えたフォールバック。works-titles.json
        // と同じ「ビルド時静的生成データをfetchする」パターン
        // （src/pages/works-order.json.ts）。Reduxから取得できた場合は
        // 常にそちらを優先し、取得できなかった場合のみこのキャッシュを使う。
        var cmsWorksOrderCache = null;
        var cmsWorksOrderFetching = false;

        function loadWorksOrderOnce(callback) {
          if (cmsWorksOrderCache) {
            callback(cmsWorksOrderCache);
            return;
          }
          if (cmsWorksOrderFetching) return;
          cmsWorksOrderFetching = true;
          fetch('/works-order.json')
            .then(function (res) {
              return res.ok ? res.json() : [];
            })
            .then(function (json) {
              cmsWorksOrderCache = Array.isArray(json) ? json : [];
              cmsWorksOrderFetching = false;
              callback(cmsWorksOrderCache);
              // 取得完了時点で既に一覧画面が開いていれば、フォールバック
              // データを反映した並び順で即座に再描画する。
              applyWorksListOrder();
            })
            .catch(function () {
              cmsWorksOrderCache = [];
              cmsWorksOrderFetching = false;
            });
        }

        // Reduxに「サイト全体設定」エントリがロード済みかどうかを判定する
        // （ロード自体は試みたが `order` が未入力で空配列、というケースと
        // 「そもそもエントリ自体が無い」ケースを区別するため）。
        function getSiteInfoEntryFromRedux() {
          try {
            var store = findDecapReduxStore();
            if (!store) return null;
            var state = store.getState();
            var entities = state && state.entries && state.entries.get && state.entries.get('entities');
            return (entities && entities.get('settings.siteInfo')) || null;
          } catch (e) {
            return null;
          }
        }

        function getSiteWorksOrderList() {
          try {
            var siteInfo = getSiteInfoEntryFromRedux();
            if (!siteInfo) {
              // Reduxに未ロード：静的JSONへのフォールバックを非同期で
              // 開始しつつ（結果は次回の再描画で反映される）、今回は
              // キャッシュ済みならそれを、無ければ空配列を返す。
              if (cmsWorksOrderCache) return cmsWorksOrderCache;
              loadWorksOrderOnce(function () {});
              return [];
            }
            var data = siteInfo.get('data');
            var works = data && data.get('works');
            var order = works && works.get('order');
            if (!order || typeof order.toJS !== 'function') return [];
            return order.toJS().filter(function (s) {
              return s && String(s).trim();
            });
          } catch (e) {
            return [];
          }
        }

        function computeWorksDisplayOrder() {
          try {
            var store = findDecapReduxStore();
            if (!store) return null;
            var state = store.getState();
            var entities = state && state.entries && state.entries.get && state.entries.get('entities');
            if (!entities) return null;
            var orderList = getSiteWorksOrderList();
            var allSlugs = [];
            entities.keySeq().toJS().forEach(function (k) {
              if (k.indexOf('works.') === 0) allSlugs.push(k.slice('works.'.length));
            });
            if (!allSlugs.length) return null;
            var seen = {};
            var ordered = [];
            orderList.forEach(function (slug) {
              if (allSlugs.indexOf(slug) !== -1 && !seen[slug]) {
                ordered.push(slug);
                seen[slug] = true;
              }
            });
            var remaining = allSlugs.filter(function (s) {
              return !seen[s];
            });
            // 個別記事側の数値「表示順」フィールドは9.38で廃止した
            // ため、Works.astroと同じく公開日の新しい順のみで並べる。
            remaining.sort(function (a, b) {
              var da = entities.get('works.' + a).get('data');
              var db = entities.get('works.' + b).get('data');
              var pa = da.get('publishedAt') ? new Date(da.get('publishedAt')).getTime() : 0;
              var pb = db.get('publishedAt') ? new Date(db.get('publishedAt')).getTime() : 0;
              return pb - pa;
            });
            return ordered.concat(remaining);
          } catch (e) {
            return null;
          }
        }

        function applyWorksListOrder() {
          try {
            if (!/^#\/collections\/works(\?|$)/.test(location.hash)) return;
            var list = document.querySelector('main ul[class*="CardsGrid"]');
            if (!list) return;
            var orderArr = computeWorksDisplayOrder();
            if (!orderArr) return;
            var items = list.querySelectorAll(':scope > li');
            items.forEach(function (li) {
              var a = li.querySelector('a[href*="/collections/works/entries/"]');
              if (!a) return;
              var m = (a.getAttribute('href') || '').match(/\/entries\/([^/?]+)/);
              var slug = m ? decodeURIComponent(m[1]) : null;
              var idx = slug ? orderArr.indexOf(slug) : -1;
              li.style.order = idx >= 0 ? String(idx) : '9999';
            });
          } catch (e) {}
        }

        var worksListOrderObserver = new MutationObserver(applyWorksListOrder);
        worksListOrderObserver.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('hashchange', applyWorksListOrder);
        (function watchStoreForWorksListOrder() {
          var store = findDecapReduxStore();
          if (store) {
            store.subscribe(applyWorksListOrder);
            applyWorksListOrder();
          } else {
            setTimeout(watchStoreForWorksListOrder, 500);
          }
        })();

        // ==================================================================
        // 21) タイトル入力からURL用識別子（slug）へのヘボン式ローマ字
        //     自動変換（9.40）。
        //
        //     対象：「お知らせ投稿」「実績・活用事例作成」の`title`→
        //     `urlSlug`フィールド（config.ymlのpattern: ^[a-z0-9-]+$）。
        //     `preSave`（9.3）は空欄のまま保存された場合にランダムな
        //     識別子で穴埋めするだけの安全策で、入力中のリアルタイム
        //     補完は行っていなかった。ここでは「タイトル入力のたびに、
        //     まだ手で編集されていないurlSlugへローマ字変換した値を
        //     自動反映する」補助機能を追加する。
        //
        //     漢字の読み変換について：ひらがな・カタカナ→ローマ字の
        //     変換表（下記KANA_ROMAJI）は静的な文字対応表のみで実現できる
        //     が、漢字の読み（音訓・熟字訓）を機械的に一意特定するには
        //     形態素解析＋辞書（kuromoji等、数MB規模の辞書データを含む）
        //     が必要で、この管理画面の軽量なJS構成（外部ライブラリを
        //     読み込まない既存方針に近い形を維持したい）にはそぐわない。
        //     そのため本機能は「ひらがな・カタカナ部分のみヘボン式で
        //     変換し、漢字・記号など変換できない文字はハイフンとして
        //     除去する」設計にした（例：「ご挨拶」→「挨拶」部分は漢字の
        //     ため除去され「go」のみ残る、「今年もお世話になりました」の
        //     ような漢字混じりタイトルは断片的なローマ字になる）。
        //     あくまで「叩き台の自動入力」であり、要件どおり保存前に
        //     手動で微調整できる（このフィールドへユーザーが一度でも
        //     直接入力すると、以後はそのエントリでは自動上書きを止める）。
        // ==================================================================
        var KANA_DIGRAPHS = {
          きゃ: 'kya', きゅ: 'kyu', きょ: 'kyo',
          しゃ: 'sha', しゅ: 'shu', しょ: 'sho',
          ちゃ: 'cha', ちゅ: 'chu', ちょ: 'cho',
          にゃ: 'nya', にゅ: 'nyu', にょ: 'nyo',
          ひゃ: 'hya', ひゅ: 'hyu', ひょ: 'hyo',
          みゃ: 'mya', みゅ: 'myu', みょ: 'myo',
          りゃ: 'rya', りゅ: 'ryu', りょ: 'ryo',
          ぎゃ: 'gya', ぎゅ: 'gyu', ぎょ: 'gyo',
          じゃ: 'ja', じゅ: 'ju', じょ: 'jo',
          びゃ: 'bya', びゅ: 'byu', びょ: 'byo',
          ぴゃ: 'pya', ぴゅ: 'pyu', ぴょ: 'pyo',
          ぢゃ: 'ja', ぢゅ: 'ju', ぢょ: 'jo',
          キャ: 'kya', キュ: 'kyu', キョ: 'kyo',
          シャ: 'sha', シュ: 'shu', ショ: 'sho',
          チャ: 'cha', チュ: 'chu', チョ: 'cho',
          ニャ: 'nya', ニュ: 'nyu', ニョ: 'nyo',
          ヒャ: 'hya', ヒュ: 'hyu', ヒョ: 'hyo',
          ミャ: 'mya', ミュ: 'myu', ミョ: 'myo',
          リャ: 'rya', リュ: 'ryu', リョ: 'ryo',
          ギャ: 'gya', ギュ: 'gyu', ギョ: 'gyo',
          ジャ: 'ja', ジュ: 'ju', ジョ: 'jo',
          ビャ: 'bya', ビュ: 'byu', ビョ: 'byo',
          ピャ: 'pya', ピュ: 'pyu', ピョ: 'pyo',
          ファ: 'fa', フィ: 'fi', フェ: 'fe', フォ: 'fo',
          ティ: 'ti', ディ: 'di', トゥ: 'tu', ドゥ: 'du',
          ウィ: 'wi', ウェ: 'we', ウォ: 'wo',
          チェ: 'che', シェ: 'she', ジェ: 'je',
        };
        var KANA_SINGLE = {
          あ: 'a', い: 'i', う: 'u', え: 'e', お: 'o',
          か: 'ka', き: 'ki', く: 'ku', け: 'ke', こ: 'ko',
          さ: 'sa', し: 'shi', す: 'su', せ: 'se', そ: 'so',
          た: 'ta', ち: 'chi', つ: 'tsu', て: 'te', と: 'to',
          な: 'na', に: 'ni', ぬ: 'nu', ね: 'ne', の: 'no',
          は: 'ha', ひ: 'hi', ふ: 'fu', へ: 'he', ほ: 'ho',
          ま: 'ma', み: 'mi', む: 'mu', め: 'me', も: 'mo',
          や: 'ya', ゆ: 'yu', よ: 'yo',
          ら: 'ra', り: 'ri', る: 'ru', れ: 're', ろ: 'ro',
          わ: 'wa', を: 'o', ん: 'n',
          が: 'ga', ぎ: 'gi', ぐ: 'gu', げ: 'ge', ご: 'go',
          ざ: 'za', じ: 'ji', ず: 'zu', ぜ: 'ze', ぞ: 'zo',
          だ: 'da', ぢ: 'ji', づ: 'zu', で: 'de', ど: 'do',
          ば: 'ba', び: 'bi', ぶ: 'bu', べ: 'be', ぼ: 'bo',
          ぱ: 'pa', ぴ: 'pi', ぷ: 'pu', ぺ: 'pe', ぽ: 'po',
          ア: 'a', イ: 'i', ウ: 'u', エ: 'e', オ: 'o',
          カ: 'ka', キ: 'ki', ク: 'ku', ケ: 'ke', コ: 'ko',
          サ: 'sa', シ: 'shi', ス: 'su', セ: 'se', ソ: 'so',
          タ: 'ta', チ: 'chi', ツ: 'tsu', テ: 'te', ト: 'to',
          ナ: 'na', ニ: 'ni', ヌ: 'nu', ネ: 'ne', ノ: 'no',
          ハ: 'ha', ヒ: 'hi', フ: 'fu', ヘ: 'he', ホ: 'ho',
          マ: 'ma', ミ: 'mi', ム: 'mu', メ: 'me', モ: 'mo',
          ヤ: 'ya', ユ: 'yu', ヨ: 'yo',
          ラ: 'ra', リ: 'ri', ル: 'ru', レ: 're', ロ: 'ro',
          ワ: 'wa', ヲ: 'o', ン: 'n',
          ガ: 'ga', ギ: 'gi', グ: 'gu', ゲ: 'ge', ゴ: 'go',
          ザ: 'za', ジ: 'ji', ズ: 'zu', ゼ: 'ze', ゾ: 'zo',
          ダ: 'da', ヂ: 'ji', ヅ: 'zu', デ: 'de', ド: 'do',
          バ: 'ba', ビ: 'bi', ブ: 'bu', ベ: 'be', ボ: 'bo',
          パ: 'pa', ピ: 'pi', プ: 'pu', ペ: 'pe', ポ: 'po',
        };
        var KANA_SMALL_TSU = { っ: true, ッ: true };

        function kanaToRomaji(input) {
          var out = '';
          var chars = Array.from(String(input || ''));
          for (var i = 0; i < chars.length; i++) {
            var ch = chars[i];
            var next = chars[i + 1];
            var pair = next ? ch + next : null;
            if (pair && KANA_DIGRAPHS[pair]) {
              out += KANA_DIGRAPHS[pair];
              i++;
              continue;
            }
            if (KANA_SMALL_TSU[ch]) {
              // 促音（っ/ッ）：直後の子音を重ねる。次の1文字（または
              // 直後が拗音の場合はその変換結果）の先頭子音を複製する。
              var followingPair = next && chars[i + 2] ? next + chars[i + 2] : null;
              var followingRomaji = (followingPair && KANA_DIGRAPHS[followingPair]) || (next && KANA_SINGLE[next]) || '';
              var firstConsonant = followingRomaji.replace(/^([^aiueo]).*$/, '$1');
              if (firstConsonant && firstConsonant !== followingRomaji) out += firstConsonant;
              continue;
            }
            if (ch === 'ー') {
              // 長音記号：直前の母音を繰り返す（無ければ何もしない）。
              var lastVowelMatch = out.match(/([aiueo])[^aiueo]*$/);
              if (lastVowelMatch) out += lastVowelMatch[1];
              continue;
            }
            if (KANA_SINGLE[ch]) {
              out += KANA_SINGLE[ch];
              continue;
            }
            // 変換できない文字（漢字・記号・半角英数字など）はそのまま
            // 残す（半角英数字はslugifyステップでそのまま使われ、それ
            // 以外はハイフンに正規化される）。
            out += ch;
          }
          return out;
        }

        // ==================================================================
        // 21b) 漢字を含むタイトルの正しいローマ字変換（kuromoji.js、2026-09）。
        //
        //     ひらがな・カタカナだけの静的な文字対応表では、漢字の読み
        //     （音訓・熟字訓）を一意に特定できない（例：「私」は文脈に
        //     関わらず必ず「わたし」と読むわけではなく、機械的な変換
        //     表では原理的に対応不可能）。これには形態素解析＋辞書が
        //     必要なため、軽量なkuromoji.js（IPADIC辞書同梱）をCDN経由で
        //     遅延読み込みする。
        //
        //     読み込みタイミング：管理画面の全画面で無条件に読み込むと
        //     辞書データ（gzip圧縮で合計十数MB、初回ビルド時に分割
        //     ダウンロード）が無駄になるため、実際に「お知らせ投稿」
        //     「実績・活用事例作成」の編集画面を開いたときにのみ
        //     バックグラウンドで読み込みを開始する（`wireTitleToSlugAutoFill`
        //     から呼び出す）。読み込み中にユーザーがタイトルを入力した
        //     場合は、まず`kanaToRomaji`（ひらがな・カタカナのみ対応、
        //     漢字はハイフン化）による即時の暫定変換を反映し、辞書の
        //     読み込みが完了した時点で、現在表示中のタイトル値を使って
        //     正しい読みベースの変換に「格上げ」する（ユーザーが既に
        //     手動でurlSlugを編集していた場合は上書きしない＝既存の
        //     「手動編集を上書きしない」原則をそのまま踏襲）。
        //
        //     失敗時（CDN到達不能等）は例外を握りつぶし、暫定変換
        //     （ひらがな・カタカナのみ）のまま動作を継続する（安全側の
        //     フォールバック。機能が完全に止まることはない）。
        // ==================================================================
        var kuromojiTokenizer = null;
        var kuromojiLoadStarted = false;
        var kuromojiReadyCallbacks = [];

        function loadKuromojiTokenizer(onReady) {
          if (kuromojiTokenizer) {
            onReady(kuromojiTokenizer);
            return;
          }
          kuromojiReadyCallbacks.push(onReady);
          if (kuromojiLoadStarted) return;
          kuromojiLoadStarted = true;
          try {
            var script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js';
            script.onload = function () {
              try {
                window.kuromoji
                  .builder({ dicPath: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/' })
                  .build(function (err, tokenizer) {
                    if (err || !tokenizer) return;
                    kuromojiTokenizer = tokenizer;
                    kuromojiReadyCallbacks.forEach(function (cb) {
                      try {
                        cb(tokenizer);
                      } catch (e) {}
                    });
                    kuromojiReadyCallbacks = [];
                  });
              } catch (e) {}
            };
            script.onerror = function () {};
            document.head.appendChild(script);
          } catch (e) {}
        }

        // タイトルをkuromojiで単語（形態素）に分割し、各単語ごとの
        // カタカナ読み（読みが取得できない記号・数字等は表記そのまま）を
        // 配列で返す。未ロードの場合はnullを返す（＝呼び出し側で
        // kanaToRomajiによる暫定変換にフォールバックする）。
        // 単語単位で配列を保持しておく理由：`私は学生です`のような
        // 複数単語のタイトルを`watashi-ha-gakusei-desu`のように単語
        // 境界でハイフン区切りにするため（読み全体を1本の文字列として
        // 連結してからローマ字化すると`watashihagakuseidesu`のように
        // 単語の切れ目が失われ可読性が落ちる）。
        function resolveTitleReadingTokens(title) {
          if (!kuromojiTokenizer || !title) return null;
          try {
            var tokens = kuromojiTokenizer.tokenize(title);
            return tokens.map(function (t) {
              return t.reading && t.reading !== '*' ? t.reading : t.surface_form;
            });
          } catch (e) {
            return null;
          }
        }

        function slugifyRomaji(romaji) {
          return romaji
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '')
            .replace(/-{2,}/g, '-');
        }

        function titleToSlug(title) {
          var readingTokens = resolveTitleReadingTokens(title);
          if (readingTokens) {
            var parts = readingTokens
              .map(function (reading) {
                return slugifyRomaji(kanaToRomaji(reading));
              })
              .filter(function (part) {
                return part;
              });
            return parts.join('-').replace(/-{2,}/g, '-');
          }
          // kuromoji未ロード時の暫定フォールバック：ひらがな・カタカナ
          // だけを変換し、漢字等はslugify段階でハイフン化する。
          return slugifyRomaji(kanaToRomaji(title || ''));
        }

        // Reactの管理下にある<input>へ、Reactのイベントハンドラが正しく
        // 検知できる形で値を書き込む（直接 .value に代入するだけでは
        // Reactの内部トラッキングをすり抜けて表示が更新されない・保存
        // 内容に反映されないため、ネイティブのsetterを経由してから
        // 'input'イベントを発火させる必要がある。React管理下のフォーム
        // 要素を外部から操作する際の定石）。
        function setReactInputValue(input, value) {
          var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
          setter.call(input, value);
          input.dispatchEvent(new Event('input', { bubbles: true }));
        }

        var SLUG_AUTOFILL_COLLECTIONS = ['works', 'news'];

        function wireTitleToSlugAutoFill() {
          try {
            var m = location.hash.match(/^#\/collections\/([^/]+)/);
            var collectionName = m ? m[1] : null;
            if (!collectionName || SLUG_AUTOFILL_COLLECTIONS.indexOf(collectionName) === -1) return;
            // 画面を開いた時点で辞書の読み込みを裏で開始しておく
            // （ユーザーが実際にタイトルを打ち始める頃には読み込みが
            // 済んでいる可能性を高めるため）。
            loadKuromojiTokenizer(function () {});
            var titleWrap = document.querySelector('[id^="title-field-"]');
            var slugWrap = document.querySelector('[id^="urlSlug-field-"]');
            if (!titleWrap || !slugWrap) return;
            var titleInput = titleWrap.tagName === 'INPUT' ? titleWrap : titleWrap.querySelector('input');
            var slugInput = slugWrap.tagName === 'INPUT' ? slugWrap : slugWrap.querySelector('input');
            if (!titleInput || !slugInput) return;
            if (titleInput.dataset.cmsSlugAutofillWired) return;
            titleInput.dataset.cmsSlugAutofillWired = '1';

            // 既にurlSlugへ値が入っている状態で開いた場合（既存エントリの
            // 編集等）は、その時点の値を「最後の自動入力値」として扱う
            // ことで、無関係な既存の手動入力を上書きしないようにする。
            var lastAutoSlug = slugInput.value || '';

            slugInput.addEventListener('input', function () {
              if (slugInput.dataset.cmsSlugAutofilling === '1') {
                delete slugInput.dataset.cmsSlugAutofilling;
                return;
              }
              // ユーザー自身がurlSlugを直接編集した＝以後は自動上書きを
              // 停止する（「手動で微修正できる」という要件を満たす）。
              lastAutoSlug = null;
            });

            function applySlugFromCurrentTitle() {
              if (lastAutoSlug === null) return;
              if (slugInput.value !== '' && slugInput.value !== lastAutoSlug) return;
              var newSlug = titleToSlug(titleInput.value);
              if (newSlug === slugInput.value) return;
              slugInput.dataset.cmsSlugAutofilling = '1';
              setReactInputValue(slugInput, newSlug);
              lastAutoSlug = newSlug;
            }

            titleInput.addEventListener('input', applySlugFromCurrentTitle);

            // 辞書の読み込みがタイピング中に完了した場合、現在の
            // タイトル値で読み直して変換結果を「格上げ」する（既に
            // 手動編集済みなら`applySlugFromCurrentTitle`内の
            // `lastAutoSlug === null`判定で自動的にスキップされる）。
            loadKuromojiTokenizer(function () {
              if (document.body.contains(titleInput)) applySlugFromCurrentTitle();
            });
          } catch (e) {}
        }

        wireTitleToSlugAutoFill();
        setInterval(wireTitleToSlugAutoFill, 1000);
        window.addEventListener('hashchange', wireTitleToSlugAutoFill);
      })();
    </script>
